                          lastUpstreamStatusCode = resp.code
                          lastUpstreamUrl = finalUrl
                      }
                      val contentType = resp.header("Content-Type") ?: guessMimeFromUrl(finalUrl, activeMimeType)
                      val lowerType = contentType.lowercase(Locale.US)
                      val finalPathNoQuery = resp.request.url.encodedPath.lowercase(Locale.US)
                      val isHlsPlaylist = resp.isSuccessful && (
                          lowerType.contains("mpegurl") ||
