              fun inspectAndPrimeHlsVodCache(): HlsVodMetadata {
                  val target = activeRemoteUrl
                  if (target.isBlank() || activeToken.isBlank()) return HlsVodMetadata()
                  return try {
                      val masterOrMediaOutcome = fetchAndCacheM3u8(
                          target,
                          useProbeTimeout = true,
                          allowCache = true,
                          stageLabel = "MASTER_M3U8"
                      )
                      val firstEntry = masterOrMediaOutcome.entry ?: return HlsVodMetadata()
                      val vodMeta = if (firstEntry.isMasterPlaylist && !firstEntry.chosenVariantTargetUrl.isNullOrBlank()) {
                          val variantOutcome = fetchAndCacheM3u8(
                              firstEntry.chosenVariantTargetUrl,
                              useProbeTimeout = true,
                              allowCache = true,
                              stageLabel = "VARIANT_M3U8"
                          )
                          variantOutcome.entry?.vodMeta ?: HlsVodMetadata()
                      } else {
                          firstEntry.vodMeta
                      }
                      activeIsHlsVod = vodMeta.isVod
                      vodMeta
                  } catch (_: Throwable) {
                      HlsVodMetadata(isVod = false, durationSec = 0)
                  }
              }

              private data class UpstreamResponse(
                  val code: Int,
                  val message: String,
                  val finalUrl: String,
                  val engineName: String,
                  val headers: Map<String, List<String>>,
                  val decompressedByEngine: Boolean,
                  val bodyStream: InputStream?,
                  private val closeAction: () -> Unit
              ) : Closeable {
                  fun header(name: String): String? = headers[name.lowercase(Locale.US)]?.lastOrNull()
                  val isSuccessful: Boolean
                      get() = code in 200..299
                  fun readBodyText(): String = bodyStream?.bufferedReader(StandardCharsets.UTF_8)?.use { it.readText() } ?: ""
                  override fun close() {
                      try {
                          bodyStream?.close()
                      } catch (_: Throwable) {
                      }
                      try {
                          closeAction()
                      } catch (_: Throwable) {
                      }
                  }
              }

              private fun fetchAndCacheM3u8(
                  targetUrl: String,
                  useProbeTimeout: Boolean,
                  allowCache: Boolean = true,
                  stageLabel: String = "M3U8"
              ): M3u8FetchOutcome {
                  val cleanUrl = targetUrl.trim()
                  val tokenSnap = activeToken
                  val cacheKey = "$tokenSnap|$cleanUrl"
                  val lock = m3u8FetchLocks.getOrPut(cacheKey) { Any() }

                  synchronized(lock) {
                      val now = System.currentTimeMillis()
                      if (allowCache) {
                          val cached = m3u8Cache[cacheKey]
                          if (cached != null && cached.expiresAtMs > now) {
                              return M3u8FetchOutcome(entry = cached, statusCode = 200, statusMessage = "OK")
                          }
                      }

                      val fallbackClient = if (useProbeTimeout) probeHttpClient else sharedHttpClient
                      val resp = executeRequestWith403SmartRetry(
                          fallbackOkClient = fallbackClient,
                          cleanUrl = cleanUrl,
                          baseHeaders = activeHeaders,
                          isHeadMethod = false,
                          clientRange = null,
                          isSegment = false,
                          stage = stageLabel,
                          timeoutMs = if (useProbeTimeout) 5_000L else 15_000L
                      )
                      resp.use { r ->
                          val finalUrl = r.finalUrl
                          if (!r.isSuccessful || r.bodyStream == null) {
                              recordUpstreamFailure(r, stageLabel, extractHost(finalUrl))
                              return M3u8FetchOutcome(
                                  entry = null,
                                  statusCode = r.code,
                                  statusMessage = r.message.ifBlank { "HTTP ${r.code}" }
                              )
                          }
                          val playlistText = r.readBodyText()
                          val finalPathLower = try { URI.create(finalUrl).path?.lowercase(Locale.US).orEmpty() } catch (_: Throwable) { "" }
                          val looksValidPlaylist = playlistText.trimStart().startsWith("#EXTM3U") ||
                              finalPathLower.endsWith(".m3u8")
                          if (!looksValidPlaylist) {
                              return M3u8FetchOutcome(entry = null, statusCode = 0, statusMessage = "NOT_M3U8")
                          }

                          activeM3u8FinalUrl = finalUrl
                          val lines = playlistText.split("\n").map { it.trimEnd('\r') }
                          val rewriteRes = rewriteM3u8Playlist(playlistText, finalUrl)
                          val vodMeta = if (!rewriteRes.isMasterPlaylist) {
                              parseVodEndListAndDuration(lines)
                          } else {
                              HlsVodMetadata()
                          }
                          val bytes = rewriteRes.rewrittenText.toByteArray(StandardCharsets.UTF_8)
                          val entry = CachedM3u8Entry(
                              rewrittenBytes = bytes,
                              vodMeta = vodMeta,
                              isMasterPlaylist = rewriteRes.isMasterPlaylist,
                              chosenVariantTargetUrl = rewriteRes.chosenVariantTargetUrl,
                              expiresAtMs = System.currentTimeMillis() + M3U8_CACHE_TTL_MS
                          )
                          if (tokenSnap.isNotEmpty() && tokenSnap == activeToken) {
                              m3u8Cache[cacheKey] = entry
                          }
                          clearUpstreamFailure()
                          return M3u8FetchOutcome(entry = entry, statusCode = 200, statusMessage = "OK")
                      }
                  }
              }

              private fun parseVodEndListAndDuration(lines: List<String>): HlsVodMetadata {
                  var hasEndList = false
                  var totalSecDouble = 0.0
                  for (line in lines) {
                      val trimmed = line.trim()
                      if (trimmed.startsWith("#EXT-X-ENDLIST", ignoreCase = true)) {
                          hasEndList = true
                      } else if (trimmed.startsWith("#EXTINF:", ignoreCase = true)) {
                          val m = EXTINF_DURATION_REGEX.find(trimmed)
                          val sec = m?.groupValues?.getOrNull(1)?.toDoubleOrNull() ?: 0.0
                          if (sec > 0.0) {
                              totalSecDouble += sec
                          }
                      }
                  }
                  val totalSec = totalSecDouble.roundToInt().coerceAtLeast(0)
                  return HlsVodMetadata(isVod = hasEndList && totalSec > 0, durationSec = if (hasEndList) totalSec else 0)
              }

              private fun extractHost(urlStr: String): String {
                  return try {
                      URI.create(urlStr).host?.lowercase(Locale.US).orEmpty()
                  } catch (_: Throwable) {
                      ""
                  }
              }

              private fun extractPathTail(urlStr: String): String {
                  return try {
                      val path = URI.create(urlStr).path?.trimEnd('/').orEmpty()
                      val seg = path.substringAfterLast('/', "")
                      if (seg.isNotBlank()) seg.takeLast(44) else ""
                  } catch (_: Throwable) {
                      ""
                  }
              }

              private fun isPollutedAdReferer(urlStr: String): Boolean {
                  val host = extractHost(urlStr)
                  if (host.isBlank()) return false
                  return POLLUTED_AD_KEYWORDS.any { host.contains(it) }
              }

              private fun extractServerHint(resp: UpstreamResponse): String {
                  val server = resp.header("server")?.trim().orEmpty()
                  val cfMitigated = resp.header("cf-mitigated")?.trim().orEmpty()
                  val cfRay = resp.header("cf-ray")?.trim().orEmpty()
                  val parts = ArrayList<String>(3)
                  if (server.isNotBlank()) parts.add(server)
                  if (cfMitigated.isNotBlank()) {
                      parts.add(cfMitigated)
                  } else if (cfRay.isNotBlank() && !server.contains("cloudflare", ignoreCase = true)) {
                      parts.add("cf-ray")
                  }
                  return parts.joinToString(" • ")
              }

              private fun recordUpstreamFailure(resp: UpstreamResponse, stage: String, fallbackHost: String = "") {
                  val finalUrl = resp.finalUrl
                  lastUpstreamStatusCode = resp.code
                  lastUpstreamUrl = finalUrl
                  lastUpstreamFailedHost = extractHost(finalUrl).ifBlank { fallbackHost }
                  lastUpstreamServerHint = extractServerHint(resp)
                  lastUpstreamEngine = resp.engineName
                  lastUpstreamStage = stage
                  lastUpstreamPathTail = extractPathTail(finalUrl)
              }

              private fun clearUpstreamFailure() {
                  lastUpstreamStatusCode = 0
                  lastUpstreamUrl = ""
                  lastUpstreamFailedHost = ""
                  lastUpstreamServerHint = ""
                  lastUpstreamEngine = ""
                  lastUpstreamStage = ""
                  lastUpstreamPathTail = ""
              }

              private fun sameRootHost(url1: String, url2: String): Boolean {
                  val h1 = extractHost(url1)
                  val h2 = extractHost(url2)
                  if (h1.isBlank() || h2.isBlank()) return false
                  if (h1 == h2) return true
                  val r1 = h1.split('.').takeLast(2).joinToString(".")
                  val r2 = h2.split('.').takeLast(2).joinToString(".")
                  return r1.isNotBlank() && r1 == r2
              }

              private fun sanitizeBaseHeaders(rawHeaders: Map<String, String>): Map<String, String> {
                  val out = HashMap<String, String>(rawHeaders.size)
                  var pollutedRefererHost = ""
                  for ((k, v) in rawHeaders) {
                      val lower = k.lowercase(Locale.US)
                      if (lower == "x-requested-with") continue
                      if (lower == "referer" && isPollutedAdReferer(v)) {
                          pollutedRefererHost = extractHost(v)
                          continue
                      }
                      if (lower == "origin" && isPollutedAdReferer(v)) {
                          continue
                      }
                      out[k] = v
                  }
                  if (pollutedRefererHost.isNotBlank()) {
                      out.entries.removeAll { it.key.equals("Origin", ignoreCase = true) && it.value.contains(pollutedRefererHost, ignoreCase = true) }
                  }
                  return out
              }

              private fun buildUpstreamHeadersMap(
                  cleanUrl: String,
                  headers: Map<String, String>,
                  omitCookies: Boolean = false,
                  omitOrigin: Boolean = false,
                  omitReferer: Boolean = false
              ): LinkedHashMap<String, String> {
                  val result = LinkedHashMap<String, String>()
                  var hasUserAgent = false
                  var hasAccept = false
                  var hasAcceptLanguage = false
                  var hasCookie = false

                  for ((k, v) in headers) {
                      val trimmedKey = k.trim()
                      val trimmedVal = v.trim()
                      if (trimmedKey.isBlank() || trimmedVal.isBlank()) continue
                      val lower = trimmedKey.lowercase(Locale.US)
                      if (lower in HOP_BY_HOP_HEADERS || lower == "range" || lower == "content-length") continue
                      if (omitReferer && (lower == "referer" || lower == "referrer")) continue
                      if (omitOrigin && lower == "origin") continue
                      if (omitCookies && lower == "cookie") continue
                      if (lower == "user-agent") hasUserAgent = true
                      if (lower == "accept") hasAccept = true
                      if (lower == "accept-language") hasAcceptLanguage = true
                      if (lower == "cookie") hasCookie = true
                      result[trimmedKey] = trimmedVal
                  }

                  if (!hasUserAgent) {
                      result["User-Agent"] = DEFAULT_USER_AGENT
                  }
                  if (!hasAccept) {
                      result["Accept"] = "*/*"
                  }
                  if (!hasAcceptLanguage) {
                      result["Accept-Language"] = "ar,en-US;q=0.9,en;q=0.8"
                  }
                  if (!omitCookies && !hasCookie) {
                      val httpUrl = cleanUrl.toHttpUrlOrNull()
                      if (httpUrl != null) {
                          val jarCookies = sessionCookieJar.loadForRequest(httpUrl)
                          if (jarCookies.isNotEmpty()) {
                              result["Cookie"] = jarCookies.joinToString("; ") { "${it.name}=${it.value}" }
                          }
                      }
                  }
                  return result
              }

              private fun buildRequestBuilderWithHeaders(
                  cleanUrl: String,
                  headers: Map<String, String>,
                  omitCookies: Boolean = false,
                  omitOrigin: Boolean = false,
                  omitReferer: Boolean = false,
                  forceIdentityEncoding: Boolean = false
              ): Request.Builder {
                  val resolvedMap = buildUpstreamHeadersMap(
                      cleanUrl = cleanUrl,
                      headers = headers,
                      omitCookies = omitCookies,
                      omitOrigin = omitOrigin,
                      omitReferer = omitReferer
                  )
                  val reqBuilder = Request.Builder().url(cleanUrl)
                  for ((k, v) in resolvedMap) {
                      reqBuilder.header(k, v)
                  }
                  if (forceIdentityEncoding) {
                      reqBuilder.header("Accept-Encoding", "identity")
                  }
                  return reqBuilder
              }

              private class CronetQueuedInputStream(
                  private val queue: ArrayBlockingQueue<Any>,
                  private val closedFlag: AtomicBoolean,
                  private val onCloseCancel: () -> Unit
              ) : InputStream() {
                  private var currentChunk: ByteArray? = null
                  private var currentPos = 0
                  private var reachedEof = false

                  override fun read(): Int {
                      val single = ByteArray(1)
                      val n = read(single, 0, 1)
                      return if (n <= 0) -1 else (single[0].toInt() and 0xFF)
                  }

                  override fun read(b: ByteArray, off: Int, len: Int): Int {
                      if (len == 0) return 0
                      if (reachedEof || closedFlag.get()) return -1

                      while (currentChunk == null || currentPos >= currentChunk!!.size) {
                          if (closedFlag.get()) return -1
                          val item = try {
                              queue.take()
                          } catch (_: InterruptedException) {
                              Thread.currentThread().interrupt()
                              return -1
                          }
                          when (item) {
                              is ByteArray -> {
                                  if (item.isNotEmpty()) {
                                      currentChunk = item
                                      currentPos = 0
                                  }
                              }
                              is IOException -> throw item
                              is Throwable -> throw IOException(item.message ?: "Cronet stream error", item)
                              else -> {
                                  reachedEof = true
                                  return -1
                              }
                          }
                      }

                      val chunk = currentChunk!!
                      val available = chunk.size - currentPos
                      val toCopy = minOf(len, available)
                      System.arraycopy(chunk, currentPos, b, off, toCopy)
                      currentPos += toCopy
                      return toCopy
                  }

                  override fun close() {
                      if (closedFlag.compareAndSet(false, true)) {
                          queue.clear()
                          queue.offer(Unit)
                          onCloseCancel()
                      }
                  }
              }

              private fun saveSetCookiesFromHeaders(urlStr: String, setCookieValues: List<String>?) {
                  if (setCookieValues.isNullOrEmpty()) return
                  val httpUrl = urlStr.toHttpUrlOrNull() ?: return
                  val parsed = ArrayList<Cookie>(setCookieValues.size)
                  for (raw in setCookieValues) {
                      val cookie = Cookie.parse(httpUrl, raw)
                      if (cookie != null) parsed.add(cookie)
                  }
                  if (parsed.isNotEmpty()) {
                      sessionCookieJar.saveFromResponse(httpUrl, parsed)
                  }
              }

              private fun executeWithCronet(
                  engine: CronetEngine,
                  cleanUrl: String,
                  headers: Map<String, String>,
                  isHeadMethod: Boolean,
                  clientRange: String?,
                  omitCookies: Boolean,
                  omitOrigin: Boolean,
                  omitReferer: Boolean,
                  timeoutMs: Long
              ): UpstreamResponse {
                  val headerMap = buildUpstreamHeadersMap(
                      cleanUrl = cleanUrl,
                      headers = headers,
                      omitCookies = omitCookies,
                      omitOrigin = omitOrigin,
                      omitReferer = omitReferer
                  )
                  val headersLatch = CountDownLatch(1)
                  val queue = ArrayBlockingQueue<Any>(CRONET_QUEUE_CAPACITY)
                  val closedFlag = AtomicBoolean(false)
                  val eofSentinel = Unit
                  val directBuf = if (isHeadMethod) null else ByteBuffer.allocateDirect(CRONET_READ_BUFFER_BYTES)

                  val startedInfoRef = AtomicReference<UrlResponseInfo?>(null)
                  val startErrorRef = AtomicReference<Throwable?>(null)
                  val currentFinalUrlRef = AtomicReference(cleanUrl)
                  val redirectCountRef = AtomicInteger(0)

                  fun enqueueBlocking(item: Any): Boolean {
                      while (!closedFlag.get()) {
                          try {
                              if (queue.offer(item, 200, TimeUnit.MILLISECONDS)) {
                                  return true
                              }
                          } catch (_: InterruptedException) {
                              Thread.currentThread().interrupt()
                              return false
                          }
                      }
                      return false
                  }

                  val reqBuilder = engine.newUrlRequestBuilder(
                      cleanUrl,
                      object : UrlRequest.Callback() {
                          override fun onRedirectReceived(request: UrlRequest, info: UrlResponseInfo, newLocationUrl: String) {
                              saveSetCookiesFromHeaders(currentFinalUrlRef.get(), info.allHeaders["set-cookie"])
                              val count = redirectCountRef.incrementAndGet()
                              if (count > CRONET_MAX_REDIRECTS || closedFlag.get()) {
                                  startErrorRef.set(IOException("Too many redirects ($count)"))
                                  request.cancel()
                                  headersLatch.countDown()
                                  return
                              }
                              currentFinalUrlRef.set(newLocationUrl)
                              request.followRedirect()
                          }

                          override fun onResponseStarted(request: UrlRequest, info: UrlResponseInfo) {
                              val resolvedUrl = info.url ?: currentFinalUrlRef.get()
                              currentFinalUrlRef.set(resolvedUrl)
                              saveSetCookiesFromHeaders(resolvedUrl, info.allHeaders["set-cookie"])
                              startedInfoRef.set(info)
                              headersLatch.countDown()
                              if (isHeadMethod || closedFlag.get() || directBuf == null) {
                                  request.cancel()
                                  return
                              }
                              directBuf.clear()
                              request.read(directBuf)
                          }

                          override fun onReadCompleted(request: UrlRequest, info: UrlResponseInfo, byteBuffer: ByteBuffer) {
                              if (closedFlag.get()) {
                                  request.cancel()
                                  return
                              }
                              byteBuffer.flip()
                              val remaining = byteBuffer.remaining()
                              if (remaining > 0) {
                                  val copy = ByteArray(remaining)
                                  byteBuffer.get(copy)
                                  if (!enqueueBlocking(copy)) {
                                      request.cancel()
                                      return
                                  }
                              }
                              if (closedFlag.get()) {
                                  request.cancel()
                                  return
                              }
                              byteBuffer.clear()
                              request.read(byteBuffer)
                          }

                          override fun onSucceeded(request: UrlRequest, info: UrlResponseInfo) {
                              enqueueBlocking(eofSentinel)
                          }

                          override fun onFailed(request: UrlRequest, info: UrlResponseInfo?, error: CronetException) {
                              if (startedInfoRef.get() == null) {
                                  startErrorRef.set(error)
                                  headersLatch.countDown()
                              } else {
                                  enqueueBlocking(error)
                              }
                          }

                          override fun onCanceled(request: UrlRequest, info: UrlResponseInfo?) {
                              if (startedInfoRef.get() == null && startErrorRef.get() == null) {
                                  startErrorRef.set(IOException("Request canceled"))
                                  headersLatch.countDown()
                              }
                              queue.offer(eofSentinel)
                          }
                      },
                      cronetCallbackExecutor
                  )

                  reqBuilder.setHttpMethod(if (isHeadMethod) "HEAD" else "GET")
                  // عدم إضافة Accept-Encoding يدوياً لطلبات Cronet حتى يدير Brotli/Gzip ويفك الضغط تلقائياً
                  for ((k, v) in headerMap) {
                      if (!k.equals("Accept-Encoding", ignoreCase = true)) {
                          reqBuilder.addHeader(k, v)
                      }
                  }
                  if (!clientRange.isNullOrBlank()) {
                      reqBuilder.addHeader("Range", clientRange)
                  }

                  val urlRequest = reqBuilder.build()
                  urlRequest.start()

                  val waitOk = try {
                      headersLatch.await(timeoutMs, TimeUnit.MILLISECONDS)
                  } catch (ie: InterruptedException) {
                      Thread.currentThread().interrupt()
                      urlRequest.cancel()
                      throw IOException("Interrupted waiting for Cronet headers", ie)
                  }
                  if (!waitOk) {
                      closedFlag.set(true)
                      urlRequest.cancel()
                      throw SocketTimeoutException("Cronet timeout waiting for response headers")
                  }
                  startErrorRef.get()?.let {
                      closedFlag.set(true)
                      urlRequest.cancel()
                      throw it
                  }
                  val info = startedInfoRef.get() ?: throw IOException("Cronet response info missing")

                  val lowerHeaders = HashMap<String, MutableList<String>>()
                  var rawContentEncoding = ""
                  for ((k, list) in info.allHeaders) {
                      val lk = k.lowercase(Locale.US)
                      if (lk == "content-encoding") {
                          rawContentEncoding = list.lastOrNull()?.trim().orEmpty()
                      }
                      lowerHeaders.getOrPut(lk) { ArrayList(list.size) }.addAll(list)
                  }
                  val decodedByCronet = !isHeadMethod &&
                      rawContentEncoding.isNotBlank() &&
                      !rawContentEncoding.equals("identity", ignoreCase = true)
                  if (decodedByCronet) {
                      // إزالة Content-Encoding و Content-Length المضغوط القديم بعد فك الضغط التلقائي في Cronet
                      lowerHeaders.remove("content-encoding")
                      lowerHeaders.remove("content-length")
                  }

                  val stream = if (isHeadMethod) {
                      closedFlag.set(true)
                      urlRequest.cancel()
                      null
                  } else {
                      CronetQueuedInputStream(queue, closedFlag) {
                          urlRequest.cancel()
                      }
                  }

                  return UpstreamResponse(
                      code = info.httpStatusCode,
                      message = info.httpStatusText?.ifBlank { "OK" } ?: "OK",
                      finalUrl = info.url ?: currentFinalUrlRef.get(),
                      engineName = "Cronet",
                      headers = lowerHeaders,
                      decompressedByEngine = decodedByCronet,
                      bodyStream = stream,
                      closeAction = {
                          closedFlag.set(true)
                          urlRequest.cancel()
                      }
                  )
              }

              private fun executeWithOkHttp(
                  okClient: OkHttpClient,
                  cleanUrl: String,
                  headers: Map<String, String>,
                  isHeadMethod: Boolean,
                  clientRange: String?,
                  omitCookies: Boolean,
                  omitOrigin: Boolean,
                  omitReferer: Boolean,
                  forceIdentityEncoding: Boolean
              ): UpstreamResponse {
                  val targetClient = if (omitCookies) {
                      okClient.newBuilder().cookieJar(CookieJar.NO_COOKIES).build()
                  } else {
                      okClient
                  }
                  val rb = buildRequestBuilderWithHeaders(
                      cleanUrl = cleanUrl,
                      headers = headers,
                      omitCookies = omitCookies,
                      omitOrigin = omitOrigin,
                      omitReferer = omitReferer,
                      forceIdentityEncoding = forceIdentityEncoding
                  )
                  if (!clientRange.isNullOrBlank()) {
                      rb.header("Range", clientRange)
                  }
                  if (isHeadMethod) rb.head() else rb.get()
                  val resp = targetClient.newCall(rb.build()).execute()
                  val headersMap = HashMap<String, MutableList<String>>()
                  for (i in 0 until resp.headers.size) {
                      val lk = resp.headers.name(i).lowercase(Locale.US)
                      headersMap.getOrPut(lk) { ArrayList(1) }.add(resp.headers.value(i))
                  }
                  return UpstreamResponse(
                      code = resp.code,
                      message = resp.message.ifBlank { "OK" },
                      finalUrl = resp.request.url.toString(),
                      engineName = "OkHttp",
                      headers = headersMap,
                      decompressedByEngine = false,
                      bodyStream = if (isHeadMethod) null else resp.body?.byteStream(),
                      closeAction = { resp.close() }
                  )
              }

              fun prepareSubtitlePayload(subtitle: SubtitleSourceSpec?, token: String): String? {
                  if (subtitle == null || subtitle.uriOrUrl.isBlank()) {
                      activeSubtitleBytes = null
                      activeSubtitleLocalUrl = null
                      cachedSubtitleRawKey = ""
                      cachedSubtitleRawBytes = null
                      return null
                  }
                  return try {
                      val rawKey = "${subtitle.isLocal}:${subtitle.uriOrUrl.trim()}"
                      val rawBytes: ByteArray
                      val isVtt: Boolean

                      if (cachedSubtitleRawKey == rawKey && cachedSubtitleRawBytes != null) {
                          rawBytes = cachedSubtitleRawBytes!!
                          isVtt = cachedSubtitleIsVtt
                      } else {
                          rawBytes = if (subtitle.isLocal) {
                              val uri = Uri.parse(subtitle.uriOrUrl.trim())
                              context.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                                  ?: return null
                          } else {
                              val cleanSubUrl = subtitle.uriOrUrl.trim()
                              val req = buildRequestBuilderWithHeaders(cleanSubUrl, subtitle.headers, forceIdentityEncoding = false).get().build()
                              probeHttpClient.newCall(req).execute().use { resp ->
                                  if (!resp.isSuccessful || resp.body == null) return null
                                  resp.body!!.bytes()
                              }
                          }
                          val lowerUri = subtitle.uriOrUrl.substringBefore('?').lowercase(Locale.US)
                          val lowerTitle = subtitle.title.lowercase(Locale.US)
                          isVtt = lowerUri.endsWith(".vtt") || lowerTitle.endsWith(".vtt")
                          cachedSubtitleRawKey = rawKey
                          cachedSubtitleRawBytes = rawBytes
                          cachedSubtitleIsVtt = isVtt
                      }

                      val decodedText = decodeSubtitleText(rawBytes)
                      val convertedSrt = convertVttOrNormalizeSrt(decodedText, isVtt, subtitle.offsetSec)
                      val utf8Body = convertedSrt.toByteArray(StandardCharsets.UTF_8)
                      val bom = byteArrayOf(0xEF.toByte(), 0xBB.toByte(), 0xBF.toByte())
                      val withBom = ByteArray(bom.size + utf8Body.size)
                      System.arraycopy(bom, 0, withBom, 0, bom.size)
                      System.arraycopy(utf8Body, 0, withBom, bom.size, utf8Body.size)

                      activeSubtitleBytes = withBom
                      val localSubUrl = "$activeLocalBaseUrl/s/$token/sub.srt"
                      activeSubtitleLocalUrl = localSubUrl
                      localSubUrl
                  } catch (_: Throwable) {
                      activeSubtitleBytes = null
                      activeSubtitleLocalUrl = null
                      null
                  }
              }

              private fun decodeSubtitleText(raw: ByteArray): String {
                  if (raw.isEmpty()) return ""
                  // 1) BOM detection
                  if (raw.size >= 3 && raw[0] == 0xEF.toByte() && raw[1] == 0xBB.toByte() && raw[2] == 0xBF.toByte()) {
                      return String(raw, 3, raw.size - 3, StandardCharsets.UTF_8)
                  }
                  if (raw.size >= 2 && raw[0] == 0xFF.toByte() && raw[1] == 0xFE.toByte()) {
                      return String(raw, 2, raw.size - 2, StandardCharsets.UTF_16LE)
                  }
                  if (raw.size >= 2 && raw[0] == 0xFE.toByte() && raw[1] == 0xFF.toByte()) {
                      return String(raw, 2, raw.size - 2, StandardCharsets.UTF_16BE)
                  }
                  // 2) Strict UTF-8 validation
                  try {
                      val decoder = StandardCharsets.UTF_8.newDecoder()
                          .onMalformedInput(CodingErrorAction.REPORT)
                          .onUnmappableCharacter(CodingErrorAction.REPORT)
                      return decoder.decode(ByteBuffer.wrap(raw)).toString()
                  } catch (_: Throwable) {
                  }
                  // 3) Fallback to Arabic Windows-1256
                  return try {
                      String(raw, Charset.forName("windows-1256"))
                  } catch (_: Throwable) {
                      String(raw, StandardCharsets.UTF_8)
                  }
              }

              private fun decodeHtmlEntities(input: String): String {
                  var out = input
                      .replace("&nbsp;", " ")
                      .replace("&amp;", "&")
                      .replace("&quot;", "\"")
                      .replace("&#39;", "'")
                      .replace("&apos;", "'")
                      .replace("&lt;", "<")
                      .replace("&gt;", ">")
                  if (out.contains("&#")) {
                      out = NUMERIC_HTML_ENTITY_REGEX.replace(out) { m ->
                          val code = m.groupValues[1].toIntOrNull()
                          if (code != null && code in 32..0x10FFFF) {
                              String(Character.toChars(code))
                          } else {
                              m.value
                          }
                      }
                  }
                  return out
              }

              private fun formatSrtMs(totalMs: Long): String {
                  val clamped = totalMs.coerceAtLeast(0L)
                  val h = clamped / 3600000L
                  val m = (clamped % 3600000L) / 60000L
                  val s = (clamped % 60000L) / 1000L
                  val ms = clamped % 1000L
                  return String.format(Locale.US, "%02d:%02d:%02d,%03d", h, m, s, ms)
              }

              private fun toMillis(hStr: String, mStr: String, sStr: String, msStr: String): Long {
                  val h = hStr.toLongOrNull() ?: 0L
                  val m = mStr.toLongOrNull() ?: 0L
                  val s = sStr.toLongOrNull() ?: 0L
                  val msPadded = msStr.padEnd(3, '0').take(3).toLongOrNull() ?: 0L
                  return h * 3600000L + m * 60000L + s * 1000L + msPadded
              }

              private fun convertVttOrNormalizeSrt(rawText: String, isVttHint: Boolean, offsetSec: Int): String {
                  val normalizedInput = rawText.replace("\r\n", "\n").replace('\r', '\n')
                  val lines = normalizedInput.split('\n')
                  val offsetMs = offsetSec.toLong() * 1000L

                  val sb = StringBuilder(normalizedInput.length + 128)
                  var cueIndex = 1
                  var i = 0
                  val isVtt = isVttHint || (lines.firstOrNull()?.trim()?.startsWith("WEBVTT", ignoreCase = true) == true)

                  while (i < lines.size) {
                      val trimmed = lines[i].trim()
                      if (trimmed.isEmpty()) {
                          i++
                          continue
                      }
                      if (isVtt && (trimmed.startsWith("WEBVTT", ignoreCase = true) ||
                              trimmed.startsWith("STYLE", ignoreCase = true) ||
                              trimmed.startsWith("REGION", ignoreCase = true) ||
                              trimmed.startsWith("NOTE", ignoreCase = true))
                      ) {
                          i++
                          while (i < lines.size && lines[i].trim().isNotEmpty()) {
                              i++
                          }
                          continue
                      }

                      val timingMatch = SUBTITLE_TIMING_REGEX.find(trimmed)
                      if (timingMatch != null) {
                          val startH = timingMatch.groupValues[1].ifBlank { "0" }
                          val startM = timingMatch.groupValues[2]
                          val startS = timingMatch.groupValues[3]
                          val startMsRaw = timingMatch.groupValues[4]

                          val endH = timingMatch.groupValues[5].ifBlank { "0" }
                          val endM = timingMatch.groupValues[6]
                          val endS = timingMatch.groupValues[7]
                          val endMsRaw = timingMatch.groupValues[8]

                          var startTotal = (toMillis(startH, startM, startS, startMsRaw) + offsetMs).coerceAtLeast(0L)
                          var endTotal = (toMillis(endH, endM, endS, endMsRaw) + offsetMs).coerceAtLeast(0L)
                          if (endTotal <= startTotal) {
                              endTotal = startTotal + 400L
                          }

                          i++
                          val cueLines = ArrayList<String>()
                          while (i < lines.size && lines[i].trim().isNotEmpty()) {
                              var textLine = lines[i].trimEnd()
                              textLine = VTT_TAG_REGEX.replace(textLine, "")
                              textLine = decodeHtmlEntities(textLine).trim()
                              if (textLine.isNotEmpty()) {
                                  cueLines.add(textLine)
                              }
                              i++
                          }

                          if (cueLines.isNotEmpty()) {
                              sb.append(cueIndex++).append("\r\n")
                              sb.append(formatSrtMs(startTotal)).append(" --> ").append(formatSrtMs(endTotal)).append("\r\n")
                              for (cl in cueLines) {
                                  sb.append(cl).append("\r\n")
                              }
                              sb.append("\r\n")
                          }
                          continue
                      }
                      i++
                  }
                  return sb.toString()
              }

              private fun sanitizeExt(ext: String, mime: String): String {
                  val clean = ext.trim().trimStart('.').lowercase(Locale.US)
                  if (clean in setOf("mp4", "mkv", "ts", "m3u8", "webm", "mov", "avi", "m4v", "mp3", "aac")) {
                      return clean
                  }
                  val lowerMime = mime.lowercase(Locale.US)
                  return when {
                      lowerMime.contains("mpegurl") || lowerMime.contains("m3u") -> "m3u8"
                      lowerMime.contains("matroska") -> "mkv"
                      lowerMime.contains("mp2t") -> "ts"
                      lowerMime.contains("webm") -> "webm"
                      lowerMime.contains("quicktime") -> "mov"
                      else -> "mp4"
                  }
              }

              private fun handleClient(rawSocket: Socket) {
                  rawSocket.use { socket ->
                      try {
                          socket.soTimeout = 30000
                          val input = BufferedInputStream(socket.getInputStream())
                          val output = BufferedOutputStream(socket.getOutputStream())
                          val reader = BufferedReader(InputStreamReader(input, StandardCharsets.US_ASCII))

                          val requestLine = reader.readLine() ?: return
                          val parts = requestLine.trim().split(Regex("\\s+"))
                          if (parts.size < 2) {
                              sendErrorResponse(output, 400, "Bad Request")
                              return
                          }
                          val method = parts[0].uppercase(Locale.US)
                          val rawTarget = parts[1]
                          val reqHeaders = HashMap<String, String>()
                          while (true) {
                              val line = reader.readLine() ?: break
                              if (line.isEmpty()) break
                              val colon = line.indexOf(':')
                              if (colon > 0) {
                                  val key = line.substring(0, colon).trim().lowercase(Locale.US)
                                  val value = line.substring(colon + 1).trim()
                                  reqHeaders[key] = value
                              }
                          }

                          if (method != "GET" && method != "HEAD") {
                              sendErrorResponse(output, 405, "Method Not Allowed")
                              return
                          }
                          val isHead = (method == "HEAD")
                          val pathOnly = rawTarget.substringBefore('?')
                          val segments = pathOnly.trimStart('/').split('/')

                          if (segments.size < 3) {
                              sendErrorResponse(output, 404, "Not Found")
                              return
                          }

                          val prefix = segments[0]
                          val token = segments[1]
                          if (activeToken.isEmpty() || token != activeToken) {
                              sendErrorResponse(output, 403, "Forbidden")
                              return
                          }

                          if (prefix == "s") {
                              val fileSegment = segments[2].lowercase(Locale.US)
                              if (fileSegment == "sub.srt") {
                                  serveLocalSubtitle(isHead, output)
                                  return
                              }
                              if (activeSourceType == "LOCAL") {
                                  val uri = activeLocalUri
                                  if (uri == null) {
                                      sendErrorResponse(output, 404, "No Local Media")
                                      return
                                  }
                                  serveLocalContentUri(uri, activeMimeType, reqHeaders["range"], isHead, output)
                              } else {
                                  val upstream = activeRemoteUrl
                                  if (upstream.isEmpty()) {
                                      sendErrorResponse(output, 404, "No Proxy Media")
                                      return
                                  }
                                  serveProxiedUrl(upstream, pathOnly, reqHeaders["range"], isHead, output)
                              }
                          } else if (prefix == "p" && segments.size >= 3) {
                              val subId = segments[2]
                              val upstream = proxyTargetMap[subId]
                              if (upstream.isNullOrEmpty()) {
                                  sendErrorResponse(output, 404, "Segment Not Found")
                                  return
                              }
                              serveProxiedUrl(upstream, pathOnly, reqHeaders["range"], isHead, output)
                          } else {
                              sendErrorResponse(output, 404, "Not Found")
                          }
                      } catch (_: Throwable) {
                      }
                  }
              }

              private fun serveLocalSubtitle(isHead: Boolean, output: OutputStream) {
                  val subBytes = activeSubtitleBytes
                  if (subBytes == null) {
                      sendErrorResponse(output, 404, "No Active Subtitle")
                      return
                  }
                  val headers = buildString {
                      append("HTTP/1.1 200 OK\r\n")
                      append("Content-Type: text/srt; charset=utf-8\r\n")
                      append("Content-Length: ").append(subBytes.size).append("\r\n")
                      append("transferMode.dlna.org: Streaming\r\n")
                      append("Connection: close\r\n")
                      append("\r\n")
                  }
                  output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                  if (!isHead) {
                      output.write(subBytes)
                  }
                  output.flush()
              }

              private fun serveLocalContentUri(
                  uri: Uri,
                  mimeType: String,
                  rangeHeader: String?,
                  isHead: Boolean,
                  output: OutputStream
              ) {
                  val afd = try {
                      context.contentResolver.openAssetFileDescriptor(uri, "r")
                  } catch (_: Throwable) {
                      null
                  }
                  if (afd == null) {
                      sendErrorResponse(output, 404, "Cannot Open File")
                      return
                  }

                  afd.use { descriptor ->
                      var totalLength = descriptor.length
                      if (totalLength == AssetFileDescriptor.UNKNOWN_LENGTH || totalLength < 0L) {
                          totalLength = queryOpenableSize(uri)
                      }

                      val subHeaderUrl = activeSubtitleLocalUrl
                      if (totalLength <= 0L) {
                          val headers = buildString {
                              append("HTTP/1.1 200 OK\r\n")
                              append("Content-Type: ").append(mimeType).append("\r\n")
                              append("Accept-Ranges: none\r\n")
                              append("transferMode.dlna.org: Streaming\r\n")
                              append("contentFeatures.dlna.org: DLNA.ORG_OP=00;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                              if (!subHeaderUrl.isNullOrBlank()) {
                                  append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                              }
                              append("Connection: close\r\n")
                              append("\r\n")
                          }
                          output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                          output.flush()
                          if (!isHead) {
                              descriptor.createInputStream().use { stream ->
                                  streamAll(stream, output, Long.MAX_VALUE)
                              }
                          }
                          return
                      }

                      val parsedRange = parseByteRange(rangeHeader, totalLength)
                      if (parsedRange == null && !rangeHeader.isNullOrBlank()) {
                          val headers = buildString {
                              append("HTTP/1.1 416 Range Not Satisfiable\r\n")
                              append("Content-Range: bytes */").append(totalLength).append("\r\n")
                              append("Content-Length: 0\r\n")
                              append("Connection: close\r\n")
                              append("\r\n")
                          }
                          output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                          output.flush()
                          return
                      }

                      val isPartial = parsedRange != null
                      val start = parsedRange?.first ?: 0L
                      val end = parsedRange?.second ?: (totalLength - 1L)
                      val contentLen = (end - start + 1L).coerceAtLeast(0L)

                      val headers = buildString {
                          if (isPartial) {
                              append("HTTP/1.1 206 Partial Content\r\n")
                              append("Content-Range: bytes ").append(start).append("-").append(end).append("/").append(totalLength).append("\r\n")
                          } else {
                              append("HTTP/1.1 200 OK\r\n")
                          }
                          append("Content-Type: ").append(mimeType).append("\r\n")
                          append("Content-Length: ").append(contentLen).append("\r\n")
                          append("Accept-Ranges: bytes\r\n")
                          append("transferMode.dlna.org: Streaming\r\n")
                          append("contentFeatures.dlna.org: DLNA.ORG_OP=01;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                          if (!subHeaderUrl.isNullOrBlank()) {
                              append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                          }
                          append("Connection: close\r\n")
                          append("\r\n")
                      }
                      output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                      output.flush()

                      if (!isHead && contentLen > 0L) {
                          descriptor.createInputStream().use { stream ->
                              if (start > 0L) {
                                  skipExact(stream, start)
                              }
                              streamAll(stream, output, contentLen)
                          }
                      }
                  }
              }

              private fun queryOpenableSize(uri: Uri): Long {
                  return try {
                      context.contentResolver.query(uri, arrayOf(OpenableColumns.SIZE), null, null, null)?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val idx = cursor.getColumnIndex(OpenableColumns.SIZE)
                              if (idx >= 0 && !cursor.isNull(idx)) cursor.getLong(idx) else -1L
                          } else {
                              -1L
                          }
                      } ?: -1L
                  } catch (_: Throwable) {
                      -1L
                  }
              }

              private fun executeRequestWith403SmartRetry(
                  fallbackOkClient: OkHttpClient,
                  cleanUrl: String,
                  baseHeaders: Map<String, String>,
                  isHeadMethod: Boolean,
                  clientRange: String?,
                  isSegment: Boolean,
                  stage: String,
                  forceOkHttpIdentity: Boolean = false,
                  timeoutMs: Long = 15_000L
              ): UpstreamResponse {
                  // فصل isCrossHostSegment: منع Cookie فقط عند اختلاف الدومين مع الإبقاء على Origin و Referer للـ CDN
                  val isCrossHostSegment = isSegment &&
                      !sameRootHost(cleanUrl, activeRemoteUrl) &&
                      !sameRootHost(cleanUrl, activeM3u8FinalUrl)

                  fun execOnce(
                      hdrs: Map<String, String>,
                      stripCookies: Boolean,
                      stripOrigin: Boolean,
                      stripReferer: Boolean
                  ): UpstreamResponse {
                      val engine = cronetEngine
                      if (engine != null) {
                          try {
                              return executeWithCronet(
                                  engine = engine,
                                  cleanUrl = cleanUrl,
                                  headers = hdrs,
                                  isHeadMethod = isHeadMethod,
                                  clientRange = clientRange,
                                  omitCookies = stripCookies,
                                  omitOrigin = stripOrigin,
                                  omitReferer = stripReferer,
                                  timeoutMs = timeoutMs
                              )
                          } catch (_: Throwable) {
                              // ارتداد آمن إلى OkHttp فقط إذا تعذر التنفيذ عبر Cronet
                          }
                      }
                      return executeWithOkHttp(
                          okClient = fallbackOkClient,
                          cleanUrl = cleanUrl,
                          headers = hdrs,
                          isHeadMethod = isHeadMethod,
                          clientRange = clientRange,
                          omitCookies = stripCookies,
                          omitOrigin = stripOrigin,
                          omitReferer = stripReferer,
                          forceIdentityEncoding = forceOkHttpIdentity
                      )
                  }

                  // المحاولة 1: بالترويسات الملتقطة كاملة كما هي (مع منع Cookie فقط لو المقطع على دومين مختلف)
                  val sanitizedHeaders = sanitizeBaseHeaders(baseHeaders)
                  val firstResp = execOnce(
                      hdrs = sanitizedHeaders,
                      stripCookies = isCrossHostSegment,
                      stripOrigin = false,
                      stripReferer = false
                  )
                  if (firstResp.code != 403 && firstResp.code != 401) {
                      if (firstResp.code >= 400) {
                          recordUpstreamFailure(firstResp, stage)
                      } else {
                          clearUpstreamFailure()
                      }
                      return firstResp
                  }

                  // حفظ تشخيص المحاولة الأولى الأصلية قبل تجريد الترويسات في المحاولات التالية
                  recordUpstreamFailure(firstResp, stage)
                  val firstFinalUrl = firstResp.finalUrl
                  val host = extractHost(firstFinalUrl).ifBlank { extractHost(cleanUrl) }
                  firstResp.close()

                  // المحاولة 2: الإبقاء على Referer الأصلي وإسقاط Cookie و Origin فقط
                  val secondResp = execOnce(
                      hdrs = sanitizedHeaders,
                      stripCookies = true,
                      stripOrigin = true,
                      stripReferer = false
                  )
                  if (secondResp.code != 403 && secondResp.code != 401) {
                      if (secondResp.code >= 400) {
                          recordUpstreamFailure(secondResp, stage, host)
                      } else {
                          clearUpstreamFailure()
                      }
                      return secondResp
                  }
                  secondResp.close()

                  // المحاولة 3: تجربة Referer لنفس دومين الفيديو (https://<host>/) بدون Origin وبدون Cookie
                  val scheme = try { URI.create(firstFinalUrl).scheme ?: "https" } catch (_: Throwable) { "https" }
                  val retry3Headers = HashMap<String, String>(sanitizedHeaders)
                  retry3Headers.entries.removeAll {
                      it.key.equals("Origin", ignoreCase = true) ||
                          it.key.equals("Referer", ignoreCase = true) ||
                          it.key.equals("Referrer", ignoreCase = true) ||
                          it.key.equals("Cookie", ignoreCase = true)
                  }
                  if (host.isNotBlank()) {
                      retry3Headers["Referer"] = "$scheme://$host/"
                  }
                  val thirdResp = execOnce(
                      hdrs = retry3Headers,
                      stripCookies = true,
                      stripOrigin = true,
                      stripReferer = false
                  )
                  if (thirdResp.code != 403 && thirdResp.code != 401) {
                      if (thirdResp.code >= 400) {
                          recordUpstreamFailure(thirdResp, stage, host)
                      } else {
                          clearUpstreamFailure()
                      }
                      return thirdResp
                  }
                  thirdResp.close()

                  // المحاولة 4: طلب نظيف تماماً بدون Referer وبدون Origin وبدون Cookie
                  val fourthResp = execOnce(
                      hdrs = sanitizedHeaders,
                      stripCookies = true,
                      stripOrigin = true,
                      stripReferer = true
                  )
                  if (fourthResp.code < 400) {
                      clearUpstreamFailure()
                  }
                  // عند استمرار 403/401 في المحاولة 4، نُبقي على تشخيص المحاولة الأولى الأصلية المسجّل مسبقاً
                  return fourthResp
              }

              private fun probeHeadViaGetRange(cleanUrl: String, isSegment: Boolean, stage: String): Triple<Int, Map<String, String>, String?>? {
                  return try {
                      executeRequestWith403SmartRetry(
                          fallbackOkClient = sharedHttpClient,
                          cleanUrl = cleanUrl,
                          baseHeaders = activeHeaders,
                          isHeadMethod = false,
                          clientRange = "bytes=0-0",
                          isSegment = isSegment,
                          stage = stage,
                          forceOkHttpIdentity = true
                      ).use { resp ->
                          val headersMap = HashMap<String, String>()
                          resp.header("Content-Type")?.let { headersMap["Content-Type"] = it }
                          resp.header("Accept-Ranges")?.let { headersMap["Accept-Ranges"] = it }
                          val cr = resp.header("Content-Range")
                          var totalLen: String? = null
                          if (!cr.isNullOrBlank()) {
                              headersMap["Content-Range"] = cr
                              val match = CONTENT_RANGE_TOTAL_REGEX.find(cr)
                              if (match != null) {
                                  totalLen = match.groupValues[1]
                                  headersMap["Accept-Ranges"] = "bytes"
                              }
                          }
                          if (totalLen == null && !resp.decompressedByEngine) {
                              val cl = resp.header("Content-Length")
                              if (!cl.isNullOrBlank() && resp.code == 200) {
                                  totalLen = cl
                              }
                          }
                          if (totalLen != null) {
                              headersMap["Content-Length"] = totalLen
                          }
                          Triple(resp.code, headersMap, resp.finalUrl)
                      }
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun serveProxiedUrl(
                  targetUrl: String,
                  localPath: String,
                  clientRange: String?,
                  isHead: Boolean,
                  output: OutputStream
              ) {
                  val cleanUrl = targetUrl.trim()
                  val isMainMediaPath = localPath.startsWith("/s/", ignoreCase = true)
                  val subHeaderUrl = if (isMainMediaPath) activeSubtitleLocalUrl else null
                  val looksLikeM3u8Path = localPath.lowercase(Locale.US).endsWith(".m3u8") ||
                      cleanUrl.substringBefore('?').lowercase(Locale.US).endsWith(".m3u8")
                  val isSegment = localPath.startsWith("/p/", ignoreCase = true) && !looksLikeM3u8Path
                  val stageLabel = when {
                      looksLikeM3u8Path && isMainMediaPath -> "MASTER_M3U8"
                      looksLikeM3u8Path -> "VARIANT_M3U8"
                      isSegment -> "SEGMENT"
                      else -> "MEDIA_FILE"
                  }

                  // عدم إرسال HEAD خارجياً أبداً لملفات .m3u8: طلب GET واحد + تخزين مؤقت 9 ثوانٍ
                  if (looksLikeM3u8Path) {
                      val outcome = fetchAndCacheM3u8(
                          cleanUrl,
                          useProbeTimeout = false,
                          allowCache = true,
                          stageLabel = stageLabel
                      )
                      val entry = outcome.entry
                      if (entry != null) {
                          val bytes = entry.rewrittenBytes
                          val hlsOp = if (activeIsHlsVod) "10" else "00"
                          val headers = buildString {
                              append("HTTP/1.1 200 OK\r\n")
                              append("Content-Type: application/vnd.apple.mpegurl\r\n")
                              append("Content-Length: ").append(bytes.size).append("\r\n")
                              append("Cache-Control: no-cache\r\n")
                              append("transferMode.dlna.org: Streaming\r\n")
                              append("contentFeatures.dlna.org: DLNA.ORG_OP=").append(hlsOp).append(";DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                              if (!subHeaderUrl.isNullOrBlank()) {
                                  append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                              }
                              append("Connection: close\r\n")
                              append("\r\n")
                          }
                          output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                          if (!isHead) {
                              output.write(bytes)
                          }
                          output.flush()
                          return
                      } else if (outcome.statusCode >= 400) {
                          sendErrorResponse(output, outcome.statusCode, outcome.statusMessage)
                          return
                      }
                  }

                  if (isHead) {
                      executeRequestWith403SmartRetry(
                          fallbackOkClient = sharedHttpClient,
