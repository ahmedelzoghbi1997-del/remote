          package com.universalremote

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat

          class DlnaCastService : Service() {
              companion object {
                  const val CHANNEL_ID = "dlna_cast_playback"
                  const val NOTIFICATION_ID = 4107
                  const val ACTION_START_FOREGROUND = "com.universalremote.action.START_CAST_FG"
                  const val ACTION_TOGGLE_PLAY_PAUSE = "com.universalremote.action.TOGGLE_CAST_PLAY_PAUSE"
                  const val ACTION_STOP_CAST = "com.universalremote.action.STOP_CAST"
              }

              private var wifiLock: WifiManager.WifiLock? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var isForegroundStarted = false

              override fun onCreate() {
                  super.onCreate()
                  DlnaCastCoordinator.init(applicationContext)
                  createNotificationChannel()
                  acquireLocks()
                  DlnaCastCoordinator.setNotificationUpdater { snap ->
                      if (snap.active) {
                          val mgr = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                          mgr?.notify(NOTIFICATION_ID, buildNotification(snap))
                      }
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP_CAST -> {
                          DlnaCastCoordinator.stopCast()
                          stopForegroundSafely()
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      ACTION_TOGGLE_PLAY_PAUSE -> {
                          DlnaCastCoordinator.togglePlayPause()
                          val snap = DlnaCastCoordinator.getCurrentSnapshot()
                          ensureForeground(snap)
                          return START_STICKY
                      }
                      else -> {
                          val snap = DlnaCastCoordinator.getCurrentSnapshot()
                          ensureForeground(snap)
                          return START_STICKY
                      }
                  }
              }

              private fun ensureForeground(snapshot: DlnaPlaybackSnapshot) {
                  val notification = buildNotification(snapshot)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }
                  isForegroundStarted = true
              }

              private fun buildNotification(snapshot: DlnaPlaybackSnapshot): Notification {
                  val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }

                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val contentPi = PendingIntent.getActivity(this, 10, openAppIntent, pendingFlags)

                  val toggleIntent = Intent(this, DlnaCastService::class.java).apply {
                      action = ACTION_TOGGLE_PLAY_PAUSE
                  }
                  val togglePi = PendingIntent.getService(this, 11, toggleIntent, pendingFlags)

                  val stopIntent = Intent(this, DlnaCastService::class.java).apply {
                      action = ACTION_STOP_CAST
                  }
                  val stopPi = PendingIntent.getService(this, 12, stopIntent, pendingFlags)

                  val isPlaying = snapshot.transportState == "PLAYING" || snapshot.transportState == "TRANSITIONING"
                  val toggleLabel = if (isPlaying) "إيقاف مؤقت" else "تشغيل"
                  val statusSubtitle = when (snapshot.transportState) {
                      "PLAYING" -> "جاري البث على ${snapshot.deviceName.ifBlank { "الشاشة" }}"
                      "PAUSED_PLAYBACK" -> "متوقف مؤقتاً · ${snapshot.deviceName.ifBlank { "الشاشة" }}"
                      "TRANSITIONING" -> "جاري التحضير على ${snapshot.deviceName.ifBlank { "الشاشة" }}"
                      else -> "DLNA Cast"
                  }

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(snapshot.title.ifBlank { "بث الفيديو (DLNA 4K)" })
                      .setContentText(statusSubtitle)
                      .setContentIntent(contentPi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .addAction(0, toggleLabel, togglePi)
                      .addAction(0, "إيقاف البث", stopPi)
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "بث الفيديو DLNA",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "التحكم في تشغيل وبث الفيديو إلى الشاشة في الخلفية"
                          setShowBadge(false)
                      }
                      val mgr = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                      mgr?.createNotificationChannel(channel)
                  }
              }

              private fun acquireLocks() {
                  try {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      if (wm != null && wifiLock == null) {
                          val lockMode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                          } else {
                              @Suppress("DEPRECATION")
                              WifiManager.WIFI_MODE_FULL_HIGH_PERF
                          }
                          wifiLock = wm.createWifiLock(lockMode, "UniversalRemote:DlnaWifiLock").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }
                  } catch (_: Throwable) {
                  }

                  try {
                      val pm = applicationContext.getSystemService(Context.POWER_SERVICE) as? PowerManager
                      if (pm != null && wakeLock == null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "UniversalRemote:DlnaWakeLock").apply {
                              setReferenceCounted(false)
                              acquire(4 * 60 * 60 * 1000L)
                          }
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun releaseLocks() {
                  try {
                      if (wifiLock?.isHeld == true) {
                          wifiLock?.release()
                      }
                  } catch (_: Throwable) {
                  }
                  wifiLock = null
                  try {
                      if (wakeLock?.isHeld == true) {
                          wakeLock?.release()
                      }
                  } catch (_: Throwable) {
                  }
                  wakeLock = null
              }

              private fun stopForegroundSafely() {
                  if (!isForegroundStarted) return
                  isForegroundStarted = false
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } else {
                      @Suppress("DEPRECATION")
                      stopForeground(true)
                  }
              }

              override fun onDestroy() {
                  DlnaCastCoordinator.setNotificationUpdater(null)
                  releaseLocks()
                  stopForegroundSafely()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
