name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Checkout Custom Code
        uses: actions/checkout@v4
        with:
          path: my_ai_code

      - name: Create React Native Engine
        run: |
          npx --yes @react-native-community/cli@latest init universalremote --version 0.73.6
          cd universalremote && npm install @react-native-async-storage/async-storage@1.23.1
          
      - name: Fix Package Name Configuration
        run: |
          echo "module.exports = { project: { android: { packageName: 'com.universalremote' } } };" > universalremote/react-native.config.js
          
      - name: Merge AI Code Safely (Filter out Web files)
        run: |
          rm -f universalremote/App.tsx
          rsync -av --exclude='package.json' --exclude='package-lock.json' --exclude='node_modules' my_ai_code/ universalremote/
          cp -f my_ai_code/App.js universalremote/App.js || true

      - name: Inject Android Native Modules & Permissions
        run: |
          python3 - << 'PYEOF'
          import os
          import re

          manifest_path = "universalremote/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          permissions = [
              "android.permission.TRANSMIT_IR",
              "android.permission.VIBRATE",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.WAKE_LOCK",
          ]
          for perm in permissions:
              if perm not in manifest:
                  manifest = manifest.replace(
                      '<uses-permission android:name="android.permission.INTERNET" />',
                      f'<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="{perm}" />',
                      1,
                  )

          if 'android:usesCleartextTraffic="true"' not in manifest:
              manifest = manifest.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )

          if "android:launchMode=" not in manifest:
              manifest = manifest.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n        android:launchMode="singleTask"',
                  1,
              )
          else:
              manifest = re.sub(
                  r'android:launchMode="[^"]+"',
                  'android:launchMode="singleTask"',
                  manifest,
                  count=1,
              )

          if ".DlnaCastService" not in manifest:
              service_xml = (
                  '\n      <service\n'
                  '        android:name=".DlnaCastService"\n'
                  '        android:enabled="true"\n'
                  '        android:exported="false"\n'
                  '        android:foregroundServiceType="mediaPlayback" />\n'
              )
              manifest = manifest.replace("</application>", f"{service_xml}    </application>", 1)

          if "application/vnd.apple.mpegurl" not in manifest:
              cast_filters = (
                  '\n        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '            <category android:name="android.intent.category.BROWSABLE" />\n'
                  '            <data android:scheme="content" />\n'
                  '            <data android:scheme="file" />\n'
                  '            <data android:scheme="http" />\n'
                  '            <data android:scheme="https" />\n'
                  '            <data android:mimeType="video/*" />\n'
                  '            <data android:mimeType="application/vnd.apple.mpegurl" />\n'
                  '            <data android:mimeType="application/x-mpegURL" />\n'
                  '            <data android:mimeType="application/dash+xml" />\n'
                  '        </intent-filter>\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '            <category android:name="android.intent.category.BROWSABLE" />\n'
                  '            <data android:scheme="http" />\n'
                  '            <data android:scheme="https" />\n'
                  '            <data android:host="*" />\n'
                  '            <data android:pathPattern=".*\\.mp4" />\n'
                  '            <data android:pathPattern=".*\\.MP4" />\n'
                  '            <data android:pathPattern=".*\\.mkv" />\n'
                  '            <data android:pathPattern=".*\\.MKV" />\n'
                  '            <data android:pathPattern=".*\\.ts" />\n'
                  '            <data android:pathPattern=".*\\.m3u8" />\n'
                  '            <data android:pathPattern=".*\\.M3U8" />\n'
                  '            <data android:pathPattern=".*\\.webm" />\n'
                  '            <data android:pathPattern=".*\\.mov" />\n'
                  '            <data android:pathPattern=".*\\.avi" />\n'
                  '        </intent-filter>\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.SEND" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '            <data android:mimeType="video/*" />\n'
                  '            <data android:mimeType="text/plain" />\n'
                  '        </intent-filter>'
              )
              manifest = manifest.replace("</activity>", f"{cast_filters}\n      </activity>", 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          main_act_path = "universalremote/android/app/src/main/java/com/universalremote/MainActivity.kt"
          if os.path.exists(main_act_path):
              with open(main_act_path, "r", encoding="utf-8") as f:
                  act = f.read()

              for imp in ["import android.content.Intent", "import android.os.Bundle"]:
                  if imp not in act:
                      act = act.replace("package com.universalremote", f"package com.universalremote\n\n{imp}", 1)

              if "storeInitialIntent" not in act:
                  if re.search(r"override fun onCreate\s*\(", act):
                      act = re.sub(
                          r"(super\.onCreate\([^\)]*\))",
                          r"\1\n    DlnaCastModule.storeInitialIntent(intent)",
                          act,
                          count=1,
                      )
                  else:
                      act = re.sub(
                          r"(class MainActivity\s*:\s*ReactActivity\(\)\s*\{)",
                          r"\1\n  override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n    DlnaCastModule.storeInitialIntent(intent)\n  }\n",
                          act,
                          count=1,
                      )

              if "override fun onNewIntent" not in act:
                  on_new_intent_block = (
                      "\n  override fun onNewIntent(intent: Intent) {\n"
                      "    super.onNewIntent(intent)\n"
                      "    setIntent(intent)\n"
                      "    DlnaCastModule.handleNewIntent(this, intent)\n"
                      "  }\n"
                  )
                  last_brace = act.rfind("}")
                  if last_brace != -1:
                      act = act[:last_brace] + on_new_intent_block + act[last_brace:]

              with open(main_act_path, "w", encoding="utf-8") as f:
                  f.write(act)
          PYEOF

          mkdir -p universalremote/android/app/src/main/java/com/universalremote
          cat << 'EOF' > universalremote/android/app/src/main/java/com/universalremote/IrManagerModule.kt
          package com.universalremote

          import android.content.Context
          import android.hardware.ConsumerIrManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Build
          import com.facebook.react.bridge.ReactApplicationContext
          import com.facebook.react.bridge.ReactContextBaseJavaModule
          import com.facebook.react.bridge.ReactMethod
          import com.facebook.react.bridge.Promise
          import com.facebook.react.bridge.ReadableArray
          import com.facebook.react.bridge.Arguments
          import java.net.Inet4Address
          import java.util.concurrent.Executors

          class IrManagerModule(reactContext: ReactApplicationContext) : ReactContextBaseJavaModule(reactContext) {
              private val irManager: ConsumerIrManager? =
                  reactContext.getSystemService(Context.CONSUMER_IR_SERVICE) as ConsumerIrManager?
              private val irExecutor = Executors.newSingleThreadExecutor()

              override fun getName(): String {
                  return "IrManagerModule"
              }

              private fun resolveCarrierFrequency(requestedHz: Int): Int {
                  val manager = irManager ?: return requestedHz
                  val ranges = manager.carrierFrequencies ?: return requestedHz
                  if (ranges.isEmpty()) return requestedHz
                  var nearest = requestedHz
                  var minDiff = Int.MAX_VALUE
                  for (range in ranges) {
                      if (requestedHz in range.minFrequency..range.maxFrequency) {
                          return requestedHz
                      }
                      val clamped = requestedHz.coerceIn(range.minFrequency, range.maxFrequency)
                      val diff = kotlin.math.abs(requestedHz - clamped)
                      if (diff < minDiff) {
                          minDiff = diff
                          nearest = clamped
                      }
                  }
                  return nearest
              }

              @ReactMethod
              fun hasIrEmitter(promise: Promise) {
                  promise.resolve(irManager?.hasIrEmitter() ?: false)
              }

              @ReactMethod
              fun getNetworkInfo(promise: Promise) {
                  try {
                      val cm = reactApplicationContext.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager?
                      val map = Arguments.createMap()
                      if (cm == null) {
                          map.putBoolean("isConnected", false)
                          map.putBoolean("isWifi", false)
                          map.putBoolean("isCellular", false)
                          map.putBoolean("isEthernet", false)
                          map.putNull("localIp")
                          map.putInt("prefixLength", 24)
                          promise.resolve(map)
                          return
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val activeNetwork = cm.activeNetwork
                          val caps = if (activeNetwork != null) cm.getNetworkCapabilities(activeNetwork) else null
                          val hasWifi = caps?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
                          val hasCellular = caps?.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) == true
                          val hasEthernet = caps?.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) == true
                          val isConnected = caps != null && (hasWifi || hasCellular || hasEthernet || caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET))

                          var localIp: String? = null
                          var prefixLen = 24
                          if (activeNetwork != null && (hasWifi || hasEthernet)) {
                              val linkProps = cm.getLinkProperties(activeNetwork)
                              if (linkProps != null) {
                                  for (linkAddr in linkProps.linkAddresses) {
                                      val addr = linkAddr.address
                                      if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                          localIp = addr.hostAddress
                                          prefixLen = linkAddr.prefixLength
                                          break
                                      }
                                  }
                              }
                          }

                          map.putBoolean("isConnected", isConnected)
                          map.putBoolean("isWifi", hasWifi)
                          map.putBoolean("isCellular", hasCellular)
                          map.putBoolean("isEthernet", hasEthernet)
                          if (localIp != null) {
                              map.putString("localIp", localIp)
                          } else {
                              map.putNull("localIp")
                          }
                          map.putInt("prefixLength", prefixLen)
                          promise.resolve(map)
                      } else {
                          @Suppress("DEPRECATION")
                          val netInfo = cm.activeNetworkInfo
                          @Suppress("DEPRECATION")
                          val isConnected = netInfo?.isConnected == true
                          @Suppress("DEPRECATION")
                          val netType = netInfo?.type
                          @Suppress("DEPRECATION")
                          val isWifi = isConnected && netType == ConnectivityManager.TYPE_WIFI
                          @Suppress("DEPRECATION")
                          val isCellular = isConnected && netType == ConnectivityManager.TYPE_MOBILE
                          @Suppress("DEPRECATION")
                          val isEthernet = isConnected && netType == ConnectivityManager.TYPE_ETHERNET

                          map.putBoolean("isConnected", isConnected)
                          map.putBoolean("isWifi", isWifi)
                          map.putBoolean("isCellular", isCellular)
                          map.putBoolean("isEthernet", isEthernet)
                          map.putNull("localIp")
                          map.putInt("prefixLength", 24)
                          promise.resolve(map)
                      }
                  } catch (e: Exception) {
                      promise.reject("NETWORK_INFO_ERROR", e.message ?: "Failed to inspect network state.", e)
                  }
              }

              @ReactMethod
              fun transmitIR(pattern: ReadableArray, carrierFrequency: Int, promise: Promise) {
                  val manager = irManager
                  if (manager?.hasIrEmitter() != true) {
                      promise.reject("NO_IR", "No IR emitter found on this device.")
                      return
                  }
                  val size = pattern.size()
                  if (size <= 0) {
                      promise.reject("INVALID_PATTERN", "IR pattern must not be empty.")
                      return
                  }
                  val patternArray = IntArray(size)
                  for (i in 0 until size) {
                      patternArray[i] = pattern.getInt(i).coerceAtLeast(1)
                  }
                  val safeFrequency = resolveCarrierFrequency(carrierFrequency)
                  irExecutor.execute {
                      try {
                          manager.transmit(safeFrequency, patternArray)
                          val result = Arguments.createMap()
                          result.putInt("carrierFrequency", safeFrequency)
                          result.putInt("pulseCount", patternArray.size)
                          promise.resolve(result)
                      } catch (e: Exception) {
                          promise.reject("IR_TRANSMIT_ERROR", e.message ?: "Failed to transmit IR signal.", e)
                      }
                  }
              }

              override fun onCatalystInstanceDestroy() {
                  super.onCatalystInstanceDestroy()
                  irExecutor.shutdownNow()
              }
          }
          EOF

          cat << 'EOF' > universalremote/android/app/src/main/java/com/universalremote/HapticsModule.kt
          package com.universalremote

          import android.annotation.TargetApi
          import android.content.Context
          import android.media.AudioAttributes
          import android.os.Build
          import android.os.VibrationAttributes
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import com.facebook.react.bridge.ReactApplicationContext
          import com.facebook.react.bridge.ReactContextBaseJavaModule
          import com.facebook.react.bridge.ReactMethod
          import kotlin.math.roundToInt

          class HapticsModule(reactContext: ReactApplicationContext) : ReactContextBaseJavaModule(reactContext) {
              private val vibrator: Vibrator? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  (reactContext.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as? VibratorManager)?.defaultVibrator
              } else {
                  @Suppress("DEPRECATION")
                  reactContext.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
              }

              private val hasHardware: Boolean = vibrator?.hasVibrator() == true

              private val hasAmplitudeControl: Boolean = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && hasHardware) {
                  vibrator?.hasAmplitudeControl() == true
              } else {
                  false
              }

              private val supportsClick: Boolean
              private val supportsTick: Boolean
              private val supportsLowTick: Boolean
              private val supportsThud: Boolean

              private val effectCachesByTier: Map<String, Map<String, VibrationEffect>>
              private val legacyDurations: Map<String, Long> = mapOf(
                  "NAV_TAP" to 10L,
                  "NAV_REPEAT" to 7L,
                  "OK_CONFIRM" to 24L,
                  "POWER_ALERT" to 8L,
                  "POWER_TV" to 68L,
                  "AC_TEMP_UP" to 12L,
                  "AC_TEMP_DOWN" to 10L,
                  "AC_LIMIT_HIT" to 26L,
                  "AC_MODE_STEP" to 14L,
                  "AC_POWER_ON" to 38L,
                  "AC_POWER_OFF" to 34L
              )

              @Volatile
              private var activeCache: Map<String, VibrationEffect> = emptyMap()

              private val touchVibrationAttributes: Any? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  VibrationAttributes.Builder()
                      .setUsage(VibrationAttributes.USAGE_TOUCH)
                      .build()
              } else {
                  null
              }

              @Suppress("DEPRECATION")
              private val touchAudioAttributes: AudioAttributes? =
                  if (Build.VERSION.SDK_INT in Build.VERSION_CODES.LOLLIPOP until Build.VERSION_CODES.TIRAMISU) {
                      AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                  } else {
                      null
                  }

              init {
                  if (hasHardware && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && vibrator != null) {
                      val support = vibrator.arePrimitivesSupported(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          VibrationEffect.Composition.PRIMITIVE_LOW_TICK,
                          VibrationEffect.Composition.PRIMITIVE_THUD
                      )
                      supportsClick = support.getOrElse(0) { false }
                      supportsTick = support.getOrElse(1) { false }
                      supportsLowTick = support.getOrElse(2) { false }
                      supportsThud = support.getOrElse(3) { false }
                  } else if (hasHardware && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && vibrator != null) {
                      val support = vibrator.arePrimitivesSupported(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          VibrationEffect.Composition.PRIMITIVE_TICK
                      )
                      supportsClick = support.getOrElse(0) { false }
                      supportsTick = support.getOrElse(1) { false }
                      supportsLowTick = false
                      supportsThud = false
                  } else {
                      supportsClick = false
                      supportsTick = false
                      supportsLowTick = false
                      supportsThud = false
                  }

                  effectCachesByTier = if (hasHardware && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      mapOf(
                          "light" to buildTierCache(0.60f),
                          "medium" to buildTierCache(0.85f),
                          "strong" to buildTierCache(1.00f)
                      )
                  } else {
                      emptyMap()
                  }
                  activeCache = effectCachesByTier["medium"] ?: emptyMap()
              }

              override fun getName(): String {
                  return "HapticsModule"
              }

              @TargetApi(Build.VERSION_CODES.O)
              private fun scaledAmp(base: Int, scale: Float): Int {
                  if (!hasAmplitudeControl) {
                      return VibrationEffect.DEFAULT_AMPLITUDE
                  }
                  return (base * scale).roundToInt().coerceIn(1, 255)
              }

              private fun scaledFloat(base: Float, scale: Float): Float {
                  return (base * scale).coerceIn(0.05f, 1.0f)
              }

              @TargetApi(Build.VERSION_CODES.O)
              private fun composeSinglePrimitive(primitiveId: Int, primitiveScale: Float): VibrationEffect {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      return VibrationEffect.startComposition()
                          .addPrimitive(primitiveId, primitiveScale.coerceIn(0.05f, 1.0f))
                          .compose()
                  }
                  return VibrationEffect.createOneShot(10L, VibrationEffect.DEFAULT_AMPLITUDE)
              }

              @TargetApi(Build.VERSION_CODES.O)
              private fun composeDoublePrimitive(
                  firstId: Int,
                  firstScale: Float,
                  gapMs: Int,
                  secondId: Int,
                  secondScale: Float
              ): VibrationEffect {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      return VibrationEffect.startComposition()
                          .addPrimitive(firstId, firstScale.coerceIn(0.05f, 1.0f))
                          .addPrimitive(secondId, secondScale.coerceIn(0.05f, 1.0f), gapMs)
                          .compose()
                  }
                  return VibrationEffect.createOneShot(24L, VibrationEffect.DEFAULT_AMPLITUDE)
              }

              @TargetApi(Build.VERSION_CODES.O)
              private fun buildTierCache(scale: Float): Map<String, VibrationEffect> {
                  val map = HashMap<String, VibrationEffect>(12)

                  map["NAV_TAP"] = when {
                      supportsClick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.55f, scale)
                      )
                      supportsTick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          scaledFloat(0.65f, scale)
                      )
                      else -> VibrationEffect.createOneShot(10L, scaledAmp(195, scale))
                  }

                  map["NAV_REPEAT"] = when {
                      supportsTick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          scaledFloat(0.40f, scale)
                      )
                      supportsClick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.38f, scale)
                      )
                      else -> VibrationEffect.createOneShot(7L, scaledAmp(125, scale))
                  }

                  map["OK_CONFIRM"] = when {
                      supportsClick && supportsThud -> composeDoublePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.72f, scale),
                          18,
                          VibrationEffect.Composition.PRIMITIVE_THUD,
                          scaledFloat(0.95f, scale)
                      )
                      supportsClick && supportsLowTick -> composeDoublePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.70f, scale),
                          18,
                          VibrationEffect.Composition.PRIMITIVE_LOW_TICK,
                          scaledFloat(0.95f, scale)
                      )
                      hasAmplitudeControl -> VibrationEffect.createWaveform(
                          longArrayOf(0L, 11L, 20L, 16L),
                          intArrayOf(0, scaledAmp(150, scale), 0, scaledAmp(255, scale)),
                          -1
                      )
                      supportsClick -> composeDoublePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.68f, scale),
                          20,
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(1.00f, scale)
                      )
                      else -> VibrationEffect.createOneShot(24L, VibrationEffect.DEFAULT_AMPLITUDE)
                  }

                  map["POWER_ALERT"] = when {
                      supportsTick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          scaledFloat(0.42f, scale)
                      )
                      supportsClick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.40f, scale)
                      )
                      else -> VibrationEffect.createOneShot(8L, scaledAmp(120, scale))
                  }

                  map["POWER_TV"] = when {
                      supportsLowTick && supportsThud -> composeDoublePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_LOW_TICK,
                          scaledFloat(0.95f, scale),
                          32,
                          VibrationEffect.Composition.PRIMITIVE_THUD,
                          scaledFloat(1.00f, scale)
                      )
                      hasAmplitudeControl -> VibrationEffect.createWaveform(
                          longArrayOf(0L, 32L, 34L, 48L),
                          intArrayOf(0, scaledAmp(210, scale), 0, scaledAmp(255, scale)),
                          -1
                      )
                      supportsLowTick -> composeDoublePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_LOW_TICK,
                          scaledFloat(0.95f, scale),
                          34,
                          VibrationEffect.Composition.PRIMITIVE_LOW_TICK,
                          scaledFloat(1.00f, scale)
                      )
                      else -> VibrationEffect.createOneShot(68L, VibrationEffect.DEFAULT_AMPLITUDE)
                  }

                  map["AC_TEMP_UP"] = when {
                      supportsClick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.72f, scale)
                      )
                      else -> VibrationEffect.createOneShot(12L, scaledAmp(215, scale))
                  }

                  map["AC_TEMP_DOWN"] = when {
                      supportsTick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          scaledFloat(0.62f, scale)
                      )
                      supportsClick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.56f, scale)
                      )
                      else -> VibrationEffect.createOneShot(10L, scaledAmp(175, scale))
                  }

                  map["AC_LIMIT_HIT"] = when {
                      supportsTick -> composeDoublePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          scaledFloat(0.80f, scale),
                          24,
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          scaledFloat(0.80f, scale)
                      )
                      hasAmplitudeControl -> VibrationEffect.createWaveform(
                          longArrayOf(0L, 11L, 24L, 11L),
                          intArrayOf(0, scaledAmp(225, scale), 0, scaledAmp(225, scale)),
                          -1
                      )
                      else -> VibrationEffect.createOneShot(26L, VibrationEffect.DEFAULT_AMPLITUDE)
                  }

                  map["AC_MODE_STEP"] = when {
                      supportsClick -> composeSinglePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_CLICK,
                          scaledFloat(0.78f, scale)
                      )
                      else -> VibrationEffect.createOneShot(14L, scaledAmp(210, scale))
                  }

                  map["AC_POWER_ON"] = when {
                      supportsTick && supportsThud -> composeDoublePrimitive(
                          VibrationEffect.Composition.PRIMITIVE_TICK,
                          scaledFloat(0.55f, scale),
                          20,
                          VibrationEffect.Composition.PRIMITIVE_THUD,
                          scaledFloat(0.95f, scale)
                      )
