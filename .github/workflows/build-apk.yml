                          val host = uri.host?.lowercase(Locale.US) ?: ""
                          if (isBlockedAdHost(host)) {
                              return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0)))
                          }

                          val reqHeaders = request.requestHeaders ?: emptyMap()
                          val pageUrlSnap = currentPageUrl
                          val uaSnap = currentUserAgent

                          classifyAndCaptureFromNetwork(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                          return null
                      }
                  }
              }

              inner class SnifferJsBridge {
                  @JavascriptInterface
                  fun onDomMediaFound(rawUrl: String?, kind: String?, label: String?) {
                      val cleanUrl = rawUrl?.trim().orEmpty()
                      if (!cleanUrl.startsWith("http", ignoreCase = true)) return
                      val pageUrlSnap = currentPageUrl
                      val uaSnap = currentUserAgent
                      val headers = buildCapturedHeaders(cleanUrl, emptyMap(), pageUrlSnap, uaSnap)
                      val safeKind = if (kind == "SUBTITLE") "SUBTITLE" else "VIDEO"
                      val cleanPath = cleanUrl.substringBefore('?').lowercase(Locale.US)
                      if (safeKind == "VIDEO" && shouldSkipNoiseSegment(cleanUrl, cleanPath)) return
                      val guessedMime = guessMime(cleanPath, safeKind)
                      val score = computePriorityScore(cleanPath, safeKind)
                      addCapturedItem(
                          SniffedMediaItem(
                              url = cleanUrl,
                              kind = safeKind,
                              mimeType = guessedMime,
                              label = label?.takeIf { it.isNotBlank() } ?: "",
                              headers = headers,
                              priorityScore = score
                          )
                      )
                  }
              }

              private fun saveLastVisitedUrl(url: String) {
                  if (!url.startsWith("http", ignoreCase = true)) return
                  getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY_LAST_URL, url)
                      .apply()
              }

              private fun toggleDesktopMode() {
                  isDesktopMode = !isDesktopMode
                  val settings = webView.settings
                  if (isDesktopMode) {
                      settings.userAgentString = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                      desktopBtn.background = roundedBg("#0EA5E9", "#38BDF8", 8)
                      desktopBtn.setTextColor(Color.WHITE)
                  } else {
                      settings.userAgentString = null
                      desktopBtn.background = roundedBg("#181E2A", "#252E3E", 8)
                      desktopBtn.setTextColor(Color.parseColor("#CBD5E1"))
                  }
                  currentUserAgent = settings.userAgentString.orEmpty()
                  webView.reload()
              }

              private fun navigateFromInput() {
                  val raw = urlInput.text?.toString()?.trim().orEmpty()
                  if (raw.isEmpty()) return
                  val target = when {
                      raw.startsWith("http://", ignoreCase = true) || raw.startsWith("https://", ignoreCase = true) -> raw
                      raw.contains('.') && !raw.contains(' ') -> "https://$raw"
                      else -> "https://www.google.com/search?q=" + URLEncoder.encode(raw, "UTF-8")
                  }
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
                  imm?.hideSoftInputFromWindow(urlInput.windowToken, 0)
                  urlInput.clearFocus()
                  webView.loadUrl(target)
              }

              private fun isBlockedAdHost(host: String): Boolean {
                  if (host.isBlank()) return false
                  return AD_HOST_KEYWORDS.any { host.contains(it) }
              }

              private fun sameRootDomain(h1: String, h2: String): Boolean {
                  if (h1 == h2) return true
                  val p1 = h1.split('.').takeLast(2).joinToString(".")
                  val p2 = h2.split('.').takeLast(2).joinToString(".")
                  return p1.isNotBlank() && p1 == p2
              }

              private fun looksLikeDirectMediaUrl(url: String): Boolean {
                  val p = url.substringBefore('?').lowercase(Locale.US)
                  return p.endsWith(".m3u8") || p.endsWith(".mp4") || p.endsWith(".mkv") || p.endsWith(".webm")
              }

              private fun shouldSkipNoiseSegment(urlStr: String, cleanPath: String): Boolean {
                  val lowerFull = urlStr.lowercase(Locale.US)
                  if (lowerFull.contains("vast") || lowerFull.contains("vmap") || lowerFull.contains("preroll")) return true
                  if (SEGMENT_NOISE_REGEX.containsMatchIn(cleanPath)) return true
                  if (cleanPath.endsWith(".ts") && hasCapturedPlaylist) return true
                  return false
              }

              private fun guessMime(cleanPath: String, kind: String): String {
                  if (kind == "SUBTITLE") {
                      return if (cleanPath.endsWith(".vtt")) "text/vtt" else "text/srt"
                  }
                  return when {
                      cleanPath.endsWith(".m3u8") -> "application/vnd.apple.mpegurl"
                      cleanPath.endsWith(".mkv") -> "video/x-matroska"
                      cleanPath.endsWith(".ts") -> "video/mp2t"
                      cleanPath.endsWith(".webm") -> "video/webm"
                      cleanPath.endsWith(".mov") -> "video/quicktime"
                      else -> "video/mp4"
                  }
              }

              private fun computePriorityScore(cleanPath: String, kind: String): Int {
                  if (kind == "SUBTITLE") return 50
                  return when {
                      cleanPath.endsWith(".m3u8") -> 100
                      cleanPath.endsWith(".mp4") || cleanPath.endsWith(".mkv") -> 90
                      cleanPath.endsWith(".webm") || cleanPath.endsWith(".mov") -> 80
                      else -> 70
                  }
              }

              private fun buildCapturedHeaders(
                  targetUrl: String,
                  reqHeaders: Map<String, String>,
                  pageUrlSnap: String,
                  uaSnap: String
              ): Map<String, String> {
                  val out = HashMap<String, String>()
                  for ((k, v) in reqHeaders) {
                      val lower = k.lowercase(Locale.US)
                      if (v.isBlank()) continue
                      when (lower) {
                          "referer", "referrer" -> out["Referer"] = v
                          "user-agent" -> out["User-Agent"] = v
                          "origin" -> out["Origin"] = v
                          "authorization" -> out["Authorization"] = v
                      }
                  }
                  if (!out.containsKey("Referer") && pageUrlSnap.startsWith("http", ignoreCase = true)) {
                      out["Referer"] = pageUrlSnap
                  }
                  if (!out.containsKey("User-Agent") && uaSnap.isNotBlank()) {
                      out["User-Agent"] = uaSnap
                  }
                  try {
                      val cm = CookieManager.getInstance()
                      val directCookie = cm.getCookie(targetUrl)
                      val pageCookie = if (directCookie.isNullOrBlank() && pageUrlSnap.startsWith("http", ignoreCase = true)) {
                          cm.getCookie(pageUrlSnap)
                      } else null
                      val finalCookie = directCookie?.takeIf { it.isNotBlank() } ?: pageCookie
                      if (!finalCookie.isNullOrBlank()) {
                          out["Cookie"] = finalCookie
                      }
                  } catch (_: Throwable) {
                  }
                  return out
              }

              private fun classifyAndCaptureFromNetwork(
                  urlStr: String,
                  reqHeaders: Map<String, String>,
                  pageUrlSnap: String,
                  uaSnap: String
              ) {
                  val cleanPath = urlStr.substringBefore('?').substringBefore('#').lowercase(Locale.US)

                  if (cleanPath.endsWith(".srt") || cleanPath.endsWith(".vtt")) {
                      val headers = buildCapturedHeaders(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                      addCapturedItem(
                          SniffedMediaItem(
                              url = urlStr,
                              kind = "SUBTITLE",
                              mimeType = guessMime(cleanPath, "SUBTITLE"),
                              label = if (cleanPath.endsWith(".vtt")) "VTT Subtitle" else "SRT Subtitle",
                              headers = headers,
                              priorityScore = 50
                          )
                      )
                      return
                  }

                  val isVideoExt = cleanPath.endsWith(".m3u8") ||
                      cleanPath.endsWith(".mp4") ||
                      cleanPath.endsWith(".mkv") ||
                      cleanPath.endsWith(".webm") ||
                      cleanPath.endsWith(".mov") ||
                      cleanPath.endsWith(".ts")

                  if (isVideoExt) {
                      if (shouldSkipNoiseSegment(urlStr, cleanPath)) return
                      if (cleanPath.endsWith(".m3u8")) {
                          hasCapturedPlaylist = true
                      }
                      val headers = buildCapturedHeaders(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                      addCapturedItem(
                          SniffedMediaItem(
                              url = urlStr,
                              kind = "VIDEO",
                              mimeType = guessMime(cleanPath, "VIDEO"),
                              label = "",
                              headers = headers,
                              priorityScore = computePriorityScore(cleanPath, "VIDEO")
                          )
                      )
                      return
                  }

                  // تجاهل الامتدادات غير المرئية أو السكربتات الثابتة قبل السبر بالخلفية
                  if (cleanPath.endsWith(".js") || cleanPath.endsWith(".css") || cleanPath.endsWith(".png") ||
                      cleanPath.endsWith(".jpg") || cleanPath.endsWith(".jpeg") || cleanPath.endsWith(".webp") ||
                      cleanPath.endsWith(".svg") || cleanPath.endsWith(".woff2") || cleanPath.endsWith(".gif") ||
                      cleanPath.endsWith(".ico")
                  ) {
                      return
                  }

                  val hasRange = reqHeaders.keys.any { it.equals("Range", ignoreCase = true) }
                  val accept = reqHeaders.entries.firstOrNull { it.key.equals("Accept", ignoreCase = true) }?.value?.lowercase(Locale.US).orEmpty()
                  val lowerFull = urlStr.lowercase(Locale.US)
                  val looksCandidate = hasRange ||
                      accept.contains("video/") ||
                      accept.contains("mpegurl") ||
                      lowerFull.contains("m3u8") ||
                      lowerFull.contains("mime=video") ||
                      lowerFull.contains("playlist") ||
                      lowerFull.contains("manifest") ||
                      lowerFull.contains("/hls/") ||
                      lowerFull.contains("/stream")

                  if (looksCandidate && probedUrls.add(urlStr)) {
                      val headers = buildCapturedHeaders(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                      sniffExecutor.execute {
                          probeContentTypeAsync(urlStr, headers)
                      }
                  }
              }

              private fun probeContentTypeAsync(urlStr: String, headers: Map<String, String>) {
                  try {
                      val builder = Request.Builder().url(urlStr).head()
                      for ((k, v) in headers) {
                          builder.header(k, v)
                      }
                      builder.header("Accept-Encoding", "identity")
                      sniffHttpClient.newCall(builder.build()).execute().use { resp ->
                          if (!resp.isSuccessful) return
                          val ct = resp.header("Content-Type")?.lowercase(Locale.US).orEmpty()
                          val contentLen = resp.header("Content-Length")?.toLongOrNull() ?: -1L
                          when {
                              ct.contains("mpegurl") || ct.contains("x-mpegurl") -> {
                                  hasCapturedPlaylist = true
                                  addCapturedItem(SniffedMediaItem(urlStr, "VIDEO", "application/vnd.apple.mpegurl", "HLS Stream", headers, 98))
                              }
                              ct.contains("text/vtt") || ct.contains("subrip") || ct.contains("x-subrip") -> {
                                  addCapturedItem(SniffedMediaItem(urlStr, "SUBTITLE", ct.substringBefore(';'), "Subtitle", headers, 50))
                              }
                              ct.contains("video/") -> {
                                  // تجاهل الإعلانات أو المقاطع المعاينة الصغيرة جداً أقل من 150 كيلوبايت
                                  if (contentLen in 1..153600) return
                                  addCapturedItem(SniffedMediaItem(urlStr, "VIDEO", ct.substringBefore(';'), "", headers, 85))
                              }
                          }
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun addCapturedItem(item: SniffedMediaItem) {
                  if (item.kind == "VIDEO" && item.mimeType.contains("mpegurl", ignoreCase = true)) {
                      hasCapturedPlaylist = true
                      // إزالة مقاطع .ts الفردية الملتقطة مسبقاً عند التقاط قائمة HLS
                      val keys = capturedMap.keys.toList()
                      for (k in keys) {
                          if (k.substringBefore('?').lowercase(Locale.US).endsWith(".ts")) {
                              capturedMap.remove(k)
                          }
                      }
                  }
                  capturedMap[item.url] = item
                  runOnUiThread {
                      updateSnifferBadgeAndList()
                  }
              }

              private fun updateSnifferBadgeAndList() {
                  val items = capturedMap.values.toList()
                  val videos = items.filter { it.kind == "VIDEO" }.sortedByDescending { it.priorityScore }
                  val subs = items.filter { it.kind == "SUBTITLE" }
                  val badgeLabel = if (subs.isNotEmpty()) {
                      "المقاطع (${videos.size}) · ترجمة (${subs.size})"
                  } else {
                      "المقاطع الملتقطة (${videos.size})"
                  }
                  fabBadgeBtn.text = badgeLabel
                  if (videos.isNotEmpty()) {
                      fabBadgeBtn.background = roundedBg("#16A34A", "#4ADE80", 22)
                  } else {
                      fabBadgeBtn.background = roundedBg("#0EA5E9", "#38BDF8", 22)
                  }

                  if (selectedSubtitle != null) {
                      selectedSubLabel.visibility = View.VISIBLE
                      selectedSubLabel.text = "الترجمة المختارة: ${selectedSubtitle!!.url.substringBefore('?').substringAfterLast('/', "sub.srt")}"
                  } else {
                      selectedSubLabel.visibility = View.GONE
                  }

                  mediaListContainer.removeAllViews()
                  if (items.isEmpty()) {
                      emptyStateText.visibility = View.VISIBLE
                      return
                  }
                  emptyStateText.visibility = View.GONE

                  for (vid in videos) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = roundedBg("#0B0D11", "#1E2532", 10)
                          setPadding(dp(10), dp(10), dp(10), dp(10))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              bottomMargin = dp(8)
                          }
                          setOnClickListener {
                              returnCapturedMedia(vid)
                          }
                      }
                      val cleanName = vid.url.substringBefore('?').substringAfterLast('/', "video").ifBlank { "Stream" }
                      val host = try { Uri.parse(vid.url).host ?: "" } catch (_: Throwable) { "" }
                      val badgeType = when {
                          vid.mimeType.contains("mpegurl", ignoreCase = true) -> "HLS .m3u8"
                          vid.mimeType.contains("matroska", ignoreCase = true) -> "MKV"
                          else -> "MP4 / Direct"
                      }
                      val titleTv = TextView(this).apply {
                          text = "[$badgeType] $cleanName"
                          setTextColor(Color.parseColor("#38BDF8"))
                          textSize = 13f
                          typeface = Typeface.DEFAULT_BOLD
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.MIDDLE
                      }
                      val subTv = TextView(this).apply {
                          val hasAuth = vid.headers.containsKey("Cookie") || vid.headers.containsKey("Referer")
                          text = "$host · اضغط للبث${if (hasAuth) " (يحمل ترويسات حماية ✓)" else ""}"
                          setTextColor(Color.parseColor("#94A3B8"))
                          textSize = 11f
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.END
                      }
                      row.addView(titleTv)
                      row.addView(subTv)
                      mediaListContainer.addView(row)
                  }

                  for (sub in subs) {
                      val isSel = selectedSubtitle?.url == sub.url
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = roundedBg(if (isSel) "#12261A" else "#0B0D11", if (isSel) "#22C55E" else "#334155", 10)
                          setPadding(dp(10), dp(8), dp(10), dp(8))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              bottomMargin = dp(6)
                          }
                          setOnClickListener {
                              selectedSubtitle = if (isSel) null else sub
                              updateSnifferBadgeAndList()
                          }
                      }
                      val subName = sub.url.substringBefore('?').substringAfterLast('/', "subtitle.srt")
                      val titleTv = TextView(this).apply {
                          text = "${if (isSel) "✓ " else ""}[ترجمة] ${sub.label.ifBlank { subName }}"
                          setTextColor(Color.parseColor(if (isSel) "#4ADE80" else "#F59E0B"))
                          textSize = 12f
                          typeface = Typeface.DEFAULT_BOLD
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.MIDDLE
                      }
                      val hintTv = TextView(this).apply {
                          text = if (isSel) "مربوطة — اختر الفيديو بالأعلى للإرسال" else "اضغط لربط هذه الترجمة مع الفيديو"
                          setTextColor(Color.parseColor("#94A3B8"))
                          textSize = 10f
                      }
                      row.addView(titleTv)
                      row.addView(hintTv)
                      mediaListContainer.addView(row)
                  }
              }

              private fun returnCapturedMedia(video: SniffedMediaItem) {
                  val rootJson = JSONObject()
                  val vidJson = JSONObject().apply {
                      put("url", video.url)
                      put("title", currentPageTitle)
                      put("mimeType", video.mimeType)
                      val hObj = JSONObject()
                      for ((k, v) in video.headers) {
                          hObj.put(k, v)
                      }
                      put("headers", hObj)
                  }
                  rootJson.put("video", vidJson)

                  val sub = selectedSubtitle
                  if (sub != null) {
                      val subJson = JSONObject().apply {
                          put("url", sub.url)
                          put("title", sub.label.ifBlank { sub.url.substringBefore('?').substringAfterLast('/', "sub.srt") })
                          put("mimeType", sub.mimeType)
                          val shObj = JSONObject()
                          for ((k, v) in sub.headers) {
                              shObj.put(k, v)
                          }
                          put("headers", shObj)
                      }
                      rootJson.put("subtitle", subJson)
                  }

                  val resultIntent = Intent().apply {
                      putExtra(EXTRA_RESULT_JSON, rootJson.toString())
                  }
                  setResult(Activity.RESULT_OK, resultIntent)
                  finish()
              }

              override fun onDestroy() {
                  sniffExecutor.shutdownNow()
                  try {
                      webView.stopLoading()
                      webView.destroy()
                  } catch (_: Throwable) {
                  }
                  super.onDestroy()
              }
          }
