              private val cronetCallbackExecutor: ExecutorService = Executors.newCachedThreadPool()

              private val cronetEngine: CronetEngine? by lazy {
                  try {
                      CronetEngine.Builder(context.applicationContext)
                          .enableHttp2(true)
                          .enableQuic(true)
