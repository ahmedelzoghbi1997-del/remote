          package com.universalremote

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import androidx.core.content.ContextCompat
          import com.facebook.react.bridge.Arguments
          import com.facebook.react.bridge.WritableMap
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.ScheduledFuture
          import java.util.concurrent.TimeUnit

          data class DlnaPlaybackSnapshot(
              val active: Boolean = false,
              val transportState: String = "STOPPED",
              val deviceName: String = "",
              val deviceIp: String = "",
              val title: String = "",
              val sourceMode: String = "",
              val mimeType: String = "video/mp4",
              val positionSec: Int = 0,
              val durationSec: Int = 0,
              val isSeekable: Boolean = true,
              val volume: Int = 15,
              val muted: Boolean = false,
              val error: String = ""
          ) {
              fun toWritableMap(): WritableMap {
                  val map = Arguments.createMap()
                  map.putBoolean("active", active)
                  map.putString("transportState", transportState)
                  map.putString("deviceName", deviceName)
                  map.putString("deviceIp", deviceIp)
                  map.putString("title", title)
                  map.putString("sourceMode", sourceMode)
                  map.putString("mimeType", mimeType)
                  map.putInt("positionSec", positionSec)
                  map.putInt("durationSec", durationSec)
                  map.putBoolean("isSeekable", isSeekable)
                  map.putInt("volume", volume)
                  map.putBoolean("muted", muted)
                  map.putString("error", error)
                  return map
              }
          }

          object DlnaCastCoordinator {
              private lateinit var appContext: Context
              private lateinit var httpServer: DlnaHttpServer
              private lateinit var soapClient: DlnaSoapClient

              private val commandExecutor = Executors.newSingleThreadExecutor()
              private val pollExecutor: ScheduledExecutorService = Executors.newSingleThreadScheduledExecutor()

              @Volatile
              private var initialized = false

              @Volatile
              private var activeDevice: DlnaRendererDevice? = null

              @Volatile
              private var snapshot = DlnaPlaybackSnapshot()

              @Volatile
              private var stateListener: ((DlnaPlaybackSnapshot) -> Unit)? = null

              @Volatile
              private var notificationUpdater: ((DlnaPlaybackSnapshot) -> Unit)? = null

              @Volatile
              private var pollTask: ScheduledFuture<*>? = null

              @Synchronized
              fun init(context: Context) {
                  if (initialized) return
                  appContext = context.applicationContext
                  httpServer = DlnaHttpServer(appContext)
                  soapClient = DlnaSoapClient(appContext)
                  initialized = true
              }

              fun setStateListener(listener: ((DlnaPlaybackSnapshot) -> Unit)?) {
                  stateListener = listener
              }

              fun setNotificationUpdater(updater: ((DlnaPlaybackSnapshot) -> Unit)?) {
                  notificationUpdater = updater
              }

              fun getCurrentSnapshot(): DlnaPlaybackSnapshot = snapshot

              fun discoverRenderers(priorityIp: String?): List<DlnaRendererDevice> {
                  return soapClient.discoverRenderers(priorityIp)
              }

              private fun publishSnapshot(next: DlnaPlaybackSnapshot) {
                  snapshot = next
                  stateListener?.invoke(next)
                  notificationUpdater?.invoke(next)
              }

              fun castLocalUri(
                  device: DlnaRendererDevice,
                  uri: Uri,
                  title: String,
                  mimeType: String,
                  fileExt: String
              ) {
                  commandExecutor.submit {
                      castInternal(device, title, mimeType, "LOCAL_HTTP_206", seekableHint = true) {
                          httpServer.prepareLocalSession(uri, mimeType, fileExt)
                      }
                  }.get()
              }

              fun castRemoteUrl(
                  device: DlnaRendererDevice,
                  url: String,
                  title: String,
                  mimeType: String,
                  fileExt: String,
                  useProxy: Boolean,
                  pinHighestQuality: Boolean,
                  headers: Map<String, String>
              ) {
                  val cleanUrl = url.trim()
                  val isHls = mimeType.contains("mpegurl", ignoreCase = true) ||
                      mimeType.contains("m3u", ignoreCase = true) ||
                      cleanUrl.substringBefore('?').lowercase(Locale.US).endsWith(".m3u8")
                  // ترقية روابط https:// تلقائياً للبروكسي المحلي لأن شاشات سامسونج ترفض HTTPS المباشر عبر UPnP
                  val effectiveUseProxy = useProxy || cleanUrl.startsWith("https://", ignoreCase = true)
                  val mode = if (effectiveUseProxy) "LOCAL_PROXY" else "DIRECT_URL"
                  commandExecutor.submit {
                      castInternal(device, title, mimeType, mode, seekableHint = !isHls) {
                          if (effectiveUseProxy) {
                              httpServer.prepareProxySession(cleanUrl, headers, mimeType, fileExt, pinHighestQuality)
                          } else {
                              cleanUrl
                          }
                      }
                  }.get()
              }

              private fun castInternal(
                  device: DlnaRendererDevice,
                  title: String,
                  mimeType: String,
                  sourceMode: String,
                  seekableHint: Boolean,
                  urlProducer: () -> String
              ) {
                  val finalUrl = urlProducer()
                  val isDirectExternal = (sourceMode == "DIRECT_URL")
                  activeDevice = device

                  startForegroundServiceSafe()

                  publishSnapshot(
                      DlnaPlaybackSnapshot(
                          active = true,
                          transportState = "TRANSITIONING",
                          deviceName = device.name,
                          deviceIp = device.ip,
                          title = title.ifBlank { "Video Stream" },
                          sourceMode = sourceMode,
                          mimeType = mimeType,
                          positionSec = 0,
                          durationSec = 0,
                          isSeekable = seekableHint,
                          volume = snapshot.volume,
                          muted = snapshot.muted,
                          error = ""
                      )
                  )

                  try {
                      try {
                          soapClient.stop(device.avTransportControlUrl)
                          Thread.sleep(160)
                      } catch (_: Throwable) {
                      }

                      soapClient.setAvTransportUri(
                          device.avTransportControlUrl,
                          finalUrl,
                          title.ifBlank { "Video Stream" },
                          mimeType,
                          seekableHint,
                          isDirectExternal
                      )
                      soapClient.play(device.avTransportControlUrl)

                      val vol = try {
                          soapClient.getVolume(device.renderingControlUrl)
                      } catch (_: Throwable) {
                          snapshot.volume
                      }
                      val muted = try {
                          soapClient.getMute(device.renderingControlUrl)
                      } catch (_: Throwable) {
                          false
                      }

                      publishSnapshot(
                          snapshot.copy(
                              transportState = "PLAYING",
                              volume = vol,
                              muted = muted,
                              error = ""
                          )
                      )
                      startPolling()
                  } catch (e: Throwable) {
                      val baseMsg = e.message ?: "تعذر بدء البث إلى الشاشة"
                      val upstreamCode = httpServer.lastUpstreamStatusCode
                      val enrichedMsg = if (baseMsg.contains("716") && upstreamCode >= 400) {
                          "$baseMsg (فشل المصدر برمز HTTP $upstreamCode)"
                      } else {
                          baseMsg
                      }
                      publishSnapshot(
                          snapshot.copy(
                              active = false,
                              transportState = "STOPPED",
                              error = enrichedMsg
                          )
                      )
                      stopForegroundServiceSafe()
                      throw RuntimeException(enrichedMsg, e)
                  }
              }

              fun play() {
                  val dev = activeDevice ?: return
                  commandExecutor.execute {
                      try {
                          soapClient.play(dev.avTransportControlUrl)
                          publishSnapshot(snapshot.copy(transportState = "PLAYING", error = ""))
                      } catch (e: Throwable) {
                          publishSnapshot(snapshot.copy(error = e.message ?: ""))
                      }
                  }
              }

              fun pause() {
                  val dev = activeDevice ?: return
                  commandExecutor.execute {
                      try {
                          soapClient.pause(dev.avTransportControlUrl)
                          publishSnapshot(snapshot.copy(transportState = "PAUSED_PLAYBACK", error = ""))
                      } catch (e: Throwable) {
                          publishSnapshot(snapshot.copy(error = e.message ?: ""))
                      }
                  }
              }

              fun togglePlayPause() {
                  val state = snapshot.transportState
                  if (state == "PLAYING" || state == "TRANSITIONING") {
                      pause()
                  } else {
                      play()
                  }
              }

              fun seekSeconds(seconds: Int) {
                  val dev = activeDevice ?: return
                  val clamped = seconds.coerceAtLeast(0)
                  commandExecutor.execute {
                      try {
                          soapClient.seekSeconds(dev.avTransportControlUrl, clamped)
                          publishSnapshot(snapshot.copy(positionSec = clamped, error = ""))
                      } catch (e: Throwable) {
                          publishSnapshot(snapshot.copy(error = e.message ?: ""))
                      }
                  }
              }

              fun setVolume(volume: Int) {
                  val dev = activeDevice ?: return
                  val clamped = volume.coerceIn(0, 100)
                  commandExecutor.execute {
                      try {
                          soapClient.setVolume(dev.renderingControlUrl, clamped)
                          publishSnapshot(snapshot.copy(volume = clamped, error = ""))
                      } catch (e: Throwable) {
                          publishSnapshot(snapshot.copy(error = e.message ?: ""))
                      }
                  }
              }

              fun setMute(muted: Boolean) {
                  val dev = activeDevice ?: return
                  commandExecutor.execute {
                      try {
                          soapClient.setMute(dev.renderingControlUrl, muted)
                          publishSnapshot(snapshot.copy(muted = muted, error = ""))
                      } catch (e: Throwable) {
                          publishSnapshot(snapshot.copy(error = e.message ?: ""))
                      }
                  }
              }

              fun stopCast() {
                  stopPolling()
                  val dev = activeDevice
                  activeDevice = null
                  commandExecutor.execute {
                      if (dev != null) {
                          try {
                              soapClient.stop(dev.avTransportControlUrl)
                          } catch (_: Throwable) {
                          }
                      }
                      httpServer.stopServer()
                      publishSnapshot(
                          DlnaPlaybackSnapshot(
                              active = false,
                              transportState = "STOPPED"
                          )
                      )
                      stopForegroundServiceSafe()
                  }
              }

              private fun startPolling() {
                  stopPolling()
                  pollTask = pollExecutor.scheduleWithFixedDelay({
                      val dev = activeDevice ?: return@scheduleWithFixedDelay
                      if (!snapshot.active) return@scheduleWithFixedDelay
                      try {
                          val transport = soapClient.getTransportInfo(dev.avTransportControlUrl)
                          val pos = soapClient.getPositionInfo(dev.avTransportControlUrl)
                          val vol = try {
                              soapClient.getVolume(dev.renderingControlUrl)
                          } catch (_: Throwable) {
                              snapshot.volume
                          }
                          val muted = try {
                              soapClient.getMute(dev.renderingControlUrl)
                          } catch (_: Throwable) {
                              snapshot.muted
                          }

                          val isLiveOrHls = snapshot.mimeType.contains("mpegurl", ignoreCase = true) ||
                              (transport.state == "PLAYING" && pos.durationSec <= 0)
                          val seekableNow = !isLiveOrHls && pos.durationSec > 0

                          if (transport.state == "STOPPED" && snapshot.transportState != "TRANSITIONING") {
                              stopPolling()
                              activeDevice = null
                              httpServer.stopServer()
                              publishSnapshot(DlnaPlaybackSnapshot(active = false, transportState = "STOPPED"))
                              stopForegroundServiceSafe()
                          } else {
                              publishSnapshot(
                                  snapshot.copy(
                                      transportState = transport.state,
                                      positionSec = pos.positionSec,
                                      durationSec = pos.durationSec,
                                      isSeekable = seekableNow,
                                      volume = vol,
                                      muted = muted,
                                      error = ""
                                  )
                              )
                          }
                      } catch (_: Throwable) {
                      }
                  }, 1000L, 1000L, TimeUnit.MILLISECONDS)
              }

              private fun stopPolling() {
                  pollTask?.cancel(false)
                  pollTask = null
              }

              private fun startForegroundServiceSafe() {
                  if (!initialized) return
                  try {
                      val intent = Intent(appContext, DlnaCastService::class.java).apply {
                          action = DlnaCastService.ACTION_START_FOREGROUND
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ContextCompat.startForegroundService(appContext, intent)
                      } else {
                          appContext.startService(intent)
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun stopForegroundServiceSafe() {
                  if (!initialized) return
                  try {
                      appContext.stopService(Intent(appContext, DlnaCastService::class.java))
                  } catch (_: Throwable) {
                  }
              }
          }
