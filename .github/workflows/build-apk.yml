                  private class SessionCookieJar : CookieJar {
                      private val store = ConcurrentHashMap<String, MutableList<Cookie>>()

                      override fun saveFromResponse(url: HttpUrl, cookies: List<Cookie>) {
                          if (cookies.isEmpty()) return
                          val hostKey = url.host.lowercase(Locale.US)
                          val list = store.getOrPut(hostKey) {
                              Collections.synchronizedList(ArrayList())
                          }
                          synchronized(list) {
                              val now = System.currentTimeMillis()
                              for (incoming in cookies) {
                                  list.removeAll {
                                      it.name == incoming.name && it.domain == incoming.domain && it.path == incoming.path
                                  }
                                  if (incoming.expiresAt > now) {
                                      list.add(incoming)
                                  }
                              }
                          }
                      }

                      override fun loadForRequest(url: HttpUrl): List<Cookie> {
                          val now = System.currentTimeMillis()
                          val matched = ArrayList<Cookie>()
                          for (list in store.values) {
                              synchronized(list) {
                                  val it = list.iterator()
                                  while (it.hasNext()) {
                                      val cookie = it.next()
                                      if (cookie.expiresAt <= now) {
                                          it.remove()
                                      } else if (cookie.matches(url)) {
                                          matched.add(cookie)
                                      }
                                  }
                              }
                          }
                          return matched
                      }

                      fun clear() {
                          store.clear()
                      }
                  }

