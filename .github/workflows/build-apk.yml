                  private val SEGMENT_NOISE_REGEX = Regex(
                      """(?:^|/)(?:seg|chunk|frag|fragment)[-_]?\d*|(?:^|[/_-])0\d{2,}\.(?:mp4|m4s|ts)(?:$|\?)|(?:^|[/_-])\d{5,}\.(?:mp4|m4s|ts)(?:$|\?)|[-_](?:seg|chunk|frag|part)[-_]?\d*\.(?:mp4|m4s|ts)(?:$|\?)|(?:^|/)init(?:[-_][^/]*)?\.(?:mp4|m4s)(?:$|\?)|\d+[-_]\d+\.ts(?:$|\?)|\.m4s(?:$|\?)""",
                      RegexOption.IGNORE_CASE
                  )

                  private val CONTENT_RANGE_TOTAL_REGEX = Regex("""bytes\s+\d+-\d+/(\d+)""", RegexOption.IGNORE_CASE)
                  private val DISPOSITION_FILENAME_REGEX = Regex("""filename\*?=(?:UTF-8'')?["']?([^"';]+)["']?""", RegexOption.IGNORE_CASE)

                  private val SEARCH_ENGINE_HOST_REGEX = Regex(
