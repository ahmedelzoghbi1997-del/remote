                  private const val PICK_SUBTITLE_REQUEST_CODE = 44020
                  private const val OPEN_SNIFFER_REQUEST_CODE = 44021
                  private const val EVENT_STATE = "DlnaPlaybackState"
                  private const val EVENT_INTENT = "DlnaCastIntentReceived"
                  private val URL_EXTRACT_REGEX = Regex("https?://\\S+", RegexOption.IGNORE_CASE)

                  @Volatile
                  private var pendingIntentData: WritableMap? = null

                  fun storeInitialIntent(intent: Intent?) {
                      val parsed = parseCastIntentToMap(intent)
                      if (parsed != null) {
                          pendingIntentData = parsed
                      }
                  }

                  fun handleNewIntent(activity: Activity, intent: Intent?) {
                      val parsed = parseCastIntentToMap(intent) ?: return
                      pendingIntentData = parsed
                      try {
                          val reactApp = activity.application as? com.facebook.react.ReactApplication
                          val rnCtx = reactApp?.reactNativeHost?.reactInstanceManager?.currentReactContext
                          if (rnCtx != null && rnCtx.hasActiveReactInstance()) {
                              pendingIntentData = null
                              rnCtx
                                  .getJSModule(DeviceEventManagerModule.RCTDeviceEventEmitter::class.java)
                                  .emit(EVENT_INTENT, parsed)
                          }
                      } catch (_: Throwable) {
                      }
                  }

                  fun parseCastIntentToMap(intent: Intent?): WritableMap? {
                      if (intent == null) return null
                      val action = intent.action ?: return null
                      var targetUrl = ""
                      var isLocalContent = false
                      var title = intent.getStringExtra(Intent.EXTRA_SUBJECT)
                          ?: intent.getStringExtra("title")
                          ?: ""

                      when (action) {
                          Intent.ACTION_VIEW -> {
                              val dataUri = intent.data
                              val str = intent.dataString ?: dataUri?.toString().orEmpty()
                              if (str.isBlank()) return null
                              val scheme = dataUri?.scheme?.lowercase(Locale.US) ?: ""
                              isLocalContent = scheme == "content" || scheme == "file"
                              targetUrl = str
                          }
                          Intent.ACTION_SEND -> {
                              val streamUri: Uri? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                              } else {
                                  @Suppress("DEPRECATION")
                                  intent.getParcelableExtra(Intent.EXTRA_STREAM)
                              }
                              if (streamUri != null) {
                                  targetUrl = streamUri.toString()
                                  isLocalContent = true
                              } else {
                                  val sharedText = intent.getStringExtra(Intent.EXTRA_TEXT).orEmpty()
                                  val match = URL_EXTRACT_REGEX.find(sharedText)
                                  if (match != null) {
                                      targetUrl = match.value.trimEnd('.', ',', ')', ']', '"', '\'')
                                      if (title.isBlank()) {
                                          title = sharedText.replace(match.value, "").trim()
                                      }
                                  }
                              }
                          }
                          else -> return null
                      }

                      if (targetUrl.isBlank()) return null

                      val headersMap = Arguments.createMap()
                      extractHeadersFromExtras(intent.extras, headersMap)

                      val result = Arguments.createMap()
                      result.putString("url", targetUrl)
                      result.putBoolean("isLocalUri", isLocalContent)
                      result.putString("title", title)
                      result.putString("mimeType", intent.type ?: "")
                      result.putMap("headers", headersMap)
                      return result
                  }

                  private fun extractHeadersFromExtras(extras: Bundle?, outMap: WritableMap) {
                      if (extras == null) return

                      fun putHeaderNormalized(rawKey: String?, rawValue: Any?) {
                          val k = rawKey?.trim().orEmpty()
                          val v = rawValue?.toString()?.trim().orEmpty()
                          if (k.isBlank() || v.isBlank()) return
                          val canonicalKey = when (k.lowercase(Locale.US)) {
                              "referer", "referrer" -> "Referer"
                              "user-agent" -> "User-Agent"
                              "cookie" -> "Cookie"
                              "origin" -> "Origin"
                              "authorization" -> "Authorization"
                              else -> k
                          }
                          outMap.putString(canonicalKey, v)
                      }

                      // 1) البحث عن المفتاحين headers أو HTTP_HEADERS بكافة الصيغ (String[], ArrayList, Bundle, HashMap)
                      for (extraKey in extras.keySet()) {
                          val lowerKey = extraKey.lowercase(Locale.US)
                          @Suppress("DEPRECATION")
                          val extraVal = extras.get(extraKey)
                          if (lowerKey == "headers" || lowerKey == "android.media.intent.extra.http_headers") {
                              when (extraVal) {
                                  is Array<*> -> {
                                      val list = extraVal.mapNotNull { it?.toString() }
                                      var idx = 0
                                      while (idx + 1 < list.size) {
                                          putHeaderNormalized(list[idx], list[idx + 1])
                                          idx += 2
                                      }
                                  }
                                  is List<*> -> {
                                      val list = extraVal.mapNotNull { it?.toString() }
                                      var idx = 0
                                      while (idx + 1 < list.size) {
                                          putHeaderNormalized(list[idx], list[idx + 1])
                                          idx += 2
                                      }
                                  }
                                  is Bundle -> {
                                      for (subKey in extraVal.keySet()) {
                                          @Suppress("DEPRECATION")
                                          putHeaderNormalized(subKey, extraVal.get(subKey))
                                      }
                                  }
                                  is Map<*, *> -> {
                                      for ((mk, mv) in extraVal) {
                                          putHeaderNormalized(mk?.toString(), mv)
                                      }
                                  }
                              }
                          } else if (lowerKey in setOf("referer", "referrer", "user-agent", "cookie", "origin", "authorization")) {
                              // 3) المفاتيح الفردية بدون حساسية لحالة الأحرف
                              putHeaderNormalized(extraKey, extraVal)
                          }
                      }
                  }
              }

