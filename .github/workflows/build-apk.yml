              private data class HlsVariant(
                  val infLine: String,
                  val uriLine: String,
                  val bandwidth: Long,
                  val audioGroup: String?,
                  val subsGroup: String?
              )

              private fun parseMasterVariants(lines: List<String>): List<HlsVariant> {
                  val variants = ArrayList<HlsVariant>()
                  var i = 0
                  while (i < lines.size) {
                      val line = lines[i]
                      val trimmed = line.trim()
                      if (trimmed.startsWith("#EXT-X-STREAM-INF", ignoreCase = true)) {
                          var uriIdx = i + 1
                          while (uriIdx < lines.size && (lines[uriIdx].trim().isEmpty() || lines[uriIdx].trim().startsWith("#"))) {
                              uriIdx++
                          }
                          if (uriIdx < lines.size) {
                              val bwMatch = BANDWIDTH_REGEX.find(trimmed)
                              val bw = bwMatch?.groupValues?.getOrNull(1)?.toLongOrNull() ?: 0L
                              val audioGrp = AUDIO_GROUP_REGEX.find(trimmed)?.groupValues?.getOrNull(1)
                              val subsGrp = SUBS_GROUP_REGEX.find(trimmed)?.groupValues?.getOrNull(1)
                              variants.add(
                                  HlsVariant(
                                      infLine = line,
                                      uriLine = lines[uriIdx].trim(),
                                      bandwidth = bw,
                                      audioGroup = audioGrp,
                                      subsGroup = subsGrp
                                  )
                              )
                              i = uriIdx + 1
                              continue
                          }
                      }
                      i++
                  }
                  return variants
              }

              private fun rewriteUriAttributes(line: String, baseUri: URI, defaultExt: String): String {
                  if (!line.contains("URI=\"", ignoreCase = true)) return line
                  return URI_ATTR_REGEX.replace(line) { m ->
                      val relUri = m.groupValues[2]
                      val proxied = registerProxySubUrl(baseUri, relUri, defaultExt = defaultExt)
                      "${m.groupValues[1]}$proxied${m.groupValues[3]}"
                  }
              }

              private fun rewriteM3u8Playlist(body: String, finalBaseUrl: String): M3u8RewriteResult {
                  val baseUri = URI.create(finalBaseUrl)
                  val lines = body.split("\n").map { it.trimEnd('\r') }

                  val isMasterPlaylist = lines.any { it.trim().startsWith("#EXT-X-STREAM-INF", ignoreCase = true) }
                  if (isMasterPlaylist && activePinHighestQuality) {
                      val headerLines = ArrayList<String>()
                      val mediaLines = ArrayList<String>()
                      val variants = parseMasterVariants(lines)
                      var i = 0
                      while (i < lines.size) {
                          val line = lines[i]
                          val trimmed = line.trim()
                          if (trimmed.isEmpty()) {
                              i++
                              continue
                          }
                          if (trimmed.startsWith("#EXT-X-STREAM-INF", ignoreCase = true)) {
                              var uriIdx = i + 1
                              while (uriIdx < lines.size && (lines[uriIdx].trim().isEmpty() || lines[uriIdx].trim().startsWith("#"))) {
                                  uriIdx++
                              }
                              i = if (uriIdx < lines.size) uriIdx + 1 else i + 1
                              continue
                          } else if (trimmed.startsWith("#EXT-X-MEDIA", ignoreCase = true)) {
                              mediaLines.add(line)
                          } else if (!trimmed.startsWith("#EXT-X-I-FRAME-STREAM-INF", ignoreCase = true)) {
                              headerLines.add(line)
                          }
                          i++
                      }

                      if (variants.isNotEmpty()) {
                          val best = variants.maxByOrNull { it.bandwidth }!!
                          val chosenResolvedUrl = try {
                              baseUri.resolve(best.uriLine).toString()
                          } catch (_: Throwable) {
                              best.uriLine
                          }
                          val sb = StringBuilder(512)
                          for (hl in headerLines) {
                              sb.append(rewriteUriAttributes(hl, baseUri, defaultExt = "m3u8")).append('\n')
                          }
                          for (ml in mediaLines) {
                              val grp = MEDIA_GROUP_REGEX.find(ml)?.groupValues?.getOrNull(1)
                              val matchesAudio = best.audioGroup != null && grp == best.audioGroup
                              val matchesSubs = best.subsGroup != null && grp == best.subsGroup
                              if (grp == null || matchesAudio || matchesSubs) {
                                  sb.append(rewriteUriAttributes(ml, baseUri, defaultExt = "m3u8")).append('\n')
                              }
                          }
                          sb.append(best.infLine).append('\n')
                          val proxiedVariant = registerProxySubUrl(baseUri, best.uriLine, defaultExt = "m3u8")
                          sb.append(proxiedVariant).append('\n')
                          return M3u8RewriteResult(
                              rewrittenText = sb.toString(),
                              isMasterPlaylist = true,
                              chosenVariantTargetUrl = chosenResolvedUrl
                          )
                      }
                  }

                  val sb = StringBuilder(body.length + 512)
                  for (rawLine in lines) {
                      val trimmed = rawLine.trim()
                      if (trimmed.isEmpty()) {
                          sb.append('\n')
                          continue
                      }
                      if (trimmed.startsWith("#")) {
                          val defaultAttrExt = if (trimmed.contains("KEY", ignoreCase = true)) "key" else "m3u8"
                          sb.append(rewriteUriAttributes(rawLine, baseUri, defaultExt = defaultAttrExt)).append('\n')
                      } else {
                          val guessedPartExt = if (trimmed.substringBefore('?').lowercase(Locale.US).endsWith(".m3u8")) "m3u8" else "ts"
                          val proxied = registerProxySubUrl(baseUri, trimmed, defaultExt = guessedPartExt)
                          sb.append(proxied).append('\n')
                      }
                  }
                  return M3u8RewriteResult(
                      rewrittenText = sb.toString(),
                      isMasterPlaylist = isMasterPlaylist,
                      chosenVariantTargetUrl = null
                  )
              }

              private fun registerProxySubUrl(baseUri: URI, relativeOrAbsolute: String, defaultExt: String): String {
                  val resolved = try {
                      baseUri.resolve(relativeOrAbsolute).toString()
                  } catch (_: Throwable) {
                      relativeOrAbsolute
                  }
                  val subId = subIdCounter.getAndIncrement().toString()
                  proxyTargetMap[subId] = resolved
                  val cleanPath = resolved.substringBefore('?').substringBefore('#')
                  val rawName = cleanPath.substringAfterLast('/', "seg.$defaultExt").ifBlank { "seg.$defaultExt" }
                  val ext = rawName.substringAfterLast('.', defaultExt).lowercase(Locale.US)
                  val safeExt = if (ext.length in 2..5 && ext.all { it.isLetterOrDigit() }) ext else defaultExt
                  return "$activeLocalBaseUrl/p/$activeToken/$subId/part.$safeExt"
              }

              private fun guessMimeFromUrl(url: String, fallback: String): String {
                  val lower = url.substringBefore('?').lowercase(Locale.US)
                  return when {
                      lower.endsWith(".m3u8") -> "application/vnd.apple.mpegurl"
                      lower.endsWith(".mp4") || lower.endsWith(".m4v") -> "video/mp4"
                      lower.endsWith(".mkv") -> "video/x-matroska"
                      lower.endsWith(".ts") -> "video/mp2t"
                      lower.endsWith(".webm") -> "video/webm"
                      lower.endsWith(".mov") -> "video/quicktime"
                      lower.endsWith(".avi") -> "video/x-msvideo"
                      else -> fallback.ifBlank { "video/mp4" }
                  }
              }

              private fun parseByteRange(rangeHeader: String?, totalLength: Long): Pair<Long, Long>? {
                  if (rangeHeader.isNullOrBlank()) return null
                  val trimmed = rangeHeader.trim()
                  if (!trimmed.startsWith("bytes=", ignoreCase = true)) return null
                  val spec = trimmed.substring(6).substringBefore(',').trim()
                  val dash = spec.indexOf('-')
                  if (dash < 0) return null
                  val startStr = spec.substring(0, dash).trim()
                  val endStr = spec.substring(dash + 1).trim()
                  return try {
                      if (startStr.isEmpty()) {
                          val suffix = endStr.toLong()
                          if (suffix <= 0L) return null
                          val start = (totalLength - suffix).coerceAtLeast(0L)
                          Pair(start, totalLength - 1L)
                      } else {
                          val start = startStr.toLong()
                          val end = if (endStr.isEmpty()) totalLength - 1L else endStr.toLong().coerceAtMost(totalLength - 1L)
                          if (start < 0L || start >= totalLength || end < start) null else Pair(start, end)
                      }
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun skipExact(input: InputStream, bytesToSkip: Long) {
                  var remaining = bytesToSkip
                  val skipBuf = ByteArray(16384)
                  while (remaining > 0L) {
                      val skipped = input.skip(remaining)
                      if (skipped > 0L) {
                          remaining -= skipped
                      } else {
                          val n = input.read(skipBuf, 0, minOf(skipBuf.size.toLong(), remaining).toInt())
                          if (n < 0) break
                          remaining -= n.toLong()
                      }
                  }
              }

              private fun streamAll(input: InputStream, output: OutputStream, maxBytes: Long) {
                  val buffer = ByteArray(BUFFER_SIZE)
                  var remaining = maxBytes
                  while (remaining > 0L) {
                      val toRead = if (remaining < buffer.size.toLong()) remaining.toInt() else buffer.size
                      val read = input.read(buffer, 0, toRead)
                      if (read <= 0) break
                      output.write(buffer, 0, read)
                      if (remaining != Long.MAX_VALUE) {
                          remaining -= read.toLong()
                      }
                  }
                  output.flush()
              }

              private fun sendErrorResponse(output: OutputStream, code: Int, reason: String) {
                  val bodyBytes = "$code $reason".toByteArray(StandardCharsets.UTF_8)
                  val headers = buildString {
                      append("HTTP/1.1 ").append(code).append(" ").append(reason).append("\r\n")
                      append("Content-Type: text/plain; charset=utf-8\r\n")
                      append("Content-Length: ").append(bodyBytes.size).append("\r\n")
                      append("Connection: close\r\n")
                      append("\r\n")
                  }
                  output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                  output.write(bodyBytes)
                  output.flush()
              }
          }
