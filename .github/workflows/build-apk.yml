name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Checkout Custom Code
        uses: actions/checkout@v4
        with:
          path: my_ai_code

      - name: Create React Native Engine
        run: |
          npx --yes @react-native-community/cli@latest init universalremote --version 0.73.6
          
      - name: Fix Package Name Configuration
        run: |
          echo "module.exports = { project: { android: { packageName: 'com.universalremote' } } };" > universalremote/react-native.config.js
          
      - name: Merge AI Code Safely (Filter out Web files)
        run: |
          rsync -av --exclude='package.json' --exclude='package-lock.json' --exclude='node_modules' my_ai_code/ universalremote/

      - name: Grant execute permission for gradlew
        working-directory: ./universalremote/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./universalremote/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: universalremote/android/app/build/outputs/apk/debug/app-debug.apk
          
