                          @Suppress("DEPRECATION")
                          if (touchAudioAttributes != null) {
                              v.vibrate(ms, touchAudioAttributes)
                          } else {
                              v.vibrate(ms)
                          }
                      }
                  } catch (_: Throwable) {
                  }
              }

              @ReactMethod
              fun cancel() {
                  try {
                      vibrator?.cancel()
                  } catch (_: Throwable) {
                  }
              }
