              private fun parseDmrDescription(locationUrl: String, xml: String): DlnaRendererDevice? {
                  return try {
                      val baseUri = URI.create(locationUrl)
                      val host = baseUri.host ?: return null
                      val port = if (baseUri.port > 0) baseUri.port else 9197

                      val factory = DocumentBuilderFactory.newInstance().apply {
                          isNamespaceAware = false
                      }
                      val doc = factory.newDocumentBuilder().parse(ByteArrayInputStream(xml.toByteArray(StandardCharsets.UTF_8)))
                      val root = doc.documentElement

                      val friendlyName = findFirstTagText(root, "friendlyName") ?: "DLNA Smart TV"
                      val manufacturer = findFirstTagText(root, "manufacturer") ?: ""
                      val modelName = findFirstTagText(root, "modelName") ?: ""
                      val udn = findFirstTagText(root, "UDN") ?: ""

                      var avControlUrl = ""
                      var rcControlUrl = ""

                      val serviceNodes = root.getElementsByTagName("service")
                      for (i in 0 until serviceNodes.length) {
                          val el = serviceNodes.item(i) as? Element ?: continue
                          val st = findFirstTagText(el, "serviceType") ?: ""
                          val ctrl = findFirstTagText(el, "controlURL") ?: ""
                          if (st.contains("AVTransport", ignoreCase = true) && ctrl.isNotBlank()) {
                              avControlUrl = baseUri.resolve(ctrl).toString()
                          } else if (st.contains("RenderingControl", ignoreCase = true) && ctrl.isNotBlank()) {
                              rcControlUrl = baseUri.resolve(ctrl).toString()
                          }
                      }

                      if (avControlUrl.isBlank()) {
                          avControlUrl = baseUri.resolve("/upnp/control/AVTransport1").toString()
                      }
                      if (rcControlUrl.isBlank()) {
                          rcControlUrl = baseUri.resolve("/upnp/control/RenderingControl1").toString()
                      }

                      DlnaRendererDevice(
                          udn = udn,
                          name = friendlyName,
                          manufacturer = manufacturer,
                          modelName = modelName,
                          ip = host,
                          port = port,
                          location = locationUrl,
                          avTransportControlUrl = avControlUrl,
                          renderingControlUrl = rcControlUrl
                      )
                  } catch (_: Throwable) {
                      null
                  }
              }

