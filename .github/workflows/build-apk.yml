              private val proxyTargetMap = ConcurrentHashMap<String, String>()
              private val m3u8Cache = ConcurrentHashMap<String, CachedM3u8Entry>()
              private val m3u8FetchLocks = ConcurrentHashMap<String, Any>()
              private val subIdCounter = AtomicInteger(1)

              fun getPort(): Int = serverSocket?.localPort ?: 0

              fun getWifiIpv4Address(): String? {
                  try {
                      val cm = context.applicationContext.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager
                      if (cm != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val networks = cm.allNetworks
                          for (net in networks) {
                              val caps = cm.getNetworkCapabilities(net) ?: continue
                              if (!caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) continue
                              val linkProps = cm.getLinkProperties(net) ?: continue
                              for (linkAddr in linkProps.linkAddresses) {
                                  val addr = linkAddr.address
                                  if (addr is Inet4Address && !addr.isLoopbackAddress && addr.isSiteLocalAddress) {
                                      return addr.hostAddress
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {
                  }

                  try {
                      val ifaces = NetworkInterface.getNetworkInterfaces()
                      while (ifaces != null && ifaces.hasMoreElements()) {
                          val iface = ifaces.nextElement()
                          if (!iface.isUp || iface.isLoopback) continue
                          val name = iface.name?.lowercase(Locale.US) ?: ""
                          if (!name.startsWith("wlan") && !name.startsWith("eth")) continue
                          val addrs = iface.inetAddresses
                          while (addrs.hasMoreElements()) {
                              val addr = addrs.nextElement()
                              if (addr is Inet4Address && !addr.isLoopbackAddress && addr.isSiteLocalAddress) {
                                  return addr.hostAddress
                              }
                          }
                      }
                  } catch (_: Throwable) {
                  }
                  return null
              }

              @Synchronized
              fun ensureStarted(): Int {
                  if (running && serverSocket != null && serverSocket?.isClosed == false) {
                      return serverSocket!!.localPort
                  }
                  stopServer()
                  val ss = ServerSocket(0)
                  ss.reuseAddress = true
                  serverSocket = ss
                  val executor = Executors.newCachedThreadPool()
                  clientExecutor = executor
                  running = true
                  acceptThread = Thread({
                      while (running && !ss.isClosed) {
                          try {
                              val client = ss.accept()
                              executor.execute {
                                  handleClient(client)
                              }
                          } catch (_: Throwable) {
                              if (!running || ss.isClosed) break
                          }
                      }
                  }, "DlnaHttpAcceptThread").apply {
                      isDaemon = true
                      start()
                  }
                  return ss.localPort
              }

              @Synchronized
              fun stopServer() {
                  running = false
                  activeToken = ""
                  activeSubtitleBytes = null
                  activeSubtitleLocalUrl = null
                  activeM3u8FinalUrl = ""
                  lastUpstreamStatusCode = 0
                  lastUpstreamUrl = ""
                  lastUpstreamFailedHost = ""
                  lastUpstreamServerHint = ""
                  lastUpstreamEngine = ""
                  lastUpstreamStage = ""
                  lastUpstreamPathTail = ""
                  proxyTargetMap.clear()
                  m3u8Cache.clear()
                  m3u8FetchLocks.clear()
                  sessionCookieJar.clear()
                  try {
                      serverSocket?.close()
                  } catch (_: Throwable) {
                  }
                  serverSocket = null
                  try {
                      clientExecutor?.shutdownNow()
                  } catch (_: Throwable) {
                  }
                  clientExecutor = null
                  acceptThread = null
              }

              fun prepareLocalSession(
                  uri: Uri,
                  mimeType: String,
                  fileExt: String,
                  subtitle: SubtitleSourceSpec? = null
              ): Pair<String, String?> {
                  val wifiIp = getWifiIpv4Address() ?: throw IllegalStateException("Wi-Fi IPv4 غير متوفر. تأكد من الاتصال بالواي فاي.")
                  val port = ensureStarted()
                  val token = UUID.randomUUID().toString().replace("-", "")
                  proxyTargetMap.clear()
                  m3u8Cache.clear()
                  m3u8FetchLocks.clear()
                  sessionCookieJar.clear()
                  lastUpstreamStatusCode = 0
                  lastUpstreamUrl = ""
                  lastUpstreamFailedHost = ""
                  lastUpstreamServerHint = ""
                  lastUpstreamEngine = ""
                  lastUpstreamStage = ""
                  lastUpstreamPathTail = ""
                  activeM3u8FinalUrl = ""
                  activeSourceType = "LOCAL"
                  activeLocalUri = uri
                  activeMimeType = mimeType
                  activeRemoteUrl = ""
                  activeHeaders = emptyMap()
                  activePinHighestQuality = true
                  activeIsHlsVod = false
                  activeToken = token
                  val safeExt = sanitizeExt(fileExt, mimeType)
                  activeLocalBaseUrl = "http://$wifiIp:$port"
