                  val v = vibrator ?: return
                  if (!hasHardware) return
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val effect = activeCache[patternKey] ?: return
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && touchVibrationAttributes is VibrationAttributes) {
                              v.vibrate(effect, touchVibrationAttributes)
                          } else if (touchAudioAttributes != null) {
                              @Suppress("DEPRECATION")
                              v.vibrate(effect, touchAudioAttributes)
                          } else {
                              v.vibrate(effect)
                          }
                      } else {
                          val ms = legacyDurations[patternKey] ?: return
                          @Suppress("DEPRECATION")
                          if (touchAudioAttributes != null) {
                              v.vibrate(ms, touchAudioAttributes)
                          } else {
                              v.vibrate(ms)
                          }
                      }
                  } catch (_: Throwable) {
                  }
              }

              @ReactMethod
              fun cancel() {
                  try {
                      vibrator?.cancel()
                  } catch (_: Throwable) {
                  }
              }
