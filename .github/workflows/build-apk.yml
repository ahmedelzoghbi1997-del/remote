                  private fun extractHeadersFromExtras(extras: Bundle?, outMap: WritableMap) {
                      if (extras == null) return

                      fun putHeaderNormalized(rawKey: String?, rawValue: Any?, overwrite: Boolean = true) {
                          val k = rawKey?.trim().orEmpty()
                          val v = rawValue?.toString()?.trim().orEmpty()
                          if (k.isBlank() || v.isBlank()) return
                          val canonicalKey = when (k.lowercase(Locale.US)) {
                              "referer", "referrer" -> "Referer"
                              "user-agent" -> "User-Agent"
                              "cookie" -> "Cookie"
                              "origin" -> "Origin"
                              "authorization" -> "Authorization"
                              else -> k
                          }
                          if (!overwrite && outMap.hasKey(canonicalKey)) return
                          outMap.putString(canonicalKey, v)
                      }

                      // 1) البحث عن المفتاحين headers أو HTTP_HEADERS بكافة الصيغ (String[], ArrayList, Bundle, HashMap)
                      for (extraKey in extras.keySet()) {
                          val lowerKey = extraKey.lowercase(Locale.US)
                          @Suppress("DEPRECATION")
                          val extraVal = extras.get(extraKey)
                          if (lowerKey == "headers" || lowerKey == "android.media.intent.extra.http_headers") {
                              when (extraVal) {
                                  is Array<*> -> {
                                      val list = extraVal.mapNotNull { it?.toString() }
                                      var idx = 0
                                      while (idx + 1 < list.size) {
                                          putHeaderNormalized(list[idx], list[idx + 1])
                                          idx += 2
                                      }
                                  }
                                  is List<*> -> {
                                      val list = extraVal.mapNotNull { it?.toString() }
                                      var idx = 0
                                      while (idx + 1 < list.size) {
                                          putHeaderNormalized(list[idx], list[idx + 1])
                                          idx += 2
                                      }
                                  }
                                  is Bundle -> {
                                      for (subKey in extraVal.keySet()) {
                                          @Suppress("DEPRECATION")
                                          putHeaderNormalized(subKey, extraVal.get(subKey))
                                      }
                                  }
                                  is Map<*, *> -> {
                                      for ((mk, mv) in extraVal) {
                                          putHeaderNormalized(mk?.toString(), mv)
                                      }
                                  }
                              }
                          } else if (lowerKey in setOf("referer", "referrer", "user-agent", "cookie", "origin", "authorization")) {
                              // 2) المفاتيح الفردية بدون حساسية لحالة الأحرف
                              putHeaderNormalized(extraKey, extraVal)
                          }
                      }

                      // 3) دعم Intent.EXTRA_REFERRER و Intent.EXTRA_REFERRER_NAME لروابط http/https فقط
                      @Suppress("DEPRECATION")
                      val rawExtraRef = extras.get(Intent.EXTRA_REFERRER) ?: extras.get(Intent.EXTRA_REFERRER_NAME)
                      val refStr = rawExtraRef?.toString()?.trim().orEmpty()
                      if (refStr.startsWith("http://", ignoreCase = true) || refStr.startsWith("https://", ignoreCase = true)) {
                          putHeaderNormalized("Referer", refStr, overwrite = false)
                      }
                  }
              }

