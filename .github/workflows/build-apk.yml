                          if (playlistText.trimStart().startsWith("#EXTM3U") || finalPathNoQuery.endsWith(".m3u8")) {
                              val rewritten = rewriteM3u8Playlist(playlistText, finalUrl)
                              val bytes = rewritten.toByteArray(StandardCharsets.UTF_8)
                              val headers = buildString {
                                  append("HTTP/1.1 200 OK\r\n")
                                  append("Content-Type: application/vnd.apple.mpegurl\r\n")
                                  append("Content-Length: ").append(bytes.size).append("\r\n")
                                  append("Cache-Control: no-cache\r\n")
                                  append("transferMode.dlna.org: Streaming\r\n")
                                  append("contentFeatures.dlna.org: DLNA.ORG_OP=00;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                                  append("Connection: close\r\n")
                                  append("\r\n")
                              }
                              output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                              output.write(bytes)
                              output.flush()
                              return
                          } else {
                              val rawBytes = playlistText.toByteArray(StandardCharsets.UTF_8)
                              val headers = buildString {
                                  append("HTTP/1.1 ").append(resp.code).append(" ").append(resp.message.ifBlank { "OK" }).append("\r\n")
                                  append("Content-Type: ").append(contentType).append("\r\n")
                                  append("Content-Length: ").append(rawBytes.size).append("\r\n")
                                  append("Accept-Ranges: bytes\r\n")
                                  append("transferMode.dlna.org: Streaming\r\n")
                                  append("contentFeatures.dlna.org: DLNA.ORG_OP=01;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                                  append("Connection: close\r\n")
                                  append("\r\n")
                              }
                              output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                              output.write(rawBytes)
                              output.flush()
                              return
                          }
                      }

                      val respLen = resp.header("Content-Length")
                      val respRange = resp.header("Content-Range")
                      val acceptRanges = resp.header("Accept-Ranges") ?: if (resp.isSuccessful && !looksLikeM3u8Path) "bytes" else null
                      val dlnaOp = if (looksLikeM3u8Path || lowerType.contains("mpegurl")) "00" else "01"

                      val headers = buildString {
                          append("HTTP/1.1 ").append(resp.code).append(" ").append(resp.message.ifBlank { "OK" }).append("\r\n")
                          append("Content-Type: ").append(contentType).append("\r\n")
                          if (!respLen.isNullOrBlank()) {
                              append("Content-Length: ").append(respLen).append("\r\n")
                          }
                          if (!respRange.isNullOrBlank()) {
                              append("Content-Range: ").append(respRange).append("\r\n")
                          }
                          if (!acceptRanges.isNullOrBlank()) {
                              append("Accept-Ranges: ").append(acceptRanges).append("\r\n")
                          }
                          append("transferMode.dlna.org: Streaming\r\n")
                          append("contentFeatures.dlna.org: DLNA.ORG_OP=").append(dlnaOp).append(";DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                          append("Connection: close\r\n")
                          append("\r\n")
                      }
                      output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                      output.flush()

                      if (resp.body != null) {
                          resp.body!!.byteStream().use { stream ->
                              streamAll(stream, output, Long.MAX_VALUE)
                          }
                      }
                  }
