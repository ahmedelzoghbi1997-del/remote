              fun stopCast() {
                  stopPolling()
                  val dev = activeDevice
                  activeDevice = null
                  activeIsHlsVod = false
                  parsedVodDurationSec = 0
                  commandExecutor.execute {
                      if (dev != null) {
                          try {
                              soapClient.stop(dev.avTransportControlUrl)
                          } catch (_: Throwable) {
                          }
                      }
                      httpServer.stopServer()
                      publishSnapshot(
                          DlnaPlaybackSnapshot(
                              active = false,
                              transportState = "STOPPED"
                          )
                      )
                      stopForegroundServiceSafe()
                  }
              }

              private fun startPolling() {
                  stopPolling()
                  pollTask = pollExecutor.scheduleWithFixedDelay({
                      val dev = activeDevice ?: return@scheduleWithFixedDelay
                      if (!snapshot.active) return@scheduleWithFixedDelay
                      try {
                          val transport = soapClient.getTransportInfo(dev.avTransportControlUrl)
                          val pos = soapClient.getPositionInfo(dev.avTransportControlUrl)
                          val vol = try {
                              soapClient.getVolume(dev.renderingControlUrl)
                          } catch (_: Throwable) {
                              snapshot.volume
                          }
                          val muted = try {
                              soapClient.getMute(dev.renderingControlUrl)
                          } catch (_: Throwable) {
                              snapshot.muted
                          }

                          val effectiveDurationSec = when {
                              pos.durationSec > 0 -> pos.durationSec
                              activeIsHlsVod && parsedVodDurationSec > 0 -> parsedVodDurationSec
                              else -> 0
                          }
                          val isTrueLiveHls = (!activeIsHlsVod && snapshot.mimeType.contains("mpegurl", ignoreCase = true)) ||
                              (transport.state == "PLAYING" && effectiveDurationSec <= 0)
                          val seekableNow = (activeIsHlsVod && effectiveDurationSec > 0) || (!isTrueLiveHls && effectiveDurationSec > 0)

                          if (transport.state == "STOPPED" && snapshot.transportState != "TRANSITIONING") {
                              stopPolling()
                              activeDevice = null
                              activeIsHlsVod = false
                              parsedVodDurationSec = 0
                              httpServer.stopServer()
                              publishSnapshot(DlnaPlaybackSnapshot(active = false, transportState = "STOPPED"))
                              stopForegroundServiceSafe()
                          } else {
                              publishSnapshot(
                                  snapshot.copy(
                                      transportState = transport.state,
                                      positionSec = pos.positionSec,
                                      durationSec = effectiveDurationSec,
                                      isSeekable = seekableNow,
                                      volume = vol,
                                      muted = muted,
                                      error = ""
                                  )
                              )
                          }
                      } catch (_: Throwable) {
                      }
                  }, 1000L, 1000L, TimeUnit.MILLISECONDS)
              }

              private fun stopPolling() {
                  pollTask?.cancel(false)
                  pollTask = null
              }

              private fun startForegroundServiceSafe() {
                  if (!initialized) return
                  try {
                      val intent = Intent(appContext, DlnaCastService::class.java).apply {
                          action = DlnaCastService.ACTION_START_FOREGROUND
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ContextCompat.startForegroundService(appContext, intent)
                      } else {
                          appContext.startService(intent)
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun stopForegroundServiceSafe() {
                  if (!initialized) return
                  try {
                      appContext.stopService(Intent(appContext, DlnaCastService::class.java))
                  } catch (_: Throwable) {
                  }
              }
          }
