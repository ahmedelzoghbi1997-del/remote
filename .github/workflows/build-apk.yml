                              promise.resolve(out)
                          } catch (e: Throwable) {
                              promise.reject("SNIFFER_PARSE_ERROR", e.message ?: "تعذر قراءة بيانات الرابط الملتقط", e)
                          }
                      }
                      PICK_VIDEO_REQUEST_CODE -> {
                          val promise = pickPromise ?: return
                          pickPromise = null
                          handlePickedFileResult(resultCode, data, "video/mp4", "video.mp4", promise)
                      }
                      PICK_SUBTITLE_REQUEST_CODE -> {
                          val promise = pickSubtitlePromise ?: return
                          pickSubtitlePromise = null
                          handlePickedFileResult(resultCode, data, "text/srt", "subtitle.srt", promise, requireSubtitleExt = true)
                      }
                  }
              }

              private fun jsonObjToWritableMap(obj: org.json.JSONObject?): WritableMap {
                  val map = Arguments.createMap()
                  if (obj == null) return map
                  val keys = obj.keys()
                  while (keys.hasNext()) {
                      val k = keys.next()
                      val v = obj.optString(k)
                      if (v.isNotBlank()) {
                          map.putString(k, v)
                      }
                  }
                  return map
              }

              private fun handlePickedFileResult(
                  resultCode: Int,
                  data: Intent?,
                  defaultMime: String,
                  defaultName: String,
                  promise: Promise,
                  requireSubtitleExt: Boolean = false
              ) {
                  if (resultCode != Activity.RESULT_OK || data?.data == null) {
                      promise.reject("PICK_CANCELLED", "لم يتم اختيار أي ملف")
                      return
                  }
                  val uri = data.data!!
                  try {
                      val takeFlags = data.flags and Intent.FLAG_GRANT_READ_URI_PERMISSION
                      if (takeFlags != 0) {
                          reactApplicationContext.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                  } catch (_: Throwable) {
                  }

                  var displayName = defaultName
                  var sizeBytes = -1L
                  try {
                      reactApplicationContext.contentResolver.query(
                          uri,
                          arrayOf(OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE),
                          null,
                          null,
                          null
                      )?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val nameIdx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (nameIdx >= 0 && !cursor.isNull(nameIdx)) {
                                  displayName = cursor.getString(nameIdx) ?: displayName
                              }
                              val sizeIdx = cursor.getColumnIndex(OpenableColumns.SIZE)
                              if (sizeIdx >= 0 && !cursor.isNull(sizeIdx)) {
                                  sizeBytes = cursor.getLong(sizeIdx)
                              }
                          }
                      }
                  } catch (_: Throwable) {
                  }

                  if (requireSubtitleExt) {
                      val lowerName = displayName.lowercase(Locale.US)
                      val lowerUri = uri.toString().lowercase(Locale.US)
                      if (!lowerName.endsWith(".srt") && !lowerName.endsWith(".vtt") &&
                          !lowerUri.endsWith(".srt") && !lowerUri.endsWith(".vtt")
                      ) {
                          promise.reject("INVALID_SUBTITLE_FILE", "يرجى اختيار ملف ترجمة بصيغة .srt أو .vtt فقط")
                          return
                      }
                  }

                  val mime = reactApplicationContext.contentResolver.getType(uri) ?: defaultMime
                  val result = Arguments.createMap()
                  result.putString("uri", uri.toString())
                  result.putString("name", displayName)
                  result.putDouble("sizeBytes", sizeBytes.toDouble())
                  result.putString("mimeType", mime)
                  promise.resolve(result)
              }

              override fun onNewIntent(intent: Intent) {
                  val parsed = parseCastIntentToMap(intent) ?: return
                  emitEvent(EVENT_INTENT, parsed)
              }

              private fun parseSubtitleSpec(subMap: ReadableMap?): SubtitleSourceSpec? {
                  if (subMap == null) return null
                  val rawUriOrUrl = subMap.getString("uriOrUrl")?.trim().orEmpty()
                  if (rawUriOrUrl.isBlank()) return null
                  val isLocal = if (subMap.hasKey("isLocal")) subMap.getBoolean("isLocal") else !rawUriOrUrl.startsWith("http", ignoreCase = true)
                  val title = subMap.getString("title").orEmpty()
                  val offsetSec = if (subMap.hasKey("offsetSec")) subMap.getInt("offsetSec") else 0
                  val headers = readableMapToStringMap(if (subMap.hasKey("headers")) subMap.getMap("headers") else null)
                  return SubtitleSourceSpec(
                      uriOrUrl = rawUriOrUrl,
                      isLocal = isLocal,
                      title = title,
                      offsetSec = offsetSec,
                      headers = headers
                  )
              }

              private fun readableMapToStringMap(m: ReadableMap?): Map<String, String> {
                  val out = HashMap<String, String>()
                  if (m == null) return out
                  val iter = m.keySetIterator()
                  while (iter.hasNextKey()) {
                      val k = iter.nextKey()
                      val v = m.getString(k)
                      if (!v.isNullOrBlank()) {
                          out[k] = v
                      }
                  }
                  return out
              }

              @ReactMethod
              fun castLocalFile(
                  deviceMap: ReadableMap,
                  contentUri: String,
                  title: String?,
                  mimeType: String?,
                  subtitleMap: ReadableMap?,
                  promise: Promise
              ) {
                  bgExecutor.execute {
                      try {
                          val device = parseDeviceMap(deviceMap)
                          val uri = Uri.parse(contentUri)
                          val resolvedMime = mimeType?.takeIf { it.isNotBlank() }
                              ?: reactApplicationContext.contentResolver.getType(uri)
                              ?: "video/mp4"
                          val cleanTitle = title?.takeIf { it.isNotBlank() } ?: "Local Video"
                          val ext = cleanTitle.substringAfterLast('.', "")
                          val subSpec = parseSubtitleSpec(subtitleMap)
                          DlnaCastCoordinator.castLocalUri(device, uri, cleanTitle, resolvedMime, ext, subSpec)
                          promise.resolve(DlnaCastCoordinator.getCurrentSnapshot().toWritableMap())
                      } catch (e: Throwable) {
                          promise.reject("DLNA_CAST_LOCAL_ERROR", e.message ?: "فشل بث الملف المحلي", e)
                      }
                  }
              }

              @ReactMethod
              fun castRemoteUrl(
                  deviceMap: ReadableMap,
                  url: String,
                  title: String?,
                  useProxy: Boolean,
                  pinHighestQuality: Boolean,
                  headersMap: ReadableMap?,
                  subtitleMap: ReadableMap?,
                  promise: Promise
              ) {
                  bgExecutor.execute {
                      try {
                          val device = parseDeviceMap(deviceMap)
                          val cleanUrl = url.trim()
                          val headers = readableMapToStringMap(headersMap)
                          val lowerPath = cleanUrl.substringBefore('?').lowercase(Locale.US)
                          val guessedMime = when {
                              lowerPath.endsWith(".m3u8") -> "application/vnd.apple.mpegurl"
                              lowerPath.endsWith(".mkv") -> "video/x-matroska"
                              lowerPath.endsWith(".ts") -> "video/mp2t"
                              lowerPath.endsWith(".webm") -> "video/webm"
                              lowerPath.endsWith(".mov") -> "video/quicktime"
                              else -> "video/mp4"
                          }
                          val ext = lowerPath.substringAfterLast('/', "").substringAfterLast('.', "")
                          val cleanTitle = title?.takeIf { it.isNotBlank() } ?: "Stream Video"
                          val subSpec = parseSubtitleSpec(subtitleMap)
                          DlnaCastCoordinator.castRemoteUrl(
                              device,
                              cleanUrl,
                              cleanTitle,
                              guessedMime,
                              ext,
                              useProxy,
                              pinHighestQuality,
                              headers,
                              subSpec
                          )
                          promise.resolve(DlnaCastCoordinator.getCurrentSnapshot().toWritableMap())
                      } catch (e: Throwable) {
                          promise.reject("DLNA_CAST_REMOTE_ERROR", e.message ?: "فشل بث الرابط إلى الشاشة", e)
                      }
                  }
              }

              @ReactMethod
              fun recastWithSubtitle(subtitleMap: ReadableMap?, promise: Promise) {
                  bgExecutor.execute {
                      try {
                          val subSpec = parseSubtitleSpec(subtitleMap)
                          DlnaCastCoordinator.recastWithSubtitle(subSpec)
                          promise.resolve(DlnaCastCoordinator.getCurrentSnapshot().toWritableMap())
                      } catch (e: Throwable) {
                          promise.reject("DLNA_RECAST_SUB_ERROR", e.message ?: "تعذر إعادة الإرسال مع الترجمة", e)
                      }
                  }
              }

              @ReactMethod
              fun play(promise: Promise) {
                  DlnaCastCoordinator.play()
                  promise.resolve(true)
              }

              @ReactMethod
              fun pause(promise: Promise) {
                  DlnaCastCoordinator.pause()
                  promise.resolve(true)
              }

              @ReactMethod
              fun stop(promise: Promise) {
                  DlnaCastCoordinator.stopCast()
                  promise.resolve(true)
              }

              @ReactMethod
              fun seek(seconds: Int, promise: Promise) {
                  DlnaCastCoordinator.seekSeconds(seconds)
                  promise.resolve(true)
              }

              @ReactMethod
              fun setVolume(volume: Int, promise: Promise) {
                  DlnaCastCoordinator.setVolume(volume)
                  promise.resolve(true)
              }

              @ReactMethod
              fun setMute(muted: Boolean, promise: Promise) {
                  DlnaCastCoordinator.setMute(muted)
                  promise.resolve(true)
              }

              private fun parseDeviceMap(m: ReadableMap): DlnaRendererDevice {
                  val ip = m.getString("ip").orEmpty().trim()
                  val port = if (m.hasKey("port")) m.getInt("port") else 9197
                  val avUrl = m.getString("avTransportControlUrl")?.takeIf { it.isNotBlank() }
                      ?: "http://$ip:$port/upnp/control/AVTransport1"
                  val rcUrl = m.getString("renderingControlUrl")?.takeIf { it.isNotBlank() }
                      ?: "http://$ip:$port/upnp/control/RenderingControl1"
                  return DlnaRendererDevice(
                      udn = m.getString("udn").orEmpty(),
                      name = m.getString("name") ?: "Smart TV",
                      manufacturer = m.getString("manufacturer").orEmpty(),
                      modelName = m.getString("modelName").orEmpty(),
                      ip = ip,
                      port = port,
                      location = m.getString("location").orEmpty(),
                      avTransportControlUrl = avUrl,
                      renderingControlUrl = rcUrl
                  )
              }

              override fun onCatalystInstanceDestroy() {
                  reactApplicationContext.removeActivityEventListener(this)
                  DlnaCastCoordinator.setStateListener(null)
                  bgExecutor.shutdownNow()
                  super.onCatalystInstanceDestroy()
              }
          }
