          cat << 'EOF' > universalremote/android/app/src/main/java/com/universalremote/LanTlsOkHttpFactory.kt
          package com.universalremote

          import com.facebook.react.modules.network.CustomClientBuilder
          import com.facebook.react.modules.network.OkHttpClientFactory
          import com.facebook.react.modules.network.OkHttpClientProvider
          import okhttp3.OkHttpClient
          import java.net.InetAddress
          import java.security.KeyStore
          import java.security.SecureRandom
          import java.security.cert.CertificateException
          import java.security.cert.X509Certificate
          import java.util.concurrent.TimeUnit
          import javax.net.ssl.HostnameVerifier
          import javax.net.ssl.HttpsURLConnection
          import javax.net.ssl.SSLContext
          import javax.net.ssl.TrustManagerFactory
          import javax.net.ssl.X509TrustManager

          class LanTlsOkHttpFactory : OkHttpClientFactory, CustomClientBuilder {
              override fun createNewNetworkModuleClient(): OkHttpClient {
                  val builder = OkHttpClientProvider.createClientBuilder()
                  apply(builder)
                  return builder.build()
              }

              override fun apply(builder: OkHttpClient.Builder) {
                  try {
                      val tmf = TrustManagerFactory.getInstance(TrustManagerFactory.getDefaultAlgorithm())
                      tmf.init(null as KeyStore?)
                      val defaultTm = tmf.trustManagers.filterIsInstance<X509TrustManager>().firstOrNull()
                          ?: return

                      val lanTrustManager = object : X509TrustManager {
                          override fun checkClientTrusted(chain: Array<out X509Certificate>?, authType: String?) {
                              defaultTm.checkClientTrusted(chain, authType)
                          }

                          override fun checkServerTrusted(chain: Array<out X509Certificate>?, authType: String?) {
                              try {
                                  defaultTm.checkServerTrusted(chain, authType)
                              } catch (ex: CertificateException) {
                                  // السماح بشهادة SSL الموقعة ذاتياً لشاشات الشبكة المحلية (Samsung Tizen 8002)
                                  if (chain == null || chain.size > 2) {
                                      throw ex
                                  }
                              }
                          }

                          override fun getAcceptedIssuers(): Array<X509Certificate> = defaultTm.acceptedIssuers
                      }

                      val sslContext = SSLContext.getInstance("TLS")
                      sslContext.init(null, arrayOf(lanTrustManager), SecureRandom())
                      builder.sslSocketFactory(sslContext.socketFactory, lanTrustManager)
                      builder.hostnameVerifier(HostnameVerifier { hostname, session ->
                          if (HttpsURLConnection.getDefaultHostnameVerifier().verify(hostname, session)) {
                              return@HostnameVerifier true
                          }
                          val isIpv4Literal = hostname.matches(Regex("^\\d{1,3}(\\.\\d{1,3}){3}$"))
                          if (!isIpv4Literal) {
                              return@HostnameVerifier false
                          }
                          try {
                              val addr = InetAddress.getByName(hostname)
                              addr.isSiteLocalAddress || addr.isLoopbackAddress
                          } catch (_: Exception) {
                              false
                          }
                      })
                      builder.connectTimeout(10, TimeUnit.SECONDS)
                  } catch (_: Exception) {
                  }
              }
          }
          EOF

