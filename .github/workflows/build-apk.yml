                      val failedHost = httpServer.lastUpstreamFailedHost
                      val serverHint = httpServer.lastUpstreamServerHint
                      val upstreamEngine = httpServer.lastUpstreamEngine
                      val upstreamStage = httpServer.lastUpstreamStage
                      val upstreamTail = httpServer.lastUpstreamPathTail
                      val enrichedMsg = if (baseMsg.contains("716") && upstreamCode >= 400) {
