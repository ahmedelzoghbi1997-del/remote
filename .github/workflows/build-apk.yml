                      if (!subtitleUrl.isNullOrBlank()) {
                          val escapedSub = xmlEscape(subtitleUrl)
                          append("<sec:CaptionInfo sec:type=\"srt\">").append(escapedSub).append("</sec:CaptionInfo>")
                          append("<sec:CaptionInfoEx sec:type=\"srt\">").append(escapedSub).append("</sec:CaptionInfoEx>")
                      }
                      append("</item>")
                      append("</DIDL-Lite>")
                  }
              }

              fun setAvTransportUri(
                  controlUrl: String,
                  mediaUrl: String,
                  title: String,
                  mimeType: String,
                  isSeekable: Boolean,
                  isDirectExternal: Boolean = false,
                  subtitleUrl: String? = null,
                  isHlsVod: Boolean = false
              ) {
                  val didl = buildDidlLiteMetadata(
                      mediaUrl,
                      title,
                      mimeType,
                      isSeekable,
                      isDirectExternal,
                      subtitleUrl,
                      isHlsVod
                  )
                  val body = """
                      <InstanceID>0</InstanceID>
                      <CurrentURI>${xmlEscape(mediaUrl)}</CurrentURI>
                      <CurrentURIMetaData>${xmlEscape(didl)}</CurrentURIMetaData>
                  """.trimIndent()
                  callSoapAction(controlUrl, AV_TRANSPORT_SERVICE, "SetAVTransportURI", body)
              }

              fun play(controlUrl: String) {
                  val body = "<InstanceID>0</InstanceID><Speed>1</Speed>"
                  callSoapAction(controlUrl, AV_TRANSPORT_SERVICE, "Play", body)
              }

              fun pause(controlUrl: String) {
                  val body = "<InstanceID>0</InstanceID>"
                  callSoapAction(controlUrl, AV_TRANSPORT_SERVICE, "Pause", body)
              }

              fun stop(controlUrl: String) {
                  val body = "<InstanceID>0</InstanceID>"
                  callSoapAction(controlUrl, AV_TRANSPORT_SERVICE, "Stop", body)
              }

              fun seekSeconds(controlUrl: String, targetSeconds: Int) {
                  val clamped = targetSeconds.coerceAtLeast(0)
                  val h = clamped / 3600
                  val m = (clamped % 3600) / 60
                  val s = clamped % 60
                  val targetHms = String.format(Locale.US, "%02d:%02d:%02d", h, m, s)
                  val body = """
                      <InstanceID>0</InstanceID>
                      <Unit>REL_TIME</Unit>
                      <Target>$targetHms</Target>
                  """.trimIndent()
                  callSoapAction(controlUrl, AV_TRANSPORT_SERVICE, "Seek", body)
              }

              fun getTransportInfo(controlUrl: String): DlnaTransportInfo {
                  val xml = callSoapAction(controlUrl, AV_TRANSPORT_SERVICE, "GetTransportInfo", "<InstanceID>0</InstanceID>")
                  val state = extractTagValue(xml, "CurrentTransportState").ifBlank { "STOPPED" }
                  val status = extractTagValue(xml, "CurrentTransportStatus").ifBlank { "OK" }
                  return DlnaTransportInfo(state = state, status = status)
              }

              fun getPositionInfo(controlUrl: String): DlnaPositionInfo {
                  val xml = callSoapAction(controlUrl, AV_TRANSPORT_SERVICE, "GetPositionInfo", "<InstanceID>0</InstanceID>")
                  val relTimeRaw = extractTagValue(xml, "RelTime")
                  val durationRaw = extractTagValue(xml, "TrackDuration")
                  return DlnaPositionInfo(
                      positionSec = parseHmsSafe(relTimeRaw),
                      durationSec = parseHmsSafe(durationRaw)
                  )
              }

              fun getVolume(controlUrl: String): Int {
                  val body = "<InstanceID>0</InstanceID><Channel>Master</Channel>"
                  val xml = callSoapAction(controlUrl, RENDERING_CONTROL_SERVICE, "GetVolume", body)
                  return extractTagValue(xml, "CurrentVolume").toIntOrNull()?.coerceIn(0, 100) ?: 0
              }

              fun setVolume(controlUrl: String, volume: Int) {
                  val clamped = volume.coerceIn(0, 100)
                  val body = "<InstanceID>0</InstanceID><Channel>Master</Channel><DesiredVolume>$clamped</DesiredVolume>"
                  callSoapAction(controlUrl, RENDERING_CONTROL_SERVICE, "SetVolume", body)
              }

              fun getMute(controlUrl: String): Boolean {
                  val body = "<InstanceID>0</InstanceID><Channel>Master</Channel>"
                  val xml = callSoapAction(controlUrl, RENDERING_CONTROL_SERVICE, "GetMute", body)
                  val raw = extractTagValue(xml, "CurrentMute").trim().lowercase(Locale.US)
                  return raw == "1" || raw == "true"
              }

              fun setMute(controlUrl: String, muted: Boolean) {
                  val desired = if (muted) 1 else 0
                  val body = "<InstanceID>0</InstanceID><Channel>Master</Channel><DesiredMute>$desired</DesiredMute>"
                  callSoapAction(controlUrl, RENDERING_CONTROL_SERVICE, "SetMute", body)
              }

              private fun callSoapAction(
                  controlUrl: String,
                  serviceType: String,
                  action: String,
                  innerBodyXml: String
              ): String {
                  val envelope = buildString {
                      append("<?xml version=\"1.0\" encoding=\"utf-8\"?>")
                      append("<s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" ")
                      append("s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">")
                      append("<s:Body>")
                      append("<u:").append(action).append(" xmlns:u=\"").append(serviceType).append("\">")
                      append(innerBodyXml)
                      append("</u:").append(action).append(">")
                      append("</s:Body>")
                      append("</s:Envelope>")
                  }

                  val req = Request.Builder()
                      .url(controlUrl)
                      .header("Content-Type", "text/xml; charset=\"utf-8\"")
                      .header("SOAPACTION", "\"$serviceType#$action\"")
                      .header("Connection", "close")
                      .post(envelope.toRequestBody(SOAP_XML_MEDIA_TYPE))
                      .build()

                  client.newCall(req).execute().use { resp ->
                      val respBody = resp.body?.string().orEmpty()
                      if (!resp.isSuccessful) {
                          val errCode = extractTagValue(respBody, "errorCode")
                          val errDesc = extractTagValue(respBody, "errorDescription")
                          val detail = if (errCode.isNotBlank() || errDesc.isNotBlank()) {
                              "UPnP Error $errCode: $errDesc".trim()
                          } else {
                              "HTTP ${resp.code} ${resp.message}"
                          }
                          throw RuntimeException(detail)
                      }
                      return respBody
                  }
              }

              private fun parseHmsSafe(raw: String?): Int {
                  if (raw.isNullOrBlank()) return 0
                  val trimmed = raw.trim().uppercase(Locale.US)
                  if (trimmed.contains("NOT_") || trimmed.contains("--") || trimmed == "UNKNOWN") {
                      return 0
                  }
                  val withoutFrac = trimmed.substringBefore('.')
                  val parts = withoutFrac.split(':')
                  return try {
                      when (parts.size) {
                          3 -> {
                              val h = parts[0].toInt()
                              val m = parts[1].toInt()
                              val s = parts[2].toInt()
                              (h * 3600 + m * 60 + s).coerceAtLeast(0)
                          }
                          2 -> {
                              val m = parts[0].toInt()
                              val s = parts[1].toInt()
                              (m * 60 + s).coerceAtLeast(0)
                          }
                          else -> 0
                      }
                  } catch (_: Throwable) {
                      0
                  }
              }

              private fun findFirstTagText(root: Element, tagName: String): String? {
                  val list = root.getElementsByTagName(tagName)
                  if (list.length > 0) {
                      val text = list.item(0)?.textContent?.trim()
                      if (!text.isNullOrEmpty()) return text
                  }
                  return null
              }

              private fun extractTagValue(xml: String, tagName: String): String {
                  val regex = Regex("<(?:[a-zA-Z0-9_]+:)?$tagName[^>]*>([\\s\\S]*?)</(?:[a-zA-Z0-9_]+:)?$tagName>", RegexOption.IGNORE_CASE)
                  val match = regex.find(xml)
                  return match?.groupValues?.getOrNull(1)?.trim().orEmpty()
              }

              private fun xmlEscape(value: String): String {
                  val sb = StringBuilder(value.length + 16)
                  for (ch in value) {
                      when (ch) {
                          '&' -> sb.append("&amp;")
                          '<' -> sb.append("&lt;")
                          '>' -> sb.append("&gt;")
                          '"' -> sb.append("&quot;")
                          '\'' -> sb.append("&apos;")
                          else -> sb.append(ch)
                      }
                  }
                  return sb.toString()
              }
          }
