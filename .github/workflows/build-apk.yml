                                      putString("url", sub.optString("url"))
                                      putString("title", sub.optString("title"))
                                      putString("mimeType", sub.optString("mimeType", "text/srt"))
                                      putMap("headers", jsonObjToWritableMap(sub.optJSONObject("headers")))
                                  }
