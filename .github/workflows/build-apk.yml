              fun inspectHlsVodMetadata(
                  remoteUrl: String,
                  headers: Map<String, String>,
                  pinHighestQuality: Boolean = true
              ): HlsVodMetadata {
                  return try {
                      val cleanUrl = remoteUrl.trim()
                      val reqBuilder = buildRequestBuilderWithHeaders(cleanUrl, headers)
                      probeHttpClient.newCall(reqBuilder.get().build()).execute().use { resp ->
                          if (!resp.isSuccessful || resp.body == null) return HlsVodMetadata()
                          val finalUrl = resp.request.url.toString()
                          val body = resp.body!!.string()
                          if (!body.trimStart().startsWith("#EXTM3U")) return HlsVodMetadata()

                          val lines = body.split("\n").map { it.trimEnd('\r') }
                          val isMaster = lines.any { it.trim().startsWith("#EXT-X-STREAM-INF", ignoreCase = true) }
                          if (isMaster) {
                              val variants = parseMasterVariants(lines)
                              if (variants.isEmpty()) return HlsVodMetadata()
                              val chosen = if (pinHighestQuality) {
                                  variants.maxByOrNull { it.bandwidth }!!
                              } else {
                                  variants.first()
                              }
                              val variantUrl = try {
                                  URI.create(finalUrl).resolve(chosen.uriLine).toString()
                              } catch (_: Throwable) {
                                  chosen.uriLine
                              }
                              val varReq = buildRequestBuilderWithHeaders(variantUrl, headers).get().build()
                              probeHttpClient.newCall(varReq).execute().use { varResp ->
                                  if (!varResp.isSuccessful || varResp.body == null) return HlsVodMetadata()
                                  val varBody = varResp.body!!.string()
                                  val varLines = varBody.split("\n").map { it.trimEnd('\r') }
                                  return parseVodEndListAndDuration(varLines)
                              }
                          }
                          parseVodEndListAndDuration(lines)
                      }
                  } catch (_: Throwable) {
                      HlsVodMetadata(isVod = false, durationSec = 0)
                  }
              }

              private fun parseVodEndListAndDuration(lines: List<String>): HlsVodMetadata {
                  var hasEndList = false
                  var totalSecDouble = 0.0
                  for (line in lines) {
                      val trimmed = line.trim()
                      if (trimmed.startsWith("#EXT-X-ENDLIST", ignoreCase = true)) {
                          hasEndList = true
                      } else if (trimmed.startsWith("#EXTINF:", ignoreCase = true)) {
                          val m = EXTINF_DURATION_REGEX.find(trimmed)
                          val sec = m?.groupValues?.getOrNull(1)?.toDoubleOrNull() ?: 0.0
                          if (sec > 0.0) {
                              totalSecDouble += sec
                          }
                      }
                  }
                  val totalSec = totalSecDouble.roundToInt().coerceAtLeast(0)
                  return HlsVodMetadata(isVod = hasEndList && totalSec > 0, durationSec = if (hasEndList) totalSec else 0)
              }

              private fun buildRequestBuilderWithHeaders(cleanUrl: String, headers: Map<String, String>): Request.Builder {
                  val reqBuilder = Request.Builder().url(cleanUrl)
                  var hasUserAgent = false
                  for ((k, v) in headers) {
                      val lower = k.lowercase(Locale.US)
                      if (lower in HOP_BY_HOP_HEADERS || lower == "range" || lower == "content-length") continue
                      if (lower == "user-agent") hasUserAgent = true
                      reqBuilder.header(k, v)
                  }
                  if (!hasUserAgent) {
                      reqBuilder.header("User-Agent", DEFAULT_USER_AGENT)
                  }
                  reqBuilder.header("Accept-Encoding", "identity")
                  return reqBuilder
              }

              fun prepareSubtitlePayload(subtitle: SubtitleSourceSpec?, token: String): String? {
                  if (subtitle == null || subtitle.uriOrUrl.isBlank()) {
                      activeSubtitleBytes = null
                      activeSubtitleLocalUrl = null
                      cachedSubtitleRawKey = ""
                      cachedSubtitleRawBytes = null
                      return null
                  }
                  return try {
                      val rawKey = "${subtitle.isLocal}:${subtitle.uriOrUrl.trim()}"
                      val rawBytes: ByteArray
                      val isVtt: Boolean

                      if (cachedSubtitleRawKey == rawKey && cachedSubtitleRawBytes != null) {
                          rawBytes = cachedSubtitleRawBytes!!
                          isVtt = cachedSubtitleIsVtt
                      } else {
                          rawBytes = if (subtitle.isLocal) {
                              val uri = Uri.parse(subtitle.uriOrUrl.trim())
                              context.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                                  ?: return null
                          } else {
                              val cleanSubUrl = subtitle.uriOrUrl.trim()
                              val req = buildRequestBuilderWithHeaders(cleanSubUrl, subtitle.headers).get().build()
                              probeHttpClient.newCall(req).execute().use { resp ->
                                  if (!resp.isSuccessful || resp.body == null) return null
                                  resp.body!!.bytes()
                              }
                          }
                          val lowerUri = subtitle.uriOrUrl.substringBefore('?').lowercase(Locale.US)
                          val lowerTitle = subtitle.title.lowercase(Locale.US)
                          isVtt = lowerUri.endsWith(".vtt") || lowerTitle.endsWith(".vtt")
                          cachedSubtitleRawKey = rawKey
                          cachedSubtitleRawBytes = rawBytes
                          cachedSubtitleIsVtt = isVtt
                      }

                      val decodedText = decodeSubtitleText(rawBytes)
                      val convertedSrt = convertVttOrNormalizeSrt(decodedText, isVtt, subtitle.offsetSec)
                      val utf8Body = convertedSrt.toByteArray(StandardCharsets.UTF_8)
                      val bom = byteArrayOf(0xEF.toByte(), 0xBB.toByte(), 0xBF.toByte())
                      val withBom = ByteArray(bom.size + utf8Body.size)
                      System.arraycopy(bom, 0, withBom, 0, bom.size)
                      System.arraycopy(utf8Body, 0, withBom, bom.size, utf8Body.size)

                      activeSubtitleBytes = withBom
                      val localSubUrl = "$activeLocalBaseUrl/s/$token/sub.srt"
                      activeSubtitleLocalUrl = localSubUrl
                      localSubUrl
                  } catch (_: Throwable) {
                      activeSubtitleBytes = null
                      activeSubtitleLocalUrl = null
                      null
                  }
              }

              private fun decodeSubtitleText(raw: ByteArray): String {
                  if (raw.isEmpty()) return ""
                  // 1) BOM detection
                  if (raw.size >= 3 && raw[0] == 0xEF.toByte() && raw[1] == 0xBB.toByte() && raw[2] == 0xBF.toByte()) {
                      return String(raw, 3, raw.size - 3, StandardCharsets.UTF_8)
                  }
                  if (raw.size >= 2 && raw[0] == 0xFF.toByte() && raw[1] == 0xFE.toByte()) {
                      return String(raw, 2, raw.size - 2, StandardCharsets.UTF_16LE)
                  }
                  if (raw.size >= 2 && raw[0] == 0xFE.toByte() && raw[1] == 0xFF.toByte()) {
                      return String(raw, 2, raw.size - 2, StandardCharsets.UTF_16BE)
                  }
                  // 2) Strict UTF-8 validation
                  try {
                      val decoder = StandardCharsets.UTF_8.newDecoder()
                          .onMalformedInput(CodingErrorAction.REPORT)
                          .onUnmappableCharacter(CodingErrorAction.REPORT)
                      return decoder.decode(ByteBuffer.wrap(raw)).toString()
                  } catch (_: Throwable) {
                  }
                  // 3) Fallback to Arabic Windows-1256
                  return try {
                      String(raw, Charset.forName("windows-1256"))
                  } catch (_: Throwable) {
                      String(raw, StandardCharsets.UTF_8)
                  }
              }

              private fun decodeHtmlEntities(input: String): String {
                  var out = input
                      .replace("&nbsp;", " ")
                      .replace("&amp;", "&")
                      .replace("&quot;", "\"")
                      .replace("&#39;", "'")
                      .replace("&apos;", "'")
                      .replace("&lt;", "<")
                      .replace("&gt;", ">")
                  if (out.contains("&#")) {
                      out = NUMERIC_HTML_ENTITY_REGEX.replace(out) { m ->
                          val code = m.groupValues[1].toIntOrNull()
                          if (code != null && code in 32..0x10FFFF) {
                              String(Character.toChars(code))
                          } else {
                              m.value
                          }
                      }
                  }
                  return out
              }

              private fun formatSrtMs(totalMs: Long): String {
                  val clamped = totalMs.coerceAtLeast(0L)
                  val h = clamped / 3600000L
                  val m = (clamped % 3600000L) / 60000L
                  val s = (clamped % 60000L) / 1000L
                  val ms = clamped % 1000L
                  return String.format(Locale.US, "%02d:%02d:%02d,%03d", h, m, s, ms)
              }

              private fun toMillis(hStr: String, mStr: String, sStr: String, msStr: String): Long {
                  val h = hStr.toLongOrNull() ?: 0L
                  val m = mStr.toLongOrNull() ?: 0L
                  val s = sStr.toLongOrNull() ?: 0L
                  val msPadded = msStr.padEnd(3, '0').take(3).toLongOrNull() ?: 0L
                  return h * 3600000L + m * 60000L + s * 1000L + msPadded
              }

              private fun convertVttOrNormalizeSrt(rawText: String, isVttHint: Boolean, offsetSec: Int): String {
                  val normalizedInput = rawText.replace("\r\n", "\n").replace('\r', '\n')
                  val lines = normalizedInput.split('\n')
                  val offsetMs = offsetSec.toLong() * 1000L

                  val sb = StringBuilder(normalizedInput.length + 128)
                  var cueIndex = 1
                  var i = 0
                  val isVtt = isVttHint || (lines.firstOrNull()?.trim()?.startsWith("WEBVTT", ignoreCase = true) == true)

                  while (i < lines.size) {
                      val trimmed = lines[i].trim()
                      if (trimmed.isEmpty()) {
                          i++
                          continue
                      }
                      if (isVtt && (trimmed.startsWith("WEBVTT", ignoreCase = true) ||
                              trimmed.startsWith("STYLE", ignoreCase = true) ||
                              trimmed.startsWith("REGION", ignoreCase = true) ||
                              trimmed.startsWith("NOTE", ignoreCase = true))
                      ) {
                          i++
                          while (i < lines.size && lines[i].trim().isNotEmpty()) {
                              i++
                          }
                          continue
                      }

                      val timingMatch = SUBTITLE_TIMING_REGEX.find(trimmed)
                      if (timingMatch != null) {
                          val startH = timingMatch.groupValues[1].ifBlank { "0" }
                          val startM = timingMatch.groupValues[2]
                          val startS = timingMatch.groupValues[3]
                          val startMsRaw = timingMatch.groupValues[4]

                          val endH = timingMatch.groupValues[5].ifBlank { "0" }
                          val endM = timingMatch.groupValues[6]
                          val endS = timingMatch.groupValues[7]
                          val endMsRaw = timingMatch.groupValues[8]

                          var startTotal = (toMillis(startH, startM, startS, startMsRaw) + offsetMs).coerceAtLeast(0L)
                          var endTotal = (toMillis(endH, endM, endS, endMsRaw) + offsetMs).coerceAtLeast(0L)
                          if (endTotal <= startTotal) {
                              endTotal = startTotal + 400L
                          }

                          i++
                          val cueLines = ArrayList<String>()
                          while (i < lines.size && lines[i].trim().isNotEmpty()) {
                              var textLine = lines[i].trimEnd()
                              textLine = VTT_TAG_REGEX.replace(textLine, "")
                              textLine = decodeHtmlEntities(textLine).trim()
                              if (textLine.isNotEmpty()) {
                                  cueLines.add(textLine)
                              }
                              i++
                          }

                          if (cueLines.isNotEmpty()) {
                              sb.append(cueIndex++).append("\r\n")
                              sb.append(formatSrtMs(startTotal)).append(" --> ").append(formatSrtMs(endTotal)).append("\r\n")
                              for (cl in cueLines) {
                                  sb.append(cl).append("\r\n")
                              }
                              sb.append("\r\n")
                          }
                          continue
                      }
                      i++
                  }
                  return sb.toString()
              }

              private fun sanitizeExt(ext: String, mime: String): String {
                  val clean = ext.trim().trimStart('.').lowercase(Locale.US)
                  if (clean in setOf("mp4", "mkv", "ts", "m3u8", "webm", "mov", "avi", "m4v", "mp3", "aac")) {
                      return clean
                  }
                  val lowerMime = mime.lowercase(Locale.US)
                  return when {
                      lowerMime.contains("mpegurl") || lowerMime.contains("m3u") -> "m3u8"
                      lowerMime.contains("matroska") -> "mkv"
                      lowerMime.contains("mp2t") -> "ts"
                      lowerMime.contains("webm") -> "webm"
                      lowerMime.contains("quicktime") -> "mov"
                      else -> "mp4"
                  }
              }

              private fun handleClient(rawSocket: Socket) {
                  rawSocket.use { socket ->
                      try {
                          socket.soTimeout = 30000
                          val input = BufferedInputStream(socket.getInputStream())
                          val output = BufferedOutputStream(socket.getOutputStream())
                          val reader = BufferedReader(InputStreamReader(input, StandardCharsets.US_ASCII))

                          val requestLine = reader.readLine() ?: return
                          val parts = requestLine.trim().split(Regex("\\s+"))
                          if (parts.size < 2) {
                              sendErrorResponse(output, 400, "Bad Request")
                              return
                          }
                          val method = parts[0].uppercase(Locale.US)
                          val rawTarget = parts[1]
                          val reqHeaders = HashMap<String, String>()
                          while (true) {
                              val line = reader.readLine() ?: break
                              if (line.isEmpty()) break
                              val colon = line.indexOf(':')
                              if (colon > 0) {
                                  val key = line.substring(0, colon).trim().lowercase(Locale.US)
                                  val value = line.substring(colon + 1).trim()
                                  reqHeaders[key] = value
                              }
                          }

                          if (method != "GET" && method != "HEAD") {
                              sendErrorResponse(output, 405, "Method Not Allowed")
                              return
                          }
                          val isHead = (method == "HEAD")
                          val pathOnly = rawTarget.substringBefore('?')
                          val segments = pathOnly.trimStart('/').split('/')

                          if (segments.size < 3) {
                              sendErrorResponse(output, 404, "Not Found")
                              return
                          }

                          val prefix = segments[0]
                          val token = segments[1]
                          if (activeToken.isEmpty() || token != activeToken) {
                              sendErrorResponse(output, 403, "Forbidden")
                              return
                          }

                          if (prefix == "s") {
                              val fileSegment = segments[2].lowercase(Locale.US)
                              if (fileSegment == "sub.srt") {
                                  serveLocalSubtitle(isHead, output)
                                  return
                              }
                              if (activeSourceType == "LOCAL") {
                                  val uri = activeLocalUri
                                  if (uri == null) {
                                      sendErrorResponse(output, 404, "No Local Media")
                                      return
                                  }
                                  serveLocalContentUri(uri, activeMimeType, reqHeaders["range"], isHead, output)
                              } else {
                                  val upstream = activeRemoteUrl
                                  if (upstream.isEmpty()) {
                                      sendErrorResponse(output, 404, "No Proxy Media")
                                      return
                                  }
                                  serveProxiedUrl(upstream, pathOnly, reqHeaders["range"], isHead, output)
                              }
                          } else if (prefix == "p" && segments.size >= 3) {
                              val subId = segments[2]
                              val upstream = proxyTargetMap[subId]
                              if (upstream.isNullOrEmpty()) {
                                  sendErrorResponse(output, 404, "Segment Not Found")
                                  return
                              }
                              serveProxiedUrl(upstream, pathOnly, reqHeaders["range"], isHead, output)
                          } else {
                              sendErrorResponse(output, 404, "Not Found")
                          }
                      } catch (_: Throwable) {
                      }
                  }
              }

              private fun serveLocalSubtitle(isHead: Boolean, output: OutputStream) {
                  val subBytes = activeSubtitleBytes
                  if (subBytes == null) {
                      sendErrorResponse(output, 404, "No Active Subtitle")
                      return
                  }
                  val headers = buildString {
                      append("HTTP/1.1 200 OK\r\n")
                      append("Content-Type: text/srt; charset=utf-8\r\n")
                      append("Content-Length: ").append(subBytes.size).append("\r\n")
                      append("transferMode.dlna.org: Streaming\r\n")
                      append("Connection: close\r\n")
                      append("\r\n")
                  }
                  output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                  if (!isHead) {
                      output.write(subBytes)
                  }
                  output.flush()
              }

              private fun serveLocalContentUri(
                  uri: Uri,
                  mimeType: String,
                  rangeHeader: String?,
                  isHead: Boolean,
                  output: OutputStream
              ) {
                  val afd = try {
                      context.contentResolver.openAssetFileDescriptor(uri, "r")
                  } catch (_: Throwable) {
                      null
                  }
                  if (afd == null) {
                      sendErrorResponse(output, 404, "Cannot Open File")
                      return
                  }

                  afd.use { descriptor ->
                      var totalLength = descriptor.length
                      if (totalLength == AssetFileDescriptor.UNKNOWN_LENGTH || totalLength < 0L) {
                          totalLength = queryOpenableSize(uri)
                      }

                      val subHeaderUrl = activeSubtitleLocalUrl
                      if (totalLength <= 0L) {
                          val headers = buildString {
                              append("HTTP/1.1 200 OK\r\n")
                              append("Content-Type: ").append(mimeType).append("\r\n")
                              append("Accept-Ranges: none\r\n")
                              append("transferMode.dlna.org: Streaming\r\n")
                              append("contentFeatures.dlna.org: DLNA.ORG_OP=00;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                              if (!subHeaderUrl.isNullOrBlank()) {
                                  append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                              }
                              append("Connection: close\r\n")
                              append("\r\n")
                          }
                          output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                          output.flush()
                          if (!isHead) {
                              descriptor.createInputStream().use { stream ->
                                  streamAll(stream, output, Long.MAX_VALUE)
                              }
                          }
                          return
                      }

                      val parsedRange = parseByteRange(rangeHeader, totalLength)
                      if (parsedRange == null && !rangeHeader.isNullOrBlank()) {
                          val headers = buildString {
                              append("HTTP/1.1 416 Range Not Satisfiable\r\n")
                              append("Content-Range: bytes */").append(totalLength).append("\r\n")
                              append("Content-Length: 0\r\n")
                              append("Connection: close\r\n")
                              append("\r\n")
                          }
                          output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                          output.flush()
                          return
                      }

                      val isPartial = parsedRange != null
                      val start = parsedRange?.first ?: 0L
                      val end = parsedRange?.second ?: (totalLength - 1L)
                      val contentLen = (end - start + 1L).coerceAtLeast(0L)

                      val headers = buildString {
                          if (isPartial) {
                              append("HTTP/1.1 206 Partial Content\r\n")
                              append("Content-Range: bytes ").append(start).append("-").append(end).append("/").append(totalLength).append("\r\n")
                          } else {
                              append("HTTP/1.1 200 OK\r\n")
                          }
                          append("Content-Type: ").append(mimeType).append("\r\n")
                          append("Content-Length: ").append(contentLen).append("\r\n")
                          append("Accept-Ranges: bytes\r\n")
                          append("transferMode.dlna.org: Streaming\r\n")
                          append("contentFeatures.dlna.org: DLNA.ORG_OP=01;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                          if (!subHeaderUrl.isNullOrBlank()) {
                              append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                          }
                          append("Connection: close\r\n")
                          append("\r\n")
                      }
                      output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                      output.flush()

                      if (!isHead && contentLen > 0L) {
                          descriptor.createInputStream().use { stream ->
                              if (start > 0L) {
                                  skipExact(stream, start)
                              }
                              streamAll(stream, output, contentLen)
                          }
                      }
                  }
              }

              private fun queryOpenableSize(uri: Uri): Long {
                  return try {
                      context.contentResolver.query(uri, arrayOf(OpenableColumns.SIZE), null, null, null)?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val idx = cursor.getColumnIndex(OpenableColumns.SIZE)
                              if (idx >= 0 && !cursor.isNull(idx)) cursor.getLong(idx) else -1L
                          } else {
                              -1L
                          }
                      } ?: -1L
                  } catch (_: Throwable) {
                      -1L
                  }
              }

              private fun buildUpstreamRequestBuilder(cleanUrl: String): Request.Builder {
                  return buildRequestBuilderWithHeaders(cleanUrl, activeHeaders)
              }

              private fun probeHeadViaGetRange(cleanUrl: String): Triple<Int, Map<String, String>, String?>? {
                  return try {
                      val probeReq = buildUpstreamRequestBuilder(cleanUrl)
                          .header("Range", "bytes=0-0")
                          .get()
                          .build()
                      sharedHttpClient.newCall(probeReq).execute().use { resp ->
                          val headersMap = HashMap<String, String>()
                          resp.header("Content-Type")?.let { headersMap["Content-Type"] = it }
                          resp.header("Accept-Ranges")?.let { headersMap["Accept-Ranges"] = it }
                          val cr = resp.header("Content-Range")
                          var totalLen: String? = null
                          if (!cr.isNullOrBlank()) {
                              headersMap["Content-Range"] = cr
                              val match = CONTENT_RANGE_TOTAL_REGEX.find(cr)
                              if (match != null) {
                                  totalLen = match.groupValues[1]
                                  headersMap["Accept-Ranges"] = "bytes"
                              }
                          }
                          if (totalLen == null) {
                              val cl = resp.header("Content-Length")
                              if (!cl.isNullOrBlank() && resp.code == 200) {
                                  totalLen = cl
                              }
                          }
                          if (totalLen != null) {
                              headersMap["Content-Length"] = totalLen
                          }
                          Triple(resp.code, headersMap, resp.request.url.toString())
                      }
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun serveProxiedUrl(
                  targetUrl: String,
                  localPath: String,
                  clientRange: String?,
                  isHead: Boolean,
                  output: OutputStream
              ) {
                  val cleanUrl = targetUrl.trim()
                  val isMainMediaPath = localPath.startsWith("/s/", ignoreCase = true)
                  val subHeaderUrl = if (isMainMediaPath) activeSubtitleLocalUrl else null
                  val looksLikeM3u8Path = localPath.lowercase(Locale.US).endsWith(".m3u8") ||
                      cleanUrl.substringBefore('?').lowercase(Locale.US).endsWith(".m3u8")

                  if (isHead) {
                      val headBuilder = buildUpstreamRequestBuilder(cleanUrl)
                      if (!clientRange.isNullOrBlank() && !looksLikeM3u8Path) {
                          headBuilder.header("Range", clientRange)
                      }
                      headBuilder.head()

                      sharedHttpClient.newCall(headBuilder.build()).execute().use { resp ->
                          val finalUrl = resp.request.url.toString()
                          var statusCode = resp.code
                          var statusReason = resp.message.ifBlank { "OK" }
                          var contentType = resp.header("Content-Type") ?: guessMimeFromUrl(finalUrl, activeMimeType)
                          var respLen = resp.header("Content-Length")
                          var respRange = resp.header("Content-Range")
                          var acceptRanges = resp.header("Accept-Ranges")
                          val isHlsHead = looksLikeM3u8Path ||
                              contentType.lowercase(Locale.US).contains("mpegurl") ||
                              contentType.lowercase(Locale.US).contains("m3u")

                          if ((!resp.isSuccessful || (respLen.isNullOrBlank() && !isHlsHead)) && !isHlsHead) {
                              val probed = probeHeadViaGetRange(cleanUrl)
                              if (probed != null && (probed.first in 200..299)) {
                                  val pm = probed.second
                                  contentType = pm["Content-Type"] ?: contentType
                                  if (!pm["Content-Length"].isNullOrBlank()) {
                                      respLen = pm["Content-Length"]
                                  }
                                  if (!pm["Accept-Ranges"].isNullOrBlank()) {
                                      acceptRanges = pm["Accept-Ranges"]
                                  }
                                  if (clientRange.isNullOrBlank()) {
                                      statusCode = 200
                                      statusReason = "OK"
                                      respRange = null
                                  } else {
                                      statusCode = probed.first
                                      respRange = pm["Content-Range"]
                                  }
                              }
                          }

                          if (statusCode >= 400) {
                              lastUpstreamStatusCode = statusCode
                              lastUpstreamUrl = finalUrl
                          }

                          val dlnaOp = when {
                              isHlsHead && activeIsHlsVod -> "10"
                              isHlsHead -> "00"
                              else -> "01"
                          }
                          val effectiveAcceptRanges = acceptRanges ?: if (!isHlsHead) "bytes" else null
                          val headers = buildString {
                              append("HTTP/1.1 ").append(statusCode).append(" ").append(statusReason).append("\r\n")
                              append("Content-Type: ").append(contentType).append("\r\n")
                              if (!respLen.isNullOrBlank()) {
                                  append("Content-Length: ").append(respLen).append("\r\n")
                              }
                              if (!respRange.isNullOrBlank()) {
                                  append("Content-Range: ").append(respRange).append("\r\n")
                              }
                              if (!effectiveAcceptRanges.isNullOrBlank()) {
                                  append("Accept-Ranges: ").append(effectiveAcceptRanges).append("\r\n")
                              }
                              append("transferMode.dlna.org: Streaming\r\n")
                              append("contentFeatures.dlna.org: DLNA.ORG_OP=").append(dlnaOp).append(";DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                              if (!subHeaderUrl.isNullOrBlank()) {
                                  append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                              }
                              append("Connection: close\r\n")
                              append("\r\n")
                          }
                          output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                          output.flush()
                          return
                      }
                  }

                  val reqBuilder = buildUpstreamRequestBuilder(cleanUrl)
                  if (!clientRange.isNullOrBlank() && !looksLikeM3u8Path) {
                      reqBuilder.header("Range", clientRange)
                  }
                  reqBuilder.get()

                  val call = sharedHttpClient.newCall(reqBuilder.build())
                  call.execute().use { resp ->
                      val finalUrl = resp.request.url.toString()
                      if (resp.code >= 400) {
                          lastUpstreamStatusCode = resp.code
                          lastUpstreamUrl = finalUrl
                      }
                      val contentType = resp.header("Content-Type") ?: guessMimeFromUrl(finalUrl, activeMimeType)
                      val lowerType = contentType.lowercase(Locale.US)
                      val finalPathNoQuery = resp.request.url.encodedPath.lowercase(Locale.US)
                      val isHlsPlaylist = resp.isSuccessful && (
                          lowerType.contains("mpegurl") ||
                              lowerType.contains("m3u") ||
                              finalPathNoQuery.endsWith(".m3u8") ||
                              looksLikeM3u8Path
                          )

                      if (isHlsPlaylist && resp.body != null) {
                          val playlistText = resp.body!!.string()
                          if (playlistText.trimStart().startsWith("#EXTM3U") || finalPathNoQuery.endsWith(".m3u8")) {
                              val rewritten = rewriteM3u8Playlist(playlistText, finalUrl)
                              val bytes = rewritten.toByteArray(StandardCharsets.UTF_8)
                              val hlsOp = if (activeIsHlsVod) "10" else "00"
                              val headers = buildString {
                                  append("HTTP/1.1 200 OK\r\n")
                                  append("Content-Type: application/vnd.apple.mpegurl\r\n")
                                  append("Content-Length: ").append(bytes.size).append("\r\n")
                                  append("Cache-Control: no-cache\r\n")
                                  append("transferMode.dlna.org: Streaming\r\n")
                                  append("contentFeatures.dlna.org: DLNA.ORG_OP=").append(hlsOp).append(";DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                                  if (!subHeaderUrl.isNullOrBlank()) {
                                      append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                                  }
                                  append("Connection: close\r\n")
                                  append("\r\n")
                              }
                              output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                              output.write(bytes)
                              output.flush()
                              return
                          } else {
                              val rawBytes = playlistText.toByteArray(StandardCharsets.UTF_8)
                              val headers = buildString {
                                  append("HTTP/1.1 ").append(resp.code).append(" ").append(resp.message.ifBlank { "OK" }).append("\r\n")
                                  append("Content-Type: ").append(contentType).append("\r\n")
                                  append("Content-Length: ").append(rawBytes.size).append("\r\n")
                                  append("Accept-Ranges: bytes\r\n")
                                  append("transferMode.dlna.org: Streaming\r\n")
                                  append("contentFeatures.dlna.org: DLNA.ORG_OP=01;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                                  if (!subHeaderUrl.isNullOrBlank()) {
                                      append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                                  }
                                  append("Connection: close\r\n")
                                  append("\r\n")
                              }
                              output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                              output.write(rawBytes)
                              output.flush()
                              return
                          }
                      }

                      val respLen = resp.header("Content-Length")
                      val respRange = resp.header("Content-Range")
                      val acceptRanges = resp.header("Accept-Ranges") ?: if (resp.isSuccessful && !looksLikeM3u8Path) "bytes" else null
                      val dlnaOp = when {
                          (looksLikeM3u8Path || lowerType.contains("mpegurl")) && activeIsHlsVod -> "10"
                          looksLikeM3u8Path || lowerType.contains("mpegurl") -> "00"
                          else -> "01"
                      }

                      val headers = buildString {
                          append("HTTP/1.1 ").append(resp.code).append(" ").append(resp.message.ifBlank { "OK" }).append("\r\n")
                          append("Content-Type: ").append(contentType).append("\r\n")
                          if (!respLen.isNullOrBlank()) {
                              append("Content-Length: ").append(respLen).append("\r\n")
                          }
                          if (!respRange.isNullOrBlank()) {
                              append("Content-Range: ").append(respRange).append("\r\n")
                          }
                          if (!acceptRanges.isNullOrBlank()) {
                              append("Accept-Ranges: ").append(acceptRanges).append("\r\n")
                          }
                          append("transferMode.dlna.org: Streaming\r\n")
                          append("contentFeatures.dlna.org: DLNA.ORG_OP=").append(dlnaOp).append(";DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\r\n")
                          if (!subHeaderUrl.isNullOrBlank()) {
                              append("CaptionInfo.sec: ").append(subHeaderUrl).append("\r\n")
                          }
                          append("Connection: close\r\n")
                          append("\r\n")
                      }
                      output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                      output.flush()

                      if (resp.body != null) {
                          resp.body!!.byteStream().use { stream ->
                              streamAll(stream, output, Long.MAX_VALUE)
                          }
                      }
                  }
              }

              private data class HlsVariant(
                  val infLine: String,
                  val uriLine: String,
                  val bandwidth: Long,
                  val audioGroup: String?,
                  val subsGroup: String?
              )

              private fun parseMasterVariants(lines: List<String>): List<HlsVariant> {
                  val variants = ArrayList<HlsVariant>()
                  var i = 0
                  while (i < lines.size) {
                      val line = lines[i]
                      val trimmed = line.trim()
                      if (trimmed.startsWith("#EXT-X-STREAM-INF", ignoreCase = true)) {
                          var uriIdx = i + 1
                          while (uriIdx < lines.size && (lines[uriIdx].trim().isEmpty() || lines[uriIdx].trim().startsWith("#"))) {
                              uriIdx++
                          }
                          if (uriIdx < lines.size) {
                              val bwMatch = BANDWIDTH_REGEX.find(trimmed)
                              val bw = bwMatch?.groupValues?.getOrNull(1)?.toLongOrNull() ?: 0L
                              val audioGrp = AUDIO_GROUP_REGEX.find(trimmed)?.groupValues?.getOrNull(1)
                              val subsGrp = SUBS_GROUP_REGEX.find(trimmed)?.groupValues?.getOrNull(1)
                              variants.add(
                                  HlsVariant(
                                      infLine = line,
                                      uriLine = lines[uriIdx].trim(),
                                      bandwidth = bw,
                                      audioGroup = audioGrp,
                                      subsGroup = subsGrp
                                  )
                              )
                              i = uriIdx + 1
                              continue
                          }
                      }
                      i++
                  }
                  return variants
              }

              private fun rewriteUriAttributes(line: String, baseUri: URI, defaultExt: String): String {
                  if (!line.contains("URI=\"", ignoreCase = true)) return line
                  return URI_ATTR_REGEX.replace(line) { m ->
                      val relUri = m.groupValues[2]
                      val proxied = registerProxySubUrl(baseUri, relUri, defaultExt = defaultExt)
                      "${m.groupValues[1]}$proxied${m.groupValues[3]}"
                  }
              }

              private fun rewriteM3u8Playlist(body: String, finalBaseUrl: String): String {
                  val baseUri = URI.create(finalBaseUrl)
                  val lines = body.split("\n").map { it.trimEnd('\r') }

                  val isMasterPlaylist = lines.any { it.trim().startsWith("#EXT-X-STREAM-INF", ignoreCase = true) }
                  if (isMasterPlaylist && activePinHighestQuality) {
                      val headerLines = ArrayList<String>()
                      val mediaLines = ArrayList<String>()
                      val variants = parseMasterVariants(lines)
                      var i = 0
                      while (i < lines.size) {
                          val line = lines[i]
                          val trimmed = line.trim()
                          if (trimmed.isEmpty()) {
                              i++
                              continue
                          }
                          if (trimmed.startsWith("#EXT-X-STREAM-INF", ignoreCase = true)) {
                              var uriIdx = i + 1
                              while (uriIdx < lines.size && (lines[uriIdx].trim().isEmpty() || lines[uriIdx].trim().startsWith("#"))) {
                                  uriIdx++
                              }
                              i = if (uriIdx < lines.size) uriIdx + 1 else i + 1
                              continue
                          } else if (trimmed.startsWith("#EXT-X-MEDIA", ignoreCase = true)) {
                              mediaLines.add(line)
                          } else if (!trimmed.startsWith("#EXT-X-I-FRAME-STREAM-INF", ignoreCase = true)) {
                              headerLines.add(line)
                          }
                          i++
                      }

                      if (variants.isNotEmpty()) {
                          val best = variants.maxByOrNull { it.bandwidth }!!
                          val sb = StringBuilder(512)
                          for (hl in headerLines) {
                              sb.append(rewriteUriAttributes(hl, baseUri, defaultExt = "m3u8")).append('\n')
                          }
                          for (ml in mediaLines) {
                              val grp = MEDIA_GROUP_REGEX.find(ml)?.groupValues?.getOrNull(1)
                              val matchesAudio = best.audioGroup != null && grp == best.audioGroup
                              val matchesSubs = best.subsGroup != null && grp == best.subsGroup
                              if (grp == null || matchesAudio || matchesSubs) {
                                  sb.append(rewriteUriAttributes(ml, baseUri, defaultExt = "m3u8")).append('\n')
                              }
                          }
                          sb.append(best.infLine).append('\n')
                          val proxiedVariant = registerProxySubUrl(baseUri, best.uriLine, defaultExt = "m3u8")
                          sb.append(proxiedVariant).append('\n')
                          return sb.toString()
                      }
                  }

                  val sb = StringBuilder(body.length + 512)
                  for (rawLine in lines) {
                      val trimmed = rawLine.trim()
                      if (trimmed.isEmpty()) {
                          sb.append('\n')
                          continue
                      }
                      if (trimmed.startsWith("#")) {
                          val defaultAttrExt = if (trimmed.contains("KEY", ignoreCase = true)) "key" else "m3u8"
                          sb.append(rewriteUriAttributes(rawLine, baseUri, defaultExt = defaultAttrExt)).append('\n')
                      } else {
                          val guessedPartExt = if (trimmed.substringBefore('?').lowercase(Locale.US).endsWith(".m3u8")) "m3u8" else "ts"
                          val proxied = registerProxySubUrl(baseUri, trimmed, defaultExt = guessedPartExt)
                          sb.append(proxied).append('\n')
                      }
                  }
                  return sb.toString()
              }

              private fun registerProxySubUrl(baseUri: URI, relativeOrAbsolute: String, defaultExt: String): String {
                  val resolved = try {
                      baseUri.resolve(relativeOrAbsolute).toString()
                  } catch (_: Throwable) {
                      relativeOrAbsolute
                  }
                  val subId = subIdCounter.getAndIncrement().toString()
                  proxyTargetMap[subId] = resolved
                  val cleanPath = resolved.substringBefore('?').substringBefore('#')
                  val rawName = cleanPath.substringAfterLast('/', "seg.$defaultExt").ifBlank { "seg.$defaultExt" }
                  val ext = rawName.substringAfterLast('.', defaultExt).lowercase(Locale.US)
                  val safeExt = if (ext.length in 2..5 && ext.all { it.isLetterOrDigit() }) ext else defaultExt
                  return "$activeLocalBaseUrl/p/$activeToken/$subId/part.$safeExt"
              }

              private fun guessMimeFromUrl(url: String, fallback: String): String {
                  val lower = url.substringBefore('?').lowercase(Locale.US)
                  return when {
                      lower.endsWith(".m3u8") -> "application/vnd.apple.mpegurl"
                      lower.endsWith(".mp4") || lower.endsWith(".m4v") -> "video/mp4"
                      lower.endsWith(".mkv") -> "video/x-matroska"
                      lower.endsWith(".ts") -> "video/mp2t"
                      lower.endsWith(".webm") -> "video/webm"
                      lower.endsWith(".mov") -> "video/quicktime"
                      lower.endsWith(".avi") -> "video/x-msvideo"
                      else -> fallback.ifBlank { "video/mp4" }
                  }
              }

              private fun parseByteRange(rangeHeader: String?, totalLength: Long): Pair<Long, Long>? {
                  if (rangeHeader.isNullOrBlank()) return null
                  val trimmed = rangeHeader.trim()
                  if (!trimmed.startsWith("bytes=", ignoreCase = true)) return null
                  val spec = trimmed.substring(6).substringBefore(',').trim()
                  val dash = spec.indexOf('-')
                  if (dash < 0) return null
                  val startStr = spec.substring(0, dash).trim()
                  val endStr = spec.substring(dash + 1).trim()
                  return try {
                      if (startStr.isEmpty()) {
                          val suffix = endStr.toLong()
                          if (suffix <= 0L) return null
                          val start = (totalLength - suffix).coerceAtLeast(0L)
                          Pair(start, totalLength - 1L)
                      } else {
                          val start = startStr.toLong()
                          val end = if (endStr.isEmpty()) totalLength - 1L else endStr.toLong().coerceAtMost(totalLength - 1L)
                          if (start < 0L || start >= totalLength || end < start) null else Pair(start, end)
                      }
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun skipExact(input: InputStream, bytesToSkip: Long) {
                  var remaining = bytesToSkip
                  val skipBuf = ByteArray(16384)
                  while (remaining > 0L) {
                      val skipped = input.skip(remaining)
                      if (skipped > 0L) {
                          remaining -= skipped
                      } else {
                          val n = input.read(skipBuf, 0, minOf(skipBuf.size.toLong(), remaining).toInt())
                          if (n < 0) break
                          remaining -= n.toLong()
                      }
                  }
              }

              private fun streamAll(input: InputStream, output: OutputStream, maxBytes: Long) {
                  val buffer = ByteArray(BUFFER_SIZE)
                  var remaining = maxBytes
                  while (remaining > 0L) {
                      val toRead = if (remaining < buffer.size.toLong()) remaining.toInt() else buffer.size
                      val read = input.read(buffer, 0, toRead)
                      if (read <= 0) break
                      output.write(buffer, 0, read)
                      if (remaining != Long.MAX_VALUE) {
                          remaining -= read.toLong()
                      }
                  }
                  output.flush()
              }

              private fun sendErrorResponse(output: OutputStream, code: Int, reason: String) {
                  val bodyBytes = "$code $reason".toByteArray(StandardCharsets.UTF_8)
                  val headers = buildString {
                      append("HTTP/1.1 ").append(code).append(" ").append(reason).append("\r\n")
                      append("Content-Type: text/plain; charset=utf-8\r\n")
                      append("Content-Length: ").append(bodyBytes.size).append("\r\n")
                      append("Connection: close\r\n")
                      append("\r\n")
                  }
                  output.write(headers.toByteArray(StandardCharsets.US_ASCII))
                  output.write(bodyBytes)
                  output.flush()
              }
          }
