                          .connectionPool(ConnectionPool(16, 5, TimeUnit.MINUTES))
                          .cookieJar(sessionCookieJar)
                          .retryOnConnectionFailure(true)
                          .connectTimeout(15, TimeUnit.SECONDS)
                          .readTimeout(0, TimeUnit.SECONDS)
                          .followRedirects(true)
