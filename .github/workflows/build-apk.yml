          import com.facebook.react.bridge.ReactContextBaseJavaModule
          import com.facebook.react.bridge.ReactMethod
          import com.facebook.react.bridge.ReadableMap
          import com.facebook.react.bridge.WritableMap
          import com.facebook.react.modules.core.DeviceEventManagerModule
          import java.util.Locale
          import java.util.concurrent.Executors

          class DlnaCastModule(reactContext: ReactApplicationContext) :
              ReactContextBaseJavaModule(reactContext), ActivityEventListener {

              companion object {
                  private const val PICK_VIDEO_REQUEST_CODE = 44019
                  private const val EVENT_STATE = "DlnaPlaybackState"
                  private const val EVENT_INTENT = "DlnaCastIntentReceived"
                  private val URL_EXTRACT_REGEX = Regex("https?://\\S+", RegexOption.IGNORE_CASE)

                  @Volatile
                  private var pendingIntentData: WritableMap? = null

                  fun storeInitialIntent(intent: Intent?) {
                      val parsed = parseCastIntentToMap(intent)
                      if (parsed != null) {
                          pendingIntentData = parsed
                      }
                  }

                  fun handleNewIntent(activity: Activity, intent: Intent?) {
                      val parsed = parseCastIntentToMap(intent) ?: return
                      pendingIntentData = parsed
                      try {
                          val reactApp = activity.application as? com.facebook.react.ReactApplication
                          val rnCtx = reactApp?.reactNativeHost?.reactInstanceManager?.currentReactContext
                          if (rnCtx != null && rnCtx.hasActiveReactInstance()) {
                              pendingIntentData = null
                              rnCtx
                                  .getJSModule(DeviceEventManagerModule.RCTDeviceEventEmitter::class.java)
                                  .emit(EVENT_INTENT, parsed)
                          }
                      } catch (_: Throwable) {
                      }
                  }

                  fun parseCastIntentToMap(intent: Intent?): WritableMap? {
                      if (intent == null) return null
                      val action = intent.action ?: return null
                      var targetUrl = ""
                      var isLocalContent = false
                      var title = intent.getStringExtra(Intent.EXTRA_SUBJECT)
                          ?: intent.getStringExtra("title")
                          ?: ""

                      when (action) {
                          Intent.ACTION_VIEW -> {
                              val dataUri = intent.data
                              val str = intent.dataString ?: dataUri?.toString().orEmpty()
                              if (str.isBlank()) return null
                              val scheme = dataUri?.scheme?.lowercase(Locale.US) ?: ""
                              isLocalContent = scheme == "content" || scheme == "file"
                              targetUrl = str
                          }
                          Intent.ACTION_SEND -> {
                              val streamUri: Uri? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                              } else {
                                  @Suppress("DEPRECATION")
                                  intent.getParcelableExtra(Intent.EXTRA_STREAM)
                              }
                              if (streamUri != null) {
                                  targetUrl = streamUri.toString()
                                  isLocalContent = true
                              } else {
                                  val sharedText = intent.getStringExtra(Intent.EXTRA_TEXT).orEmpty()
                                  val match = URL_EXTRACT_REGEX.find(sharedText)
                                  if (match != null) {
                                      targetUrl = match.value.trimEnd('.', ',', ')', ']', '"', '\'')
                                      if (title.isBlank()) {
                                          title = sharedText.replace(match.value, "").trim()
                                      }
                                  }
                              }
                          }
                          else -> return null
                      }

                      if (targetUrl.isBlank()) return null

                      val headersMap = Arguments.createMap()
                      extractHeadersFromExtras(intent.extras, headersMap)

                      val result = Arguments.createMap()
                      result.putString("url", targetUrl)
                      result.putBoolean("isLocalUri", isLocalContent)
                      result.putString("title", title)
                      result.putString("mimeType", intent.type ?: "")
                      result.putMap("headers", headersMap)
                      return result
                  }

                  private fun extractHeadersFromExtras(extras: Bundle?, outMap: WritableMap) {
                      if (extras == null) return

                      fun putHeaderNormalized(rawKey: String?, rawValue: Any?) {
                          val k = rawKey?.trim().orEmpty()
                          val v = rawValue?.toString()?.trim().orEmpty()
                          if (k.isBlank() || v.isBlank()) return
                          val canonicalKey = when (k.lowercase(Locale.US)) {
                              "referer", "referrer" -> "Referer"
                              "user-agent" -> "User-Agent"
                              "cookie" -> "Cookie"
                              "origin" -> "Origin"
                              "authorization" -> "Authorization"
                              else -> k
                          }
                          outMap.putString(canonicalKey, v)
                      }

                      // 1) البحث عن المفتاحين headers أو HTTP_HEADERS بكافة الصيغ (String[], ArrayList, Bundle, HashMap)
                      for (extraKey in extras.keySet()) {
                          val lowerKey = extraKey.lowercase(Locale.US)
                          @Suppress("DEPRECATION")
                          val extraVal = extras.get(extraKey)
                          if (lowerKey == "headers" || lowerKey == "android.media.intent.extra.http_headers") {
                              when (extraVal) {
                                  is Array<*> -> {
                                      val list = extraVal.mapNotNull { it?.toString() }
                                      var idx = 0
                                      while (idx + 1 < list.size) {
                                          putHeaderNormalized(list[idx], list[idx + 1])
                                          idx += 2
                                      }
                                  }
                                  is List<*> -> {
                                      val list = extraVal.mapNotNull { it?.toString() }
                                      var idx = 0
                                      while (idx + 1 < list.size) {
                                          putHeaderNormalized(list[idx], list[idx + 1])
                                          idx += 2
                                      }
                                  }
                                  is Bundle -> {
                                      for (subKey in extraVal.keySet()) {
                                          @Suppress("DEPRECATION")
                                          putHeaderNormalized(subKey, extraVal.get(subKey))
                                      }
                                  }
                                  is Map<*, *> -> {
                                      for ((mk, mv) in extraVal) {
                                          putHeaderNormalized(mk?.toString(), mv)
                                      }
                                  }
                              }
                          } else if (lowerKey in setOf("referer", "referrer", "user-agent", "cookie", "origin", "authorization")) {
                              // 3) المفاتيح الفردية بدون حساسية لحالة الأحرف
                              putHeaderNormalized(extraKey, extraVal)
                          }
                      }
                  }
              }

              private val bgExecutor = Executors.newCachedThreadPool()

              @Volatile
              private var pickPromise: Promise? = null

              init {
                  DlnaCastCoordinator.init(reactContext)
                  reactContext.addActivityEventListener(this)
                  DlnaCastCoordinator.setStateListener { snap ->
                      emitEvent(EVENT_STATE, snap.toWritableMap())
                  }
              }

              override fun getName(): String = "DlnaCastModule"

              private fun emitEvent(name: String, params: WritableMap) {
                  try {
                      if (reactApplicationContext.hasActiveReactInstance()) {
                          reactApplicationContext
                              .getJSModule(DeviceEventManagerModule.RCTDeviceEventEmitter::class.java)
                              .emit(name, params)
                      }
                  } catch (_: Throwable) {
                  }
              }

              @ReactMethod
              fun addListener(eventName: String) {
                  // مطلوب لـ NativeEventEmitter
              }

              @ReactMethod
              fun removeListeners(count: Int) {
                  // مطلوب لـ NativeEventEmitter
              }

              @ReactMethod
              fun getInitialIntent(promise: Promise) {
                  val item = pendingIntentData
                  pendingIntentData = null
                  promise.resolve(item)
              }

              @ReactMethod
              fun getPlaybackState(promise: Promise) {
                  promise.resolve(DlnaCastCoordinator.getCurrentSnapshot().toWritableMap())
              }

              @ReactMethod
              fun discoverRenderers(priorityIp: String?, promise: Promise) {
                  bgExecutor.execute {
                      try {
                          val list = DlnaCastCoordinator.discoverRenderers(priorityIp)
                          val arr = Arguments.createArray()
                          for (d in list) {
                              val m = Arguments.createMap()
                              m.putString("udn", d.udn)
                              m.putString("name", d.name)
                              m.putString("manufacturer", d.manufacturer)
                              m.putString("modelName", d.modelName)
                              m.putString("ip", d.ip)
                              m.putInt("port", d.port)
                              m.putString("location", d.location)
                              m.putString("avTransportControlUrl", d.avTransportControlUrl)
                              m.putString("renderingControlUrl", d.renderingControlUrl)
                              arr.pushMap(m)
                          }
                          promise.resolve(arr)
                      } catch (e: Throwable) {
                          promise.reject("DLNA_DISCOVERY_ERROR", e.message ?: "Failed SSDP discovery", e)
                      }
                  }
              }

              @ReactMethod
              fun pickLocalVideo(promise: Promise) {
                  val activity = currentActivity
                  if (activity == null) {
                      promise.reject("NO_ACTIVITY", "لا توجد نافذة نشطة لفتح مستعرض الملفات")
                      return
                  }
                  pickPromise?.reject("PICK_CANCELLED", "تم استبدال طلب الاختيار")
                  pickPromise = promise
                  try {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "video/*"
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                      }
                      activity.startActivityForResult(intent, PICK_VIDEO_REQUEST_CODE)
                  } catch (e: Throwable) {
                      pickPromise = null
                      promise.reject("PICK_ERROR", e.message ?: "تعذر فتح منتقي الفيديو", e)
                  }
              }

              override fun onActivityResult(activity: Activity, requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode != PICK_VIDEO_REQUEST_CODE) return
                  val promise = pickPromise ?: return
                  pickPromise = null

                  if (resultCode != Activity.RESULT_OK || data?.data == null) {
                      promise.reject("PICK_CANCELLED", "لم يتم اختيار أي ملف فيديو")
                      return
                  }

                  val uri = data.data!!
                  try {
                      val takeFlags = data.flags and Intent.FLAG_GRANT_READ_URI_PERMISSION
                      if (takeFlags != 0) {
                          reactApplicationContext.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                  } catch (_: Throwable) {
                  }

                  var displayName = "video.mp4"
                  var sizeBytes = -1L
                  try {
                      reactApplicationContext.contentResolver.query(
                          uri,
                          arrayOf(OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE),
                          null,
                          null,
                          null
                      )?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val nameIdx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (nameIdx >= 0 && !cursor.isNull(nameIdx)) {
                                  displayName = cursor.getString(nameIdx) ?: displayName
                              }
                              val sizeIdx = cursor.getColumnIndex(OpenableColumns.SIZE)
                              if (sizeIdx >= 0 && !cursor.isNull(sizeIdx)) {
                                  sizeBytes = cursor.getLong(sizeIdx)
                              }
                          }
                      }
                  } catch (_: Throwable) {
                  }

                  val mime = reactApplicationContext.contentResolver.getType(uri) ?: "video/mp4"
                  val result = Arguments.createMap()
                  result.putString("uri", uri.toString())
                  result.putString("name", displayName)
                  result.putDouble("sizeBytes", sizeBytes.toDouble())
                  result.putString("mimeType", mime)
                  promise.resolve(result)
              }

              override fun onNewIntent(intent: Intent) {
                  val parsed = parseCastIntentToMap(intent) ?: return
                  emitEvent(EVENT_INTENT, parsed)
              }

              @ReactMethod
              fun castLocalFile(deviceMap: ReadableMap, contentUri: String, title: String?, mimeType: String?, promise: Promise) {
                  bgExecutor.execute {
                      try {
                          val device = parseDeviceMap(deviceMap)
                          val uri = Uri.parse(contentUri)
                          val resolvedMime = mimeType?.takeIf { it.isNotBlank() }
                              ?: reactApplicationContext.contentResolver.getType(uri)
                              ?: "video/mp4"
                          val cleanTitle = title?.takeIf { it.isNotBlank() } ?: "Local Video"
                          val ext = cleanTitle.substringAfterLast('.', "")
                          DlnaCastCoordinator.castLocalUri(device, uri, cleanTitle, resolvedMime, ext)
                          promise.resolve(DlnaCastCoordinator.getCurrentSnapshot().toWritableMap())
                      } catch (e: Throwable) {
                          promise.reject("DLNA_CAST_LOCAL_ERROR", e.message ?: "فشل بث الملف المحلي", e)
                      }
                  }
              }

              @ReactMethod
              fun castRemoteUrl(
                  deviceMap: ReadableMap,
                  url: String,
                  title: String?,
                  useProxy: Boolean,
                  pinHighestQuality: Boolean,
                  headersMap: ReadableMap?,
                  promise: Promise
              ) {
                  bgExecutor.execute {
                      try {
                          val device = parseDeviceMap(deviceMap)
                          val cleanUrl = url.trim()
                          val headers = HashMap<String, String>()
                          if (headersMap != null) {
                              val iter = headersMap.keySetIterator()
                              while (iter.hasNextKey()) {
                                  val k = iter.nextKey()
                                  val v = headersMap.getString(k)
                                  if (!v.isNullOrBlank()) {
                                      headers[k] = v
                                  }
                              }
                          }
                          val lowerPath = cleanUrl.substringBefore('?').lowercase(Locale.US)
                          val guessedMime = when {
                              lowerPath.endsWith(".m3u8") -> "application/vnd.apple.mpegurl"
                              lowerPath.endsWith(".mkv") -> "video/x-matroska"
                              lowerPath.endsWith(".ts") -> "video/mp2t"
                              lowerPath.endsWith(".webm") -> "video/webm"
                              lowerPath.endsWith(".mov") -> "video/quicktime"
                              else -> "video/mp4"
                          }
                          val ext = lowerPath.substringAfterLast('/', "").substringAfterLast('.', "")
                          val cleanTitle = title?.takeIf { it.isNotBlank() } ?: "Stream Video"
                          DlnaCastCoordinator.castRemoteUrl(
                              device,
                              cleanUrl,
                              cleanTitle,
                              guessedMime,
                              ext,
                              useProxy,
                              pinHighestQuality,
                              headers
                          )
                          promise.resolve(DlnaCastCoordinator.getCurrentSnapshot().toWritableMap())
                      } catch (e: Throwable) {
                          promise.reject("DLNA_CAST_REMOTE_ERROR", e.message ?: "فشل بث الرابط إلى الشاشة", e)
                      }
                  }
              }

              @ReactMethod
              fun play(promise: Promise) {
                  DlnaCastCoordinator.play()
                  promise.resolve(true)
              }

              @ReactMethod
              fun pause(promise: Promise) {
                  DlnaCastCoordinator.pause()
                  promise.resolve(true)
              }

              @ReactMethod
              fun stop(promise: Promise) {
                  DlnaCastCoordinator.stopCast()
                  promise.resolve(true)
              }

              @ReactMethod
              fun seek(seconds: Int, promise: Promise) {
                  DlnaCastCoordinator.seekSeconds(seconds)
                  promise.resolve(true)
              }

              @ReactMethod
              fun setVolume(volume: Int, promise: Promise) {
                  DlnaCastCoordinator.setVolume(volume)
                  promise.resolve(true)
              }

              @ReactMethod
              fun setMute(muted: Boolean, promise: Promise) {
                  DlnaCastCoordinator.setMute(muted)
                  promise.resolve(true)
              }

              private fun parseDeviceMap(m: ReadableMap): DlnaRendererDevice {
                  val ip = m.getString("ip").orEmpty().trim()
                  val port = if (m.hasKey("port")) m.getInt("port") else 9197
                  val avUrl = m.getString("avTransportControlUrl")?.takeIf { it.isNotBlank() }
                      ?: "http://$ip:$port/upnp/control/AVTransport1"
                  val rcUrl = m.getString("renderingControlUrl")?.takeIf { it.isNotBlank() }
                      ?: "http://$ip:$port/upnp/control/RenderingControl1"
                  return DlnaRendererDevice(
                      udn = m.getString("udn").orEmpty(),
                      name = m.getString("name") ?: "Smart TV",
                      manufacturer = m.getString("manufacturer").orEmpty(),
                      modelName = m.getString("modelName").orEmpty(),
                      ip = ip,
                      port = port,
                      location = m.getString("location").orEmpty(),
                      avTransportControlUrl = avUrl,
                      renderingControlUrl = rcUrl
                  )
              }

              override fun onCatalystInstanceDestroy() {
                  reactApplicationContext.removeActivityEventListener(this)
                  DlnaCastCoordinator.setStateListener(null)
                  bgExecutor.shutdownNow()
                  super.onCatalystInstanceDestroy()
              }
          }
          EOF

          cat << 'EOF' > universalremote/android/app/src/main/java/com/universalremote/IrManagerPackage.kt
          package com.universalremote

          import android.view.View
          import com.facebook.react.ReactPackage
          import com.facebook.react.bridge.NativeModule
          import com.facebook.react.bridge.ReactApplicationContext
          import com.facebook.react.uimanager.ReactShadowNode
          import com.facebook.react.uimanager.ViewManager

          class IrManagerPackage : ReactPackage {
              override fun createViewManagers(reactContext: ReactApplicationContext): MutableList<ViewManager<View, ReactShadowNode<*>>> = mutableListOf()
              override fun createNativeModules(reactContext: ReactApplicationContext): MutableList<NativeModule> =
                  listOf(
                      IrManagerModule(reactContext),
                      HapticsModule(reactContext),
                      DlnaCastModule(reactContext)
                  ).toMutableList()
          }
          EOF
          
          cat << 'EOF' > universalremote/android/app/src/main/java/com/universalremote/LanTlsOkHttpFactory.kt
          package com.universalremote

          import com.facebook.react.modules.network.CustomClientBuilder
          import com.facebook.react.modules.network.OkHttpClientFactory
          import com.facebook.react.modules.network.OkHttpClientProvider
          import okhttp3.OkHttpClient
          import java.net.InetAddress
          import java.security.KeyStore
          import java.security.SecureRandom
          import java.security.cert.CertificateException
          import java.security.cert.X509Certificate
          import java.util.concurrent.TimeUnit
          import javax.net.ssl.HostnameVerifier
          import javax.net.ssl.HttpsURLConnection
          import javax.net.ssl.SSLContext
          import javax.net.ssl.TrustManagerFactory
          import javax.net.ssl.X509TrustManager

          class LanTlsOkHttpFactory : OkHttpClientFactory, CustomClientBuilder {
              override fun createNewNetworkModuleClient(): OkHttpClient {
                  val builder = OkHttpClientProvider.createClientBuilder()
                  apply(builder)
                  return builder.build()
              }

              override fun apply(builder: OkHttpClient.Builder) {
                  try {
                      val tmf = TrustManagerFactory.getInstance(TrustManagerFactory.getDefaultAlgorithm())
                      tmf.init(null as KeyStore?)
                      val defaultTm = tmf.trustManagers.filterIsInstance<X509TrustManager>().firstOrNull()
                          ?: return

                      val lanTrustManager = object : X509TrustManager {
                          override fun checkClientTrusted(chain: Array<out X509Certificate>?, authType: String?) {
                              defaultTm.checkClientTrusted(chain, authType)
                          }

                          override fun checkServerTrusted(chain: Array<out X509Certificate>?, authType: String?) {
                              try {
                                  defaultTm.checkServerTrusted(chain, authType)
                              } catch (ex: CertificateException) {
                                  // السماح بشهادة SSL الموقعة ذاتياً لشاشات الشبكة المحلية (Samsung Tizen 8002)
                                  if (chain == null || chain.size > 2) {
                                      throw ex
                                  }
                              }
                          }

                          override fun getAcceptedIssuers(): Array<X509Certificate> = defaultTm.acceptedIssuers
                      }

                      val sslContext = SSLContext.getInstance("TLS")
                      sslContext.init(null, arrayOf(lanTrustManager), SecureRandom())
                      builder.sslSocketFactory(sslContext.socketFactory, lanTrustManager)
                      builder.hostnameVerifier(HostnameVerifier { hostname, session ->
                          if (HttpsURLConnection.getDefaultHostnameVerifier().verify(hostname, session)) {
                              return@HostnameVerifier true
                          }
                          val isIpv4Literal = hostname.matches(Regex("^\\d{1,3}(\\.\\d{1,3}){3}$"))
                          if (!isIpv4Literal) {
                              return@HostnameVerifier false
                          }
                          try {
                              val addr = InetAddress.getByName(hostname)
                              addr.isSiteLocalAddress || addr.isLoopbackAddress
                          } catch (_: Exception) {
                              false
                          }
                      })
                      builder.connectTimeout(10, TimeUnit.SECONDS)
                  } catch (_: Exception) {
                  }
              }
          }
          EOF

