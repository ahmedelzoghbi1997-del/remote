                          } else ""
                          val enginePart = if (upstreamEngine.isNotBlank()) " [$upstreamEngine]" else ""
                          val hintPart = if (serverHint.isNotBlank()) " [$serverHint]" else ""
                          "$baseMsg (فشل المصدر$hostPart$stagePart$enginePart برمز HTTP $upstreamCode$hintPart)"
