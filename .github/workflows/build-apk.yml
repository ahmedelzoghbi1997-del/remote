              @SuppressLint("SetJavaScriptEnabled", "AddJavascriptInterface")
              private fun configureWebView() {
                  val settings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.allowFileAccess = true
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true
                  settings.builtInZoomControls = true
                  settings.displayZoomControls = false
                  settings.mediaPlaybackRequiresUserGesture = false
                  settings.allowContentAccess = true
                  settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  settings.javaScriptCanOpenWindowsAutomatically = true
                  settings.setSupportMultipleWindows(true)

                  // تنظيف User-Agent ليطابق Chrome Mobile القياسي (إزالة '; wv' و 'Version/X.X') لتجاوز حجب Cloudflare
                  defaultCleanMobileUa = cleanWebViewUserAgent(settings.userAgentString.orEmpty())
                  if (defaultCleanMobileUa.isNotBlank()) {
                      settings.userAgentString = defaultCleanMobileUa
                  }
                  currentUserAgent = settings.userAgentString.orEmpty()

                  val cm = CookieManager.getInstance()
                  cm.setAcceptCookie(true)
                  cm.setAcceptThirdPartyCookies(webView, true)

                  webView.addJavascriptInterface(SnifferJsBridge(), "AndroidSnifferBridge")

                  // التقاط روابط التحميل المباشرة (مثل أزرار تحميل MP4/MKV في مواقع الأفلام)
                  webView.setDownloadListener { url, userAgent, contentDisposition, mimetype, contentLength ->
                      val cleanUrl = url?.trim().orEmpty()
                      if (!cleanUrl.startsWith("http", ignoreCase = true)) return@setDownloadListener
                      val cleanPath = cleanUrl.substringBefore('?').substringBefore('#').lowercase(Locale.US)
                      val dispLower = contentDisposition?.lowercase(Locale.US).orEmpty()
                      val mimeLower = mimetype?.lowercase(Locale.US).orEmpty()
                      val nonVideoArchive = cleanPath.endsWith(".apk") || cleanPath.endsWith(".zip") ||
                          cleanPath.endsWith(".rar") || cleanPath.endsWith(".pdf") || cleanPath.endsWith(".exe")

                      val isVideoDownload = !nonVideoArchive && (
                          cleanPath.endsWith(".mp4") ||
                          cleanPath.endsWith(".mkv") ||
                          cleanPath.endsWith(".webm") ||
                          cleanPath.endsWith(".mov") ||
                          cleanPath.endsWith(".m3u8") ||
                          cleanPath.endsWith(".ts") ||
                          mimeLower.startsWith("video/") ||
                          mimeLower.contains("mpegurl") ||
                          mimeLower.contains("matroska") ||
                          dispLower.contains(".mp4") ||
                          dispLower.contains(".mkv") ||
                          dispLower.contains(".webm") ||
                          contentLength > 5L * 1024L * 1024L
                      )

                      if (!isVideoDownload) return@setDownloadListener
                      if (shouldSkipNoiseSegment(cleanUrl, cleanPath)) return@setDownloadListener

                      val headers = buildCapturedHeaders(
                          cleanUrl,
                          emptyMap(),
                          currentPageUrl,
                          userAgent?.takeIf { it.isNotBlank() } ?: currentUserAgent
                      )
                      val fileLabel = DISPOSITION_FILENAME_REGEX.find(contentDisposition.orEmpty())
                          ?.groupValues?.getOrNull(1)?.trim().orEmpty()
                      val resolvedMime = when {
                          mimeLower.startsWith("video/") || mimeLower.contains("mpegurl") -> mimeLower.substringBefore(';')
                          dispLower.contains(".mkv") -> "video/x-matroska"
                          dispLower.contains(".webm") -> "video/webm"
                          else -> guessMime(cleanPath, "VIDEO")
                      }
                      val score = if (resolvedMime.contains("mpegurl", ignoreCase = true)) 100 else 95

                      addCapturedItem(
                          SniffedMediaItem(
                              url = cleanUrl,
                              kind = "VIDEO",
                              mimeType = resolvedMime,
                              label = fileLabel,
                              headers = headers,
                              priorityScore = score,
                              contentLengthBytes = contentLength
                          )
                      )
                      Toast.makeText(
                          this@MediaSnifferActivity,
                          "تم التقاط رابط تحميل الفيلم! افتح المقاطع الملتقطة للبث",
                          Toast.LENGTH_LONG
                      ).show()
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowCustomView(view: View?, callback: CustomViewCallback?) {
                          if (view == null) {
                              callback?.onCustomViewHidden()
                              return
                          }
                          if (customVideoView != null) {
                              callback?.onCustomViewHidden()
                              return
                          }
                          customVideoView = view
                          customViewCallback = callback
                          fullscreenContainer.removeAllViews()
                          fullscreenContainer.addView(
                              view,
                              FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          )
                          fullscreenContainer.visibility = View.VISIBLE
                      }

                      override fun onHideCustomView() {
                          hideCustomVideoView()
                      }

                      override fun onPermissionRequest(request: PermissionRequest?) {
                          if (request == null) return
                          val protectedMedia = request.resources
                              ?.filter { it == PermissionRequest.RESOURCE_PROTECTED_MEDIA_ID }
                              ?.toTypedArray()
                              ?: emptyArray()
                          if (protectedMedia.isNotEmpty()) {
                              request.grant(protectedMedia)
                          } else {
                              request.deny()
                          }
                      }

                      override fun onConsoleMessage(consoleMessage: ConsoleMessage?): Boolean {
                          return super.onConsoleMessage(consoleMessage)
                      }

                      override fun onCreateWindow(
                          view: WebView?,
                          isDialog: Boolean,
                          isUserGesture: Boolean,
                          resultMsg: android.os.Message?
                      ): Boolean {
                          if (view == null || resultMsg == null) return false
                          if (!isUserGesture && redirectProtectionEnabled) {
                              return false
                          }
                          val transport = resultMsg.obj as? WebView.WebViewTransport ?: return false
                          val tempWebView = WebView(this@MediaSnifferActivity).apply {
                              settings.javaScriptEnabled = true
                              settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                              if (currentUserAgent.isNotBlank()) {
                                  settings.userAgentString = currentUserAgent
                              }
                          }
                          var delivered = false
                          fun forwardAndDispose(tView: WebView?, rawTarget: String?) {
                              val targetUrl = rawTarget?.trim().orEmpty()
                              if (targetUrl.isBlank() || targetUrl.equals("about:blank", ignoreCase = true)) {
                                  return
                              }
                              if (delivered) return
                              delivered = true
                              val parsed = try { Uri.parse(targetUrl) } catch (_: Throwable) { null }
                              val scheme = parsed?.scheme?.lowercase(Locale.US) ?: ""
                              val host = parsed?.host?.lowercase(Locale.US) ?: ""
                              val currentHost = try { Uri.parse(currentPageUrl).host?.lowercase(Locale.US) ?: "" } catch (_: Throwable) { "" }
                              val blockedAd = redirectProtectionEnabled && isBlockedAdHost(host)
                              val sameDomainOrDirectMedia = (currentHost.isNotBlank() && sameRootDomain(currentHost, host)) ||
                                  looksLikeDirectMediaUrl(targetUrl)

                              if ((scheme == "http" || scheme == "https") && !blockedAd && sameDomainOrDirectMedia) {
                                  redirectGraceUntilMs = System.currentTimeMillis() + REDIRECT_GRACE_MS
                                  view.loadUrl(targetUrl)
                              } else if (scheme == "http" || scheme == "https") {
                                  Toast.makeText(
                                      this@MediaSnifferActivity,
                                      "تم منع نافذة خارجية منبثقة (${host.ifBlank { "إعلان" }})",
                                      Toast.LENGTH_SHORT
                                  ).show()
                              }
                              tView?.post {
                                  try {
                                      tView.stopLoading()
                                      tView.destroy()
                                  } catch (_: Throwable) {
                                  }
                              }
                          }
                          tempWebView.webViewClient = object : WebViewClient() {
                              override fun shouldOverrideUrlLoading(tView: WebView?, req: WebResourceRequest?): Boolean {
                                  forwardAndDispose(tView, req?.url?.toString())
                                  return true
                              }

                              override fun onPageStarted(tView: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                                  forwardAndDispose(tView, url)
                              }
                          }
                          tempWebView.postDelayed({
                              if (!delivered) {
                                  try {
                                      tempWebView.stopLoading()
                                      tempWebView.destroy()
                                  } catch (_: Throwable) {
                                  }
                              }
                          }, 5000L)
                          transport.webView = tempWebView
                          resultMsg.sendToTarget()
                          return true
                      }

                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          if (newProgress in 1..99) {
                              progressBar.visibility = View.VISIBLE
                              progressBar.progress = newProgress
                          } else {
                              progressBar.visibility = View.GONE
                          }
                      }

                      override fun onReceivedTitle(view: WebView?, title: String?) {
                          if (!title.isNullOrBlank()) {
                              currentPageTitle = title.trim()
                          }
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                          errorBannerText.visibility = View.GONE
                          if (!url.isNullOrBlank()) {
                              currentPageUrl = url
                              urlInput.setText(url)
                          }
                          if (view != null) {
                              currentUserAgent = view.settings.userAgentString.orEmpty()
                          }
                      }

                      override fun doUpdateVisitedHistory(view: WebView?, url: String?, isReload: Boolean) {
                          if (!url.isNullOrBlank()) {
                              currentPageUrl = url
                              urlInput.setText(url)
                              saveLastVisitedUrl(url)
                          }
                      }

                      private fun isTrivialNonMediaAsset(request: WebResourceRequest): Boolean {
                          val urlStr = request.url?.toString().orEmpty()
                          val cleanPath = urlStr.substringBefore('?').substringBefore('#').lowercase(Locale.US)
                          val ext = cleanPath.substringAfterLast('.', "")
                          if (ext in IGNORED_ERROR_ASSET_EXTS) return true
                          val accept = request.requestHeaders?.entries
                              ?.firstOrNull { it.key.equals("Accept", ignoreCase = true) }
                              ?.value?.lowercase(Locale.US).orEmpty()
                          return accept.startsWith("image/") || accept.startsWith("text/css") || accept.startsWith("font/")
                      }

                      override fun onReceivedError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          error: WebResourceError?
                      ) {
                          if (request == null) return
                          val errCode = error?.errorCode ?: 0
                          val errDesc = error?.description?.toString()?.trim().orEmpty()
                          if (errDesc.contains("ERR_ABORTED", ignoreCase = true) || errDesc.contains("ERR_CACHE_MISS", ignoreCase = true)) {
                              return
                          }
                          val failedHost = try { request.url?.host?.lowercase(Locale.US).orEmpty() } catch (_: Throwable) { "" }
                          if (!request.isForMainFrame) {
                              if (isTrivialNonMediaAsset(request) || isBlockedAdHost(failedHost)) return
                          }
                          val msg = if (request.isForMainFrame) {
                              if (errDesc.isNotBlank()) "تعذر فتح ${failedHost.ifBlank { "الصفحة" }}: $errDesc"
                              else "فشل الاتصال بالصفحة (رمز الخطأ: $errCode)"
                          } else {
                              "فشل تحميل إطار/مصدر (${failedHost.ifBlank { "iframe" }}): ${errDesc.ifBlank { "رمز $errCode" }}"
                          }
                          runOnUiThread {
                              errorBannerText.text = "$msg  ✕"
                              errorBannerText.visibility = View.VISIBLE
                              if (request.isForMainFrame) {
                                  Toast.makeText(this@MediaSnifferActivity, msg, Toast.LENGTH_SHORT).show()
                              }
                          }
                      }

                      override fun onReceivedHttpError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          errorResponse: WebResourceResponse?
                      ) {
                          if (request == null || errorResponse == null) return
                          val statusCode = errorResponse.statusCode
                          if (statusCode < 400) return
                          val failedHost = try { request.url?.host?.lowercase(Locale.US).orEmpty() } catch (_: Throwable) { "" }
                          if (!request.isForMainFrame) {
                              if (isTrivialNonMediaAsset(request) || isBlockedAdHost(failedHost)) return
                          }
                          val mime = errorResponse.mimeType?.lowercase(Locale.US).orEmpty()
                          if (!request.isForMainFrame && (mime.startsWith("image/") || mime.contains("css") || mime.contains("font"))) {
                              return
                          }
                          val label = if (request.isForMainFrame) "الصفحة" else "إطار/مصدر"
                          val msg = "فشل $label (${failedHost.ifBlank { "المشغل" }}): HTTP $statusCode"
                          runOnUiThread {
                              errorBannerText.text = "$msg  ✕"
                              errorBannerText.visibility = View.VISIBLE
                          }
                      }

                      @SuppressLint("WebViewClientOnReceivedSslError")
                      override fun onReceivedSslError(
                          view: WebView?,
                          handler: SslErrorHandler?,
                          error: SslError?
                      ) {
                          // السماح بموارد مشغلات الفيديو المضمنة ذات الشهادات غير القياسية
                          handler?.proceed()
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          if (!url.isNullOrBlank()) {
                              currentPageUrl = url
                              urlInput.setText(url)
                              saveLastVisitedUrl(url)
                          }
                          // حقن فحص DOM لاستخراج وسوم <video>/<source>/<track> بأمان مع استبعاد روابط blob:
                          val domHookJs = """
                              (function(){
                                try {
                                  if (!window.AndroidSnifferBridge) return;
                                  function isHttpUrl(u) {
                                    return typeof u === 'string' && u.indexOf('blob:') !== 0 && /^https?:\/\//i.test(u);
                                  }
                                  function scanMedia() {
                                    var vids = document.querySelectorAll('video, source');
                                    for (var i = 0; i < vids.length; i++) {
                                      var src = vids[i].currentSrc || vids[i].src || '';
                                      if (isHttpUrl(src)) {
                                        window.AndroidSnifferBridge.onDomMediaFound(src, 'VIDEO', '');
                                      }
                                    }
                                    var tracks = document.querySelectorAll('track');
                                    for (var j = 0; j < tracks.length; j++) {
                                      var tSrc = tracks[j].src || '';
                                      var tKind = (tracks[j].kind || '').toLowerCase();
                                      if (isHttpUrl(tSrc) && (tKind === 'subtitles' || tKind === 'captions' || /\.(srt|vtt)(\?|$)/i.test(tSrc))) {
                                        window.AndroidSnifferBridge.onDomMediaFound(tSrc, 'SUBTITLE', tracks[j].label || tracks[j].srclang || 'Subtitle');
                                      }
                                    }
                                  }
                                  scanMedia();
                                  if (!window.__dlnaDomHooked) {
                                    window.__dlnaDomHooked = true;
                                    setInterval(scanMedia, 2500);
                                  }
                                } catch(e) {}
                              })();
                          """.trimIndent()
                          view?.evaluateJavascript(domHookJs, null)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val uri = request?.url ?: return false
                          val urlStr = uri.toString()
                          val scheme = uri.scheme?.lowercase(Locale.US) ?: ""
                          // حظر مخططات التطبيقات الخارجية فقط والسماح بمخططات المتصفح الداخلية (about/data/blob/javascript)
                          if (scheme in EXTERNAL_APP_SCHEMES) {
                              return true
                          }
                          if (scheme in INTERNAL_WEB_SCHEMES && scheme != "http" && scheme != "https") {
                              return false
                          }
                          if (scheme != "http" && scheme != "https") {
                              return true
                          }

                          val host = uri.host?.lowercase(Locale.US) ?: ""
                          if (redirectProtectionEnabled && isBlockedAdHost(host)) {
                              return true
                          }

                          // السماح دائماً بتحميل الإطارات الفرعية (iframes) لمشغلات الفيديو المضمنة
                          if (!request.isForMainFrame) {
                              return false
                          }

                          val currentHost = try { Uri.parse(currentPageUrl).host?.lowercase(Locale.US) ?: "" } catch (_: Throwable) { "" }
                          val fromSearchEngine = isSearchEngineHost(currentHost)

                          // فتح نافذة سماح 8 ثوانٍ عند النقر أو الانتقال من محرك بحث (للسماح بتحويلات 301/302 و Cloudflare)
                          if (fromSearchEngine || isSearchEngineHost(host)) {
                              redirectGraceUntilMs = System.currentTimeMillis() + REDIRECT_GRACE_MS
                              return false
                          }

                          // السماح دائماً بالنقرات الحقيقية للمستخدم
                          if (request.hasGesture()) {
                              return false
                          }

                          if (redirectProtectionEnabled && request.isRedirect) {
                              val withinGrace = System.currentTimeMillis() <= redirectGraceUntilMs
                              if (!withinGrace && currentHost.isNotBlank() && host.isNotBlank() &&
                                  !sameRootDomain(currentHost, host) && !looksLikeDirectMediaUrl(urlStr)
                              ) {
                                  return true
                              }
                          }
                          return false
                      }

                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val uri = request?.url ?: return null
                          val urlStr = uri.toString()
                          val scheme = uri.scheme?.lowercase(Locale.US) ?: ""
                          if (scheme != "http" && scheme != "https") return null

                          val host = uri.host?.lowercase(Locale.US) ?: ""
                          if (redirectProtectionEnabled && isBlockedAdHost(host)) {
                              return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0)))
                          }

                          val reqHeaders = request.requestHeaders ?: emptyMap()
                          val pageUrlSnap = currentPageUrl
                          val uaSnap = currentUserAgent

                          classifyAndCaptureFromNetwork(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                          return null
                      }
                  }
              }

              inner class SnifferJsBridge {
                  @JavascriptInterface
                  fun onDomMediaFound(rawUrl: String?, kind: String?, label: String?) {
                      val cleanUrl = rawUrl?.trim().orEmpty()
                      if (!cleanUrl.startsWith("http", ignoreCase = true)) return
                      val pageUrlSnap = currentPageUrl
                      val uaSnap = currentUserAgent
                      val headers = buildCapturedHeaders(cleanUrl, emptyMap(), pageUrlSnap, uaSnap)
                      val safeKind = if (kind == "SUBTITLE") "SUBTITLE" else "VIDEO"
                      val cleanPath = cleanUrl.substringBefore('?').substringBefore('#').lowercase(Locale.US)
                      if (safeKind == "VIDEO" && shouldSkipNoiseSegment(cleanUrl, cleanPath)) return
                      val guessedMime = guessMime(cleanPath, safeKind)
                      if (safeKind == "SUBTITLE" || cleanPath.endsWith(".m3u8")) {
                          addCapturedItem(
                              SniffedMediaItem(
                                  url = cleanUrl,
                                  kind = safeKind,
                                  mimeType = guessedMime,
                                  label = label?.takeIf { it.isNotBlank() } ?: "",
                                  headers = headers,
                                  priorityScore = computePriorityScore(cleanPath, safeKind),
                                  fromDom = true
                              )
                          )
                      } else if (probedUrls.add(cleanUrl)) {
                          val isKnownVideo = isKnownVideoFilePath(cleanPath)
                          sniffExecutor.execute {
                              probeMediaAsync(cleanUrl, headers, isKnownVideo, guessedMime, label.orEmpty(), fromDom = true)
                          }
                      }
                  }
              }

              private fun cleanWebViewUserAgent(rawUa: String): String {
                  if (rawUa.isBlank()) return ""
                  var cleaned = WV_TOKEN_REGEX.replace(rawUa, "")
                  cleaned = VERSION_TOKEN_REGEX.replace(cleaned, "")
                  cleaned = cleaned.replace("(;", "(").replace("; )", ")")
                  return cleaned.replace(Regex("\\s{2,}"), " ").trim()
              }

              private fun saveLastVisitedUrl(url: String) {
                  if (!url.startsWith("http", ignoreCase = true)) return
                  getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY_LAST_URL, url)
                      .apply()
              }

              private fun toggleRedirectProtection() {
                  redirectProtectionEnabled = !redirectProtectionEnabled
                  if (redirectProtectionEnabled) {
                      redirectShieldBtn.text = "حماية: تشغيل"
                      redirectShieldBtn.background = roundedBg("#0F2418", "#22C55E", 8)
                      redirectShieldBtn.setTextColor(Color.parseColor("#4ADE80"))
                      Toast.makeText(this, "تم تفعيل مانع التحويلات المنبثقة", Toast.LENGTH_SHORT).show()
                  } else {
                      redirectShieldBtn.text = "حماية: إيقاف"
                      redirectShieldBtn.background = roundedBg("#2A1D0D", "#F59E0B", 8)
                      redirectShieldBtn.setTextColor(Color.parseColor("#FBBF24"))
                      Toast.makeText(this, "تم إيقاف مانع التحويلات مؤقتاً", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun toggleDesktopMode() {
                  isDesktopMode = !isDesktopMode
                  val settings = webView.settings
                  if (isDesktopMode) {
                      settings.userAgentString = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                      desktopBtn.background = roundedBg("#0EA5E9", "#38BDF8", 8)
                      desktopBtn.setTextColor(Color.WHITE)
                  } else {
                      settings.userAgentString = defaultCleanMobileUa.ifBlank { null }
                      desktopBtn.background = roundedBg("#181E2A", "#252E3E", 8)
                      desktopBtn.setTextColor(Color.parseColor("#CBD5E1"))
                  }
                  currentUserAgent = settings.userAgentString.orEmpty()
                  redirectGraceUntilMs = System.currentTimeMillis() + REDIRECT_GRACE_MS
                  webView.reload()
              }

              private fun navigateFromInput() {
                  val raw = urlInput.text?.toString()?.trim().orEmpty()
                  if (raw.isEmpty()) return
                  val target = when {
                      raw.startsWith("http://", ignoreCase = true) || raw.startsWith("https://", ignoreCase = true) -> raw
                      raw.contains('.') && !raw.contains(' ') -> "https://$raw"
                      else -> "https://www.google.com/search?q=" + URLEncoder.encode(raw, "UTF-8")
                  }
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
                  imm?.hideSoftInputFromWindow(urlInput.windowToken, 0)
                  urlInput.clearFocus()
                  redirectGraceUntilMs = System.currentTimeMillis() + REDIRECT_GRACE_MS
                  webView.loadUrl(target)
              }

              private fun isSearchEngineHost(host: String): Boolean {
                  if (host.isBlank()) return false
                  return SEARCH_ENGINE_HOST_REGEX.matches(host)
              }

              private fun isBlockedAdHost(host: String): Boolean {
                  if (host.isBlank()) return false
                  return AD_HOST_KEYWORDS.any { host.contains(it) }
              }

              private fun sameRootDomain(h1: String, h2: String): Boolean {
                  if (h1 == h2) return true
                  val p1 = h1.split('.').takeLast(2).joinToString(".")
                  val p2 = h2.split('.').takeLast(2).joinToString(".")
                  return p1.isNotBlank() && p1 == p2
              }

              private fun looksLikeDirectMediaUrl(url: String): Boolean {
                  val p = url.substringBefore('?').lowercase(Locale.US)
                  return p.endsWith(".m3u8") || p.endsWith(".mp4") || p.endsWith(".mkv") || p.endsWith(".webm")
              }

              private fun isKnownVideoFilePath(cleanPath: String): Boolean {
                  return cleanPath.endsWith(".mp4") ||
                      cleanPath.endsWith(".mkv") ||
                      cleanPath.endsWith(".webm") ||
                      cleanPath.endsWith(".mov")
              }

              private fun shouldSkipNoiseSegment(urlStr: String, cleanPath: String): Boolean {
                  val lowerFull = urlStr.lowercase(Locale.US)
                  if (lowerFull.contains("admn-") ||
                      lowerFull.contains("avod") ||
                      lowerFull.contains("/mpd/") ||
                      lowerFull.contains("doubleclick") ||
                      lowerFull.contains("googlesyndication") ||
                      lowerFull.contains("vast") ||
                      lowerFull.contains("vmap") ||
                      lowerFull.contains("preroll")
                  ) {
                      return true
                  }
                  if (cleanPath.endsWith(".mpd")) return true
                  if (SEGMENT_NOISE_REGEX.containsMatchIn(cleanPath)) return true
                  if (cleanPath.endsWith(".ts") && hasCapturedPlaylist) return true
                  return false
              }

              private fun guessMime(cleanPath: String, kind: String): String {
                  if (kind == "SUBTITLE") {
                      return if (cleanPath.endsWith(".vtt")) "text/vtt" else "text/srt"
                  }
                  return when {
                      cleanPath.endsWith(".m3u8") -> "application/vnd.apple.mpegurl"
                      cleanPath.endsWith(".mkv") -> "video/x-matroska"
                      cleanPath.endsWith(".ts") -> "video/mp2t"
                      cleanPath.endsWith(".webm") -> "video/webm"
                      cleanPath.endsWith(".mov") -> "video/quicktime"
                      else -> "video/mp4"
                  }
              }

              private fun computePriorityScore(cleanPath: String, kind: String): Int {
                  if (kind == "SUBTITLE") return 50
                  return when {
                      cleanPath.endsWith(".m3u8") -> 100
                      cleanPath.endsWith(".mp4") || cleanPath.endsWith(".mkv") -> 90
                      cleanPath.endsWith(".webm") || cleanPath.endsWith(".mov") -> 80
                      else -> 70
                  }
              }

              private fun computeSecFetchSite(targetUrl: String, contextUrl: String): String {
                  if (contextUrl.isBlank() || !contextUrl.startsWith("http", ignoreCase = true)) {
                      return "none"
                  }
                  return try {
                      val targetUri = Uri.parse(targetUrl)
                      val ctxUri = Uri.parse(contextUrl)
                      val tHost = targetUri.host?.lowercase(Locale.US).orEmpty()
                      val cHost = ctxUri.host?.lowercase(Locale.US).orEmpty()
                      val tScheme = targetUri.scheme?.lowercase(Locale.US).orEmpty()
                      val cScheme = ctxUri.scheme?.lowercase(Locale.US).orEmpty()
                      when {
                          tHost.isBlank() || cHost.isBlank() -> "cross-site"
                          tScheme == cScheme && tHost == cHost && targetUri.port == ctxUri.port -> "same-origin"
                          sameRootDomain(tHost, cHost) -> "same-site"
                          else -> "cross-site"
                      }
                  } catch (_: Throwable) {
                      "cross-site"
                  }
              }

              private fun buildCapturedHeaders(
                  targetUrl: String,
                  reqHeaders: Map<String, String>,
                  pageUrlSnap: String,
                  uaSnap: String
              ): Map<String, String> {
                  val out = HashMap<String, String>()
                  val blockedKeys = setOf(
                      "x-requested-with",
                      "host",
                      "range",
                      "content-length",
                      "accept-encoding",
                      "connection",
                      "keep-alive",
                      "transfer-encoding",
                      "te",
                      "trailer",
                      "upgrade",
                      "proxy-authenticate",
                      "proxy-authorization"
                  )
                  for ((k, v) in reqHeaders) {
                      val cleanKey = k.trim()
                      val cleanVal = v.trim()
                      if (cleanKey.isBlank() || cleanVal.isBlank()) continue
                      val lower = cleanKey.lowercase(Locale.US)
                      if (lower in blockedKeys) continue
                      val canonicalKey = when (lower) {
                          "referer", "referrer" -> "Referer"
                          "user-agent" -> "User-Agent"
                          "origin" -> "Origin"
                          "authorization" -> "Authorization"
                          "accept" -> "Accept"
                          "accept-language" -> "Accept-Language"
                          "cookie" -> "Cookie"
                          else -> cleanKey
                      }
                      out[canonicalKey] = cleanVal
                  }
                  if (out.keys.none { it.equals("Referer", ignoreCase = true) } && pageUrlSnap.startsWith("http", ignoreCase = true)) {
                      out["Referer"] = pageUrlSnap
                  }
                  if (out.keys.none { it.equals("User-Agent", ignoreCase = true) } && uaSnap.isNotBlank()) {
                      out["User-Agent"] = uaSnap
                  }

                  val targetHost = try { Uri.parse(targetUrl).host?.lowercase(Locale.US).orEmpty() } catch (_: Throwable) { "" }
                  val pageHost = try { Uri.parse(pageUrlSnap).host?.lowercase(Locale.US).orEmpty() } catch (_: Throwable) { "" }
                  val sameRootForCookie = targetHost.isNotBlank() && pageHost.isNotBlank() && sameRootDomain(targetHost, pageHost)

                  try {
                      val cm = CookieManager.getInstance()
                      val directCookie = cm.getCookie(targetUrl)
                      val pageCookie = if (directCookie.isNullOrBlank() && sameRootForCookie && pageUrlSnap.startsWith("http", ignoreCase = true)) {
                          cm.getCookie(pageUrlSnap)
                      } else null
                      val finalCookie = directCookie?.takeIf { it.isNotBlank() } ?: pageCookie
                      if (!finalCookie.isNullOrBlank()) {
                          out["Cookie"] = finalCookie
                      }
                  } catch (_: Throwable) {
                  }

                  val ctxForFetchSite = out.entries.firstOrNull { it.key.equals("Origin", ignoreCase = true) }?.value
                      ?: out.entries.firstOrNull { it.key.equals("Referer", ignoreCase = true) }?.value
                      ?: pageUrlSnap
                  val cleanPath = targetUrl.substringBefore('?').substringBefore('#').lowercase(Locale.US)
                  val isDirectProgressVideo = isKnownVideoFilePath(cleanPath)

                  if (out.keys.none { it.equals("Sec-Fetch-Site", ignoreCase = true) }) {
                      out["Sec-Fetch-Site"] = computeSecFetchSite(targetUrl, ctxForFetchSite)
                  }
                  if (out.keys.none { it.equals("Sec-Fetch-Mode", ignoreCase = true) }) {
                      val hasOrigin = out.keys.any { it.equals("Origin", ignoreCase = true) }
                      out["Sec-Fetch-Mode"] = if (isDirectProgressVideo && !hasOrigin) "no-cors" else "cors"
                  }
                  if (out.keys.none { it.equals("Sec-Fetch-Dest", ignoreCase = true) }) {
                      val hasOrigin = out.keys.any { it.equals("Origin", ignoreCase = true) }
                      out["Sec-Fetch-Dest"] = if (isDirectProgressVideo && !hasOrigin) "video" else "empty"
                  }
                  return out
              }

              private fun classifyAndCaptureFromNetwork(
                  urlStr: String,
                  reqHeaders: Map<String, String>,
                  pageUrlSnap: String,
                  uaSnap: String
              ) {
                  val cleanPath = urlStr.substringBefore('?').substringBefore('#').lowercase(Locale.US)

                  if (cleanPath.endsWith(".srt") || cleanPath.endsWith(".vtt")) {
                      val headers = buildCapturedHeaders(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                      addCapturedItem(
                          SniffedMediaItem(
                              url = urlStr,
                              kind = "SUBTITLE",
                              mimeType = guessMime(cleanPath, "SUBTITLE"),
                              label = if (cleanPath.endsWith(".vtt")) "VTT Subtitle" else "SRT Subtitle",
                              headers = headers,
                              priorityScore = 50
                          )
                      )
                      return
                  }

                  if (cleanPath.endsWith(".m3u8") || cleanPath.endsWith(".ts")) {
                      if (shouldSkipNoiseSegment(urlStr, cleanPath)) return
                      if (cleanPath.endsWith(".m3u8")) {
                          hasCapturedPlaylist = true
                      }
                      val headers = buildCapturedHeaders(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                      addCapturedItem(
                          SniffedMediaItem(
                              url = urlStr,
                              kind = "VIDEO",
                              mimeType = guessMime(cleanPath, "VIDEO"),
                              label = "",
                              headers = headers,
                              priorityScore = computePriorityScore(cleanPath, "VIDEO")
                          )
                      )
                      return
                  }

                  if (isKnownVideoFilePath(cleanPath)) {
                      if (shouldSkipNoiseSegment(urlStr, cleanPath)) return
                      if (probedUrls.add(urlStr)) {
                          val headers = buildCapturedHeaders(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                          val guessed = guessMime(cleanPath, "VIDEO")
                          sniffExecutor.execute {
                              probeMediaAsync(urlStr, headers, isKnownVideoExt = true, fallbackMime = guessed, customLabel = "")
                          }
                      }
                      return
                  }

                  // تجاهل الامتدادات غير المرئية أو السكربتات الثابتة قبل السبر بالخلفية
                  if (cleanPath.endsWith(".js") || cleanPath.endsWith(".css") || cleanPath.endsWith(".png") ||
                      cleanPath.endsWith(".jpg") || cleanPath.endsWith(".jpeg") || cleanPath.endsWith(".webp") ||
                      cleanPath.endsWith(".svg") || cleanPath.endsWith(".woff2") || cleanPath.endsWith(".gif") ||
                      cleanPath.endsWith(".ico")
                  ) {
                      return
                  }

                  val hasRange = reqHeaders.keys.any { it.equals("Range", ignoreCase = true) }
                  val accept = reqHeaders.entries.firstOrNull { it.key.equals("Accept", ignoreCase = true) }?.value?.lowercase(Locale.US).orEmpty()
                  val lowerFull = urlStr.lowercase(Locale.US)
                  val looksCandidate = hasRange ||
                      accept.contains("video/") ||
                      accept.contains("mpegurl") ||
                      lowerFull.contains("m3u8") ||
                      lowerFull.contains("mime=video") ||
                      lowerFull.contains("playlist") ||
                      lowerFull.contains("manifest") ||
                      lowerFull.contains("/hls/") ||
                      lowerFull.contains("/stream")

                  if (looksCandidate && !shouldSkipNoiseSegment(urlStr, cleanPath) && probedUrls.add(urlStr)) {
                      val headers = buildCapturedHeaders(urlStr, reqHeaders, pageUrlSnap, uaSnap)
                      sniffExecutor.execute {
                          probeMediaAsync(urlStr, headers, isKnownVideoExt = false, fallbackMime = "video/mp4", customLabel = "")
                      }
                  }
              }

              private fun probeMediaAsync(
                  urlStr: String,
                  headers: Map<String, String>,
                  isKnownVideoExt: Boolean,
                  fallbackMime: String,
                  customLabel: String,
                  fromDom: Boolean = false
              ) {
                  val cleanPath = urlStr.substringBefore('?').substringBefore('#').lowercase(Locale.US)
                  if (shouldSkipNoiseSegment(urlStr, cleanPath)) return

                  var resolvedMime = ""
                  var resolvedLength = -1L
                  var probeSucceeded = false

                  try {
                      val builder = Request.Builder().url(urlStr).head()
                      for ((k, v) in headers) {
                          builder.header(k, v)
                      }
                      builder.header("Accept-Encoding", "identity")
                      sniffHttpClient.newCall(builder.build()).execute().use { resp ->
                          if (resp.isSuccessful) {
                              probeSucceeded = true
                              resolvedMime = resp.header("Content-Type")?.lowercase(Locale.US)?.substringBefore(';').orEmpty()
                              resolvedLength = resp.header("Content-Length")?.toLongOrNull() ?: -1L
                          }
                      }
                  } catch (_: Throwable) {
                  }

                  // إذا رفض الخادم HEAD أو لم يُرجع الحجم لرابط MP4/MKV، نسبر أول بايت عبر Range لاستخراج الحجم الحقيقي
                  if ((resolvedLength <= 0L || !probeSucceeded) && isKnownVideoExt) {
                      try {
                          val rangeBuilder = Request.Builder().url(urlStr).get()
                          for ((k, v) in headers) {
                              rangeBuilder.header(k, v)
                          }
                          rangeBuilder.header("Range", "bytes=0-0")
                          rangeBuilder.header("Accept-Encoding", "identity")
                          sniffHttpClient.newCall(rangeBuilder.build()).execute().use { resp ->
                              if (resp.isSuccessful || resp.code == 206) {
                                  probeSucceeded = true
                                  if (resolvedMime.isBlank()) {
                                      resolvedMime = resp.header("Content-Type")?.lowercase(Locale.US)?.substringBefore(';').orEmpty()
                                  }
                                  val contentRange = resp.header("Content-Range").orEmpty()
                                  val totalFromRange = CONTENT_RANGE_TOTAL_REGEX.find(contentRange)?.groupValues?.getOrNull(1)?.toLongOrNull()
                                  val fullLenOn200 = if (resp.code == 200) resp.header("Content-Length")?.toLongOrNull() else null
                                  resolvedLength = totalFromRange ?: fullLenOn200 ?: resolvedLength
                              }
                          }
                      } catch (_: Throwable) {
                      }
                  }

                  val effectiveMime = resolvedMime.ifBlank { if (isKnownVideoExt) fallbackMime else "" }
                  when {
                      effectiveMime.contains("mpegurl") || effectiveMime.contains("x-mpegurl") -> {
                          hasCapturedPlaylist = true
                          addCapturedItem(
                              SniffedMediaItem(urlStr, "VIDEO", "application/vnd.apple.mpegurl", customLabel.ifBlank { "HLS Stream" }, headers, 98, resolvedLength, fromDom = fromDom)
                          )
                      }
                      effectiveMime.contains("text/vtt") || effectiveMime.contains("subrip") || effectiveMime.contains("x-subrip") -> {
                          addCapturedItem(
                              SniffedMediaItem(urlStr, "SUBTITLE", effectiveMime, customLabel.ifBlank { "Subtitle" }, headers, 50, resolvedLength, fromDom = fromDom)
                          )
                      }
                      effectiveMime.contains("video/") || (isKnownVideoExt && !resolvedMime.contains("text/")) -> {
                          // استبعاد الإعلانات والمعاينات ومقاطع DASH الصغيرة أقل من 3 ميجابايت
                          if (resolvedLength in 1 until MIN_MP4_VIDEO_BYTES) return
                          val finalMime = if (effectiveMime.contains("video/")) effectiveMime else fallbackMime
                          addCapturedItem(
                              SniffedMediaItem(urlStr, "VIDEO", finalMime, customLabel, headers, if (isKnownVideoExt) 90 else 85, resolvedLength, fromDom = fromDom)
                          )
                      }
                  }
              }

              private fun hasRichNetworkHeaders(headers: Map<String, String>): Boolean {
                  return headers.keys.any { k ->
                      val lower = k.lowercase(Locale.US)
                      lower == "referer" || lower == "origin" || lower == "cookie" || lower == "authorization"
                  }
              }

              private fun addCapturedItem(item: SniffedMediaItem) {
                  val lowerUrl = item.url.trim().lowercase(Locale.US)
                  val cleanPath = lowerUrl.substringBefore('?').substringBefore('#')
                  // استبعاد روابط blob: أو أي روابط غير قابلة للبث عبر HTTP/HTTPS أو المقاطع المجزأة
                  if (lowerUrl.startsWith("blob:") || (!lowerUrl.startsWith("http://") && !lowerUrl.startsWith("https://"))) {
                      return
                  }
                  if (item.kind == "VIDEO" && shouldSkipNoiseSegment(item.url, cleanPath)) {
                      return
                  }
                  if (item.kind == "VIDEO" && item.mimeType.contains("mpegurl", ignoreCase = true)) {
                      hasCapturedPlaylist = true
                      // إزالة مقاطع .ts الفردية الملتقطة مسبقاً عند التقاط قائمة HLS
                      val keys = capturedMap.keys.toList()
                      for (k in keys) {
                          if (k.substringBefore('?').lowercase(Locale.US).endsWith(".ts")) {
                              capturedMap.remove(k)
                          }
                      }
                  }

                  val existing = capturedMap[item.url]
                  if (existing != null) {
                      // حماية ترويسات طلبات الشبكة الحقيقية (Referer / Origin / Cookie / Authorization) من استبدالها عبر مسح DOM الدوري
                      if (item.fromDom && (!existing.fromDom || hasRichNetworkHeaders(existing.headers))) {
                          val mergedHeaders = HashMap<String, String>(item.headers).apply {
                              putAll(existing.headers)
                          }
                          val updated = existing.copy(
                              label = existing.label.ifBlank { item.label },
                              headers = mergedHeaders,
                              priorityScore = maxOf(existing.priorityScore, item.priorityScore),
                              contentLengthBytes = maxOf(existing.contentLengthBytes, item.contentLengthBytes)
                          )
                          if (updated == existing) return
                          capturedMap[item.url] = updated
                          runOnUiThread { updateSnifferBadgeAndList() }
                          return
                      }

                      val mergedHeaders = HashMap<String, String>(existing.headers).apply {
                          putAll(item.headers)
                      }
                      capturedMap[item.url] = item.copy(
                          label = item.label.ifBlank { existing.label },
                          headers = mergedHeaders,
                          priorityScore = maxOf(existing.priorityScore, item.priorityScore),
                          contentLengthBytes = maxOf(existing.contentLengthBytes, item.contentLengthBytes),
                          fromDom = existing.fromDom && item.fromDom
                      )
                  } else {
                      capturedMap[item.url] = item
                  }

                  runOnUiThread {
                      updateSnifferBadgeAndList()
                  }
              }

              private fun formatBytes(bytes: Long): String {
                  if (bytes <= 0L) return ""
                  return when {
                      bytes >= 1024L * 1024L * 1024L -> String.format(Locale.US, "%.2f GB", bytes / (1024.0 * 1024.0 * 1024.0))
                      bytes >= 1024L * 1024L -> String.format(Locale.US, "%.1f MB", bytes / (1024.0 * 1024.0))
                      else -> "${bytes / 1024L} KB"
                  }
              }

              private fun updateSnifferBadgeAndList() {
                  val items = capturedMap.values.toList()
                  val videos = items.filter { it.kind == "VIDEO" }
                      .sortedWith(compareByDescending<SniffedMediaItem> { it.priorityScore }.thenByDescending { it.contentLengthBytes })
                  val subs = items.filter { it.kind == "SUBTITLE" }
                  val badgeLabel = if (subs.isNotEmpty()) {
                      "المقاطع (${videos.size}) · ترجمة (${subs.size})"
                  } else {
                      "المقاطع الملتقطة (${videos.size})"
                  }
                  fabBadgeBtn.text = badgeLabel
                  if (videos.isNotEmpty()) {
                      fabBadgeBtn.background = roundedBg("#16A34A", "#4ADE80", 22)
                  } else {
                      fabBadgeBtn.background = roundedBg("#0EA5E9", "#38BDF8", 22)
                  }

                  if (selectedSubtitle != null) {
                      selectedSubLabel.visibility = View.VISIBLE
                      selectedSubLabel.text = "الترجمة المختارة: ${selectedSubtitle!!.url.substringBefore('?').substringAfterLast('/', "sub.srt")}"
                  } else {
                      selectedSubLabel.visibility = View.GONE
                  }

                  mediaListContainer.removeAllViews()
                  if (items.isEmpty()) {
                      emptyStateText.visibility = View.VISIBLE
                      return
                  }
                  emptyStateText.visibility = View.GONE

                  for (vid in videos) {
                      val isHls = vid.mimeType.contains("mpegurl", ignoreCase = true)
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = if (isHls) {
                              roundedBg("#0A1F2E", "#38BDF8", 12)
                          } else {
                              roundedBg("#0B0D11", "#1E2532", 10)
                          }
                          setPadding(dp(10), dp(10), dp(10), dp(10))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              bottomMargin = dp(8)
                          }
                          setOnClickListener {
                              returnCapturedMedia(vid)
                          }
                      }
                      val cleanName = vid.url.substringBefore('?').substringAfterLast('/', "video").ifBlank { "Stream" }
                      val host = try { Uri.parse(vid.url).host ?: "" } catch (_: Throwable) { "" }
                      val hasAuth = vid.headers.containsKey("Cookie") || vid.headers.containsKey("Referer")

                      val cardTitleText: String
                      val cardSubText: String
                      if (isHls) {
                          cardTitleText = "★ بث الفيلم الكامل (HLS .m3u8)"
                          cardSubText = "${host.ifBlank { "Streaming Server" }} · $cleanName${if (hasAuth) " ✓" else ""}"
                      } else {
                          val extBadge = when {
                              vid.mimeType.contains("matroska", ignoreCase = true) -> "MKV"
                              vid.mimeType.contains("webm", ignoreCase = true) -> "WEBM"
                              vid.mimeType.contains("mp2t", ignoreCase = true) -> "TS"
                              else -> "MP4"
                          }
                          val sizeLabel = formatBytes(vid.contentLengthBytes)
                          cardTitleText = if (sizeLabel.isNotBlank()) {
                              "فيديو كامل ($extBadge • $sizeLabel)"
                          } else {
                              "فيديو كامل ($extBadge)"
                          }
                          val nameHint = vid.label.ifBlank { cleanName }
                          cardSubText = "${host.ifBlank { "Direct Server" }} · $nameHint${if (hasAuth) " (يحمل ترويسات حماية ✓)" else ""}"
                      }

                      val titleTv = TextView(this).apply {
                          text = cardTitleText
                          setTextColor(Color.parseColor(if (isHls) "#38BDF8" else "#4ADE80"))
                          textSize = 13f
                          typeface = Typeface.DEFAULT_BOLD
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.MIDDLE
                      }
                      val subTv = TextView(this).apply {
                          text = cardSubText
                          setTextColor(Color.parseColor(if (isHls) "#CBD5E1" else "#94A3B8"))
                          textSize = 11f
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.END
                      }
                      row.addView(titleTv)
                      row.addView(subTv)
                      mediaListContainer.addView(row)
                  }

                  for (sub in subs) {
                      val isSel = selectedSubtitle?.url == sub.url
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = roundedBg(if (isSel) "#12261A" else "#0B0D11", if (isSel) "#22C55E" else "#334155", 10)
                          setPadding(dp(10), dp(8), dp(10), dp(8))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              bottomMargin = dp(6)
                          }
                          setOnClickListener {
                              selectedSubtitle = if (isSel) null else sub
                              updateSnifferBadgeAndList()
                          }
                      }
                      val subName = sub.url.substringBefore('?').substringAfterLast('/', "subtitle.srt")
                      val titleTv = TextView(this).apply {
                          text = "${if (isSel) "✓ " else ""}[ترجمة] ${sub.label.ifBlank { subName }}"
                          setTextColor(Color.parseColor(if (isSel) "#4ADE80" else "#F59E0B"))
                          textSize = 12f
                          typeface = Typeface.DEFAULT_BOLD
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.MIDDLE
                      }
                      val hintTv = TextView(this).apply {
                          text = if (isSel) "مربوطة — اختر الفيديو بالأعلى للإرسال" else "اضغط لربط هذه الترجمة مع الفيديو"
                          setTextColor(Color.parseColor("#94A3B8"))
                          textSize = 10f
                      }
                      row.addView(titleTv)
                      row.addView(hintTv)
                      mediaListContainer.addView(row)
                  }
              }

              private fun returnCapturedMedia(video: SniffedMediaItem) {
                  try {
                      CookieManager.getInstance().flush()
                  } catch (_: Throwable) {
                  }
                  val rootJson = JSONObject()
                  val vidJson = JSONObject().apply {
                      put("url", video.url)
                      put("title", currentPageTitle)
                      put("mimeType", video.mimeType)
                      val hObj = JSONObject()
                      for ((k, v) in video.headers) {
                          hObj.put(k, v)
                      }
                      put("headers", hObj)
                  }
                  rootJson.put("video", vidJson)

                  val sub = selectedSubtitle
                  if (sub != null) {
                      val subJson = JSONObject().apply {
                          put("url", sub.url)
                          put("title", sub.label.ifBlank { sub.url.substringBefore('?').substringAfterLast('/', "sub.srt") })
                          put("mimeType", sub.mimeType)
                          val shObj = JSONObject()
                          for ((k, v) in sub.headers) {
                              shObj.put(k, v)
                          }
                          put("headers", shObj)
                      }
                      rootJson.put("subtitle", subJson)
                  }

                  val resultIntent = Intent().apply {
                      putExtra(EXTRA_RESULT_JSON, rootJson.toString())
                  }
                  setResult(Activity.RESULT_OK, resultIntent)
                  finish()
              }

              override fun onDestroy() {
                  sniffExecutor.shutdownNow()
                  try {
                      webView.stopLoading()
                      webView.destroy()
                  } catch (_: Throwable) {
                  }
                  super.onDestroy()
              }
          }
