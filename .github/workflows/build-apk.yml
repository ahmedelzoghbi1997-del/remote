              fun discoverRenderers(priorityHostIp: String?, timeoutMs: Long = 2600L): List<DlnaRendererDevice> {
                  val locations = LinkedHashSet<String>()
                  val devicesByKey = LinkedHashMap<String, DlnaRendererDevice>()

                  if (!priorityHostIp.isNullOrBlank()) {
                      val cleanIp = priorityHostIp.trim()
                      locations.add("http://$cleanIp:9197/dmr")
                  }

                  val wifiManager = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                  val multicastLock = wifiManager?.createMulticastLock("DlnaSsdpLock")?.apply {
                      setReferenceCounted(false)
                  }

                  var socket: DatagramSocket? = null
                  try {
                      multicastLock?.acquire()
                      socket = DatagramSocket(null).apply {
                          reuseAddress = true
                          soTimeout = 550
                          bind(InetSocketAddress(0))
                      }

                      val ssdpAddr = InetAddress.getByName("239.255.255.250")
                      val queries = listOf(
